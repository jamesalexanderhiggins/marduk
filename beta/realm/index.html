function advanceFromQuiz(qid) {
  // After answering a quiz correctly, fall through to the next quiz tile.
  // Q1 -> Q2 -> Q3 -> Q4 -> Q5 -> Q6 -> Q7 -> Q8 -> Q9 -> Q10 -> Spine (0,+2)
  const n = parseInt(qid.slice(1));
  const coordsByQ = {
    1: [-2, 2], 2: [-1, 2], 3: [1, 2], 4: [2, 2],
    5: [-1, 3], 6: [0, 3], 7: [1, 3],
    8: [-1, 4], 9: [0, 4], 10: [1, 4],
  };
  if (n < 10) {
    const [nx, ny] = coordsByQ[n + 1];
    goTo(nx, ny);
  } else {
    // All ten done — unlock and funnel into the Spine
    unlockMV();
    updateMapBtn();
    goTo(0, 2);
  }
}

function penaltyForTier(tier, x, y) {
  if (tier === 1) {
    // Return to the previous tile (whatever the user came from — best-effort = go south)
    goTo(x, y - 1);
  } else if (tier === 2) {
    // Teleport to a random south-side maze tile
    const t = randomSouthTile();
    goTo(t.x, t.y);
  } else {
    // Tier 3: return to threshold; increment attempts; lock after 3 wipes
    const attempts = incAttempts();
    if (attempts >= 3) {
      setSessionLock();
      renderLock();
      return;
    }
    goTo(0, 5);
  }
}

function renderLock() {
  const p = getP();
  const s = document.getElementById('stage');
  document.getElementById('navArrows').innerHTML = '';
  document.body.style.background = 'radial-gradient(ellipse at center, rgba(60,15,5,0.3), var(--bg) 80%)';
  initStars({count: 100, color: '180,100,80', speed: 0.005});
  startParticles({colors: ['#ff6b2b44', '#c9a84c22'], min: 1, max: 2, speed: 10});

  function fmt() {
    const remaining = Math.max(0, p.lockedUntil - Date.now());
    const h = Math.floor(remaining / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const sec = Math.floor((remaining % 60000) / 1000);
    if (remaining <= 0) return 'Unlocking…';
    return `${h}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s remaining`;
  }

  s.innerHTML = `
    <div class="lock-screen">
      <div class="lock-glyph">𒀭</div>
      <div class="lock-title">The Quiz Is Sealed</div>
      <div class="lock-text">
        You chose wrongly in the deepest chambers three times. The quiz path has sealed itself — not as punishment, but as mercy. <em>Come back when the books have settled inside you.</em>
        <br><br>
        The rest of the Realm remains open. You may still enter through the western, eastern, or southern gates.
      </div>
      <div class="lock-timer" id="lockTimer">${fmt()}</div>
    </div>`;

  // Live countdown — refreshes every second
  const lockInterval = setInterval(() => {
    const el = document.getElementById('lockTimer');
    if (!el) { clearInterval(lockInterval); return; }
    el.textContent = fmt();
    if (Date.now() >= p.lockedUntil) {
      clearInterval(lockInterval);
      el.textContent = 'The seal has lifted. You may try again.';
      el.style.color = 'var(--spirit)';
    }
  }, 1000);
}

/* ── Navigation arrows ────────────────────────── */
function renderNavArrows(x, y) {
  const el = document.getElementById('navArrows');
  el.innerHTML = '';
  const tile = getTile(x, y);
  if (tile.type === 'quiz' || tile.type === 'threshold' || tile.type === 'marduk_view') return;

  // Emily's path: directionally-congruent arrows (left=W, right=E, up=N, down=S)
  if (tile.on_path && tile.on_path.includes('A') && tile.type !== 'house_interior') {
    const myStep = (tile.path_step||{})['A'] ?? 0;
    const total  = PATH_A_SEQ.length;
    const seq    = PATH_A_SEQ;

    // Map dx,dy → CSS arrow class and glyph (map-congruent)
    const dirClass = {'-1,0':'left','1,0':'right','0,1':'up','0,-1':'down'};
    const dirGlyph = {'-1,0':'←','1,0':'→','0,1':'↑','0,-1':'↓'};

    function makeArrow(tx, ty, cx, cy, extraClass='') {
      const dx = tx-cx, dy = ty-cy;
      const key = `${dx},${dy}`;
      const cls = dirClass[key] || 'left';
      const g   = dirGlyph[key] || '←';
      // Check for edge gate in this direction
      const gDir = {left:'W',right:'E',up:'N',down:'S'}[cls];
      const gate = getGate(cx, cy, gDir);
      const solved = gate && isGateSolved(cx, cy, gDir);
      const a = document.createElement('a');
      a.href = '#' + encodeXY(tx, ty);
      a.textContent = g;
      if (gate && !solved) {
        a.className = 'nav-arrow ' + cls + ' gated ' + extraClass;
        a.title = gate.title || 'Gate — solve puzzle to pass';
        a.addEventListener('click', ev => { ev.preventDefault(); openGateOverlay(cx, cy, gDir); });
      } else {
        a.className = 'nav-arrow ' + cls + ' path' + (solved?' gate-solved':'') + (extraClass?' '+extraClass:'');
        a.addEventListener('click', ev => { ev.preventDefault(); goTo(tx, ty); });
      }
      return a;
    }

    // Back arrow (always shown if not at start)
    if (myStep > 0) {
      const [bx,by] = seq[myStep-1];
      el.appendChild(makeArrow(bx,by,x,y));
    }

    // Forward arrow (if not at end — front door is the last tile)
    if (myStep < total-1) {
      const [fx,fy] = seq[myStep+1];
      el.appendChild(makeArrow(fx,fy,x,y));
    }

    // Spooky taunt exits near end (last 5 steps before door)
    const TAUNTS = ["go back — before it's too late",
                    "leave the path now",
                    "she wants your soul",
                    "turn back — you are not ready",
                    "the forest is closing in"];
    if (myStep >= total - 5 && myStep < total - 1) {
      const taunt = TAUNTS[(myStep - (total-5)) % TAUNTS.length];
      for (const [dx,dy] of [[0,1],[0,-1],[-1,0],[1,0]]) {
        const nx=x+dx,ny=y+dy;
        const nb=getTile(nx,ny);
        // Only exits that aren't on path A and aren't house interior
        if (!nb.on_path?.includes('A') && nb.type!=='house_interior'
            && nx>=-(16) && nx<=16 && ny>=-(16) && ny<=16) {
          const key=`${dx},${dy}`;
          const cls=dirClass[key]||'left';
          const g=dirGlyph[key]||'←';
          const a=document.createElement('a');
          a.className='nav-arrow '+cls+' taunt';
          a.href='#'+encodeXY(nx,ny);
          a.textContent=g+' '+taunt;
          a.addEventListener('click',ev=>{ev.preventDefault();goTo(nx,ny);});
          el.appendChild(a);
          break; // only one taunt exit
        }
      }
    }
    return;
  }

  const doors = getDoors(x, y);
  const dirs = [
    {key:'up',    dx: 0, dy: 1, glyph:'↑'},
    {key:'down',  dx: 0, dy:-1, glyph:'↓'},
    {key:'left',  dx:-1, dy: 0, glyph:'←'},
    {key:'right', dx: 1, dy: 0, glyph:'→'},
  ];
  dirs.forEach(d => {
    const door = doors[d.key];
    if (!door || door.sealed) return;
    const dX = x + d.dx, dY = y + d.dy;
    const destTile = getTile(dX, dY);
    const a = document.createElement('a');
    a.href = '#' + encodeXY(dX, dY);
    a.textContent = d.glyph;

    // Check: destination has puzzle lock_entry and not yet solved
    const destPzl = destTile && destTile.puzzle;
    const destLocked = destPzl && destPzl.lock_entry && !isPuzzleSolved(dX, dY);
    // Check: current tile has lock_exit (FBI cell) and not yet solved
    const srcPzl = tile.puzzle;
    const srcExitLocked = srcPzl && srcPzl.lock_exit && !isPuzzleSolved(x, y);

    if (destLocked || srcExitLocked) {
      const lockPzl = destLocked ? destPzl : srcPzl;
      const lockX   = destLocked ? dX : x;
      const lockY   = destLocked ? dY : y;
      a.className = 'nav-arrow ' + d.key + ' puzzle-lock';
      a.title = `Puzzle lock: ${lockPzl.title || 'Challenge'}`;
      a.addEventListener('click', ev => {
        ev.preventDefault();
        showPuzzleOverlay(lockPzl, lockX, lockY);
      });
    } else {
      // Check for edge gate
      const _arDir = d.key==='up'?'N':d.key==='down'?'S':d.key==='left'?'W':'E';
      const _edgeGate = (typeof getGate !== 'undefined') ? getGate(x, y, _arDir) : null;
      const _gateSolvedFlag = _edgeGate && (typeof isGateSolved !== 'undefined') && isGateSolved(x, y, _arDir);
      if (_edgeGate && !_gateSolvedFlag) {
        a.className = 'nav-arrow ' + d.key + ' gated';
        a.style.cssText += 'color:#c084fc;border-color:rgba(192,132,252,0.5);box-shadow:0 0 14px rgba(192,132,252,0.4);';
        a.title = _edgeGate.title || 'Gated';
        a.addEventListener('click', ev => { ev.preventDefault(); openGateOverlay(x, y, _arDir); });
      } else {
        a.className = 'nav-arrow ' + d.key + (_gateSolvedFlag?' gate-solved':'') + (door.path ? ' path' : '');
        a.title = _gateSolvedFlag ? `✓ Solved — Go ${d.key}` : `Go ${d.key}`;
        a.addEventListener('click', ev => { ev.preventDefault(); goTo(dX, dY); });
      }
    }
    el.appendChild(a);
  });
}


/* ── Deterministic coordinate shape for MV tiles ────
 * Each (x,y) produces a unique irregular polygon.
 * No emoji — pure geometry, consistent cross-platform.
 * ─────────────────────────────────────────────────── */
function tileHash(x, y) {
  // Stable integer hash from coordinate pair
  let h = Math.imul(x + 16, 73856093) ^ Math.imul(y + 16, 19349663);
  h = Math.imul((h >>> 16) ^ h, 0x45d9f3b);
  h = Math.imul((h >>> 16) ^ h, 0x45d9f3b);
  h = (h >>> 16) ^ h;
  return h;
}

function seededR(hash, i) {
  let h = hash ^ Math.imul(i, 2246822519);
  h = Math.imul((h >>> 16) ^ h, 0x45d9f3b);
  h = (h >>> 16) ^ h;
  return ((h >>> 0) & 0x7fffffff) / 0x7fffffff;
}

function drawCoordShape(ctx, x, y, cx, cy, r, color, alpha) {
  const h     = tileHash(x, y);
  // 3–6 vertices depending on hash
  const nVerts = 3 + (Math.abs(h) % 4);
  const rot    = seededR(h, 0) * Math.PI * 2;
  // Whether to use star (inner+outer) or simple polygon
  const isStar = seededR(h, 99) > 0.45;
  const innerR = isStar ? (0.28 + seededR(h, 1) * 0.28) : 0;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.2;
  ctx.lineJoin    = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur  = 5;

  ctx.beginPath();
  const total = isStar ? nVerts * 2 : nVerts;
  for (let i = 0; i < total; i++) {
    const baseAngle = rot + (i * Math.PI * 2) / total;
    // Small per-vertex angle jitter makes it organic not mechanical
    const jitter = (seededR(h, i * 5 + 2) - 0.5) * (Math.PI / total) * 0.55;
    const angle  = baseAngle + jitter;
    // Alternate inner/outer for star, vary radius for polygon
    let vr;
    if (isStar) {
      vr = i % 2 === 0 ? r : r * innerR;
    } else {
      vr = r * (0.65 + seededR(h, i * 5 + 3) * 0.35);
    }
    if (i === 0) ctx.moveTo(cx + Math.cos(angle) * vr, cy + Math.sin(angle) * vr);
    else         ctx.lineTo(cx + Math.cos(angle) * vr, cy + Math.sin(angle) * vr);
  }
  ctx.closePath();

  // Fill very faint, stroke visible
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha * 0.12;
  ctx.fill();
  ctx.globalAlpha = alpha;
  ctx.stroke();
  ctx.restore();
}

/* ═══════════════════════════════════════════════
 *  MARDUK VIEW — game-like map (v9.5)
 * ═══════════════════════════════════════════════
 * - Touch-native: dedicated touchstart/move/end handlers
 *   (avoids Pointer Events, which are unreliable in iOS Safari)
 * - Kinetic panning with velocity + decay after flick
 * - Smooth eased zoom (tweens mvZoom -> mvTargetZoom per frame)
 * - Pinch-to-zoom anchored on pinch midpoint (no drift)
 * - Double-tap to zoom in centred on tap point
 * - Tap-to-preview (single tap), tap-again-to-travel
 * - Visual feedback: tap ripple, selected-cell halo pulse
 * - Big default cells (radius 36px) — feels like a strategy map
 * - Continuous rAF loop so zoom / velocity / ripple all ease
 * ═══════════════════════════════════════════════ */

const MV_R = 24;                   // base hex radius at zoom 1
let mvBgRot = 0;                    // background honeycomb rotation angle
const MV_ZOOM_MIN  = 0.5;
const MV_ZOOM_MAX  = 5.5;
const MV_ZOOM_HOME = 1.8;          // default zoom on open / recenter
const MV_ZOOM_EASE = 0.18;         // 0..1 per frame — higher = snappier
const MV_PAN_DECAY = 0.90;         // velocity decay per frame
const MV_PAN_STOP  = 0.35;         // below this px/frame, stop
const MV_TAP_MOVE_PX = 22;         // move threshold for tap vs drag (raised to avoid accidental nav)
const MV_TAP_TIME_MS = 320;
const MV_DBL_TIME_MS = 320;
const MV_DBL_DIST_PX = 36;

let mvZoom       = MV_ZOOM_HOME;
let mvTargetZoom = MV_ZOOM_HOME;
let mvZoomAnchor = null;           // screen point to keep fixed during zoom tween
let mvOffset     = {x: 0, y: 0};
let mvVel        = {x: 0, y: 0};
let mvSelected   = null;
let mvRipples    = [];             // [{x, y, t0}]
let mvRaf        = null;
let mvW = 0, mvH = 0, mvTop = 44;  // canvas logical px — set from window, never from clientWidth
let mvCanvasCtx  = null;
let mvWrapEl     = null;
let mvCanvasEl   = null;
let mvDrawFn     = null;
let mvResizeFn   = null;

function renderMardukView() {
  updateKeyBar();
  document.getElementById('stage').innerHTML = '';
  document.getElementById('navArrows').innerHTML = '';
  const mv = document.getElementById('mv-stage');
  mv.classList.add('show');
  // Hide key bar and kudra bar behind MV header
  const _kb = document.getElementById('keyBar');
  if (_kb) _kb.style.visibility = 'hidden';
  const _mvSub = document.getElementById('mvSub');
  if (_mvSub) _mvSub.textContent = isKudraUnlocked() ? '· All Rooms · KUDRAMARDUK' : '· All Rooms';
  // Cancel any running RAF and init fresh
  if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
  // Call synchronously - sizeCanvas uses window.innerWidth/Height (always valid)
  setupMVCanvas();
  document.body.style.background = 'var(--bg)';
  initStars({count: 320, color: '230,220,190', speed: 0.005});
  startParticles({colors: ['#c9a84c22', '#7eb8d422'], min: 1, max: 2, speed: 12});
}

function setupMVCanvas() {
  // SETUP-ONCE ARCHITECTURE (v9.5): handlers attached on first call only,
  // stay attached forever. Subsequent calls only reset view state + restart RAF.
  // No cloneNode, no AbortController, no setTimeout — eliminates ALL handler
  // accumulation, race conditions, and layout-timing bugs.
  const _firstSetup = !window._mvWired;
  mvWrapEl   = document.getElementById('mv-canvas-wrap');
  mvCanvasEl = document.getElementById('mv-canvas');
  mvCanvasCtx = mvCanvasEl.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  // Set initial state
  mvZoom = mvTargetZoom = MV_ZOOM_HOME;
  mvVel = {x: 0, y: 0};
  mvSelected = null;
  mvRipples = [];
  hideInfoPanel();

  // Centre on player's current tile (not origin)
  const _lp = getP().lastPos || [0, 0];
  const _m0 = {r: MV_R * MV_ZOOM_HOME,
               hexW: Math.sqrt(3) * MV_R * MV_ZOOM_HOME,
               hexH: 2 * MV_R * MV_ZOOM_HOME * 0.75};
  const _stagger0 = (_lp[1] % 2 === 0 ? 0 : _m0.hexW / 2);
  // Offset so player tile is at canvas centre
  mvOffset = {
    x: -(_lp[0] * _m0.hexW + _stagger0),
    y:  (_lp[1] * _m0.hexH)
  };

  function sizeCanvas() {
    mvW = window.innerWidth;
    mvH = window.innerHeight - mvTop;
    mvCanvasEl.width  = Math.floor(mvW * dpr);
    mvCanvasEl.height = Math.floor(mvH * dpr);
    mvCanvasEl.style.width  = mvW + 'px';
    mvCanvasEl.style.height = mvH + 'px';
  }
  sizeCanvas();

  /* ── hex geometry ─────────────────────────────── */
  function metrics() {
    const r = MV_R * mvZoom;
    return {r, hexW: Math.sqrt(3) * r, hexH: 2 * r * 0.75};
  }
  function gridToScreen(x, y, m) {
    m = m || metrics();
    const W = mvW, H = mvH;
    const stagger = (y % 2 === 0 ? 0 : m.hexW / 2);
    const px = W / 2 + mvOffset.x + x * m.hexW + stagger;
    const py = H / 2 + mvOffset.y - y * m.hexH;
    return [px, py];
  }
  function screenToGrid(sx, sy) {
    const W = mvW, H = mvH;
    const m = metrics();
    return {
      gx: (sx - W / 2 - mvOffset.x) / m.hexW,
      gy: (H / 2 + mvOffset.y - sy) / m.hexH,
    };
  }
  function tileAtPixel(sx, sy) {
    const m = metrics();
    let best = null, bestD = Infinity;
    for (let x = -GRID_EXTENT; x <= GRID_EXTENT; x++) {
      for (let y = -GRID_EXTENT; y <= GRID_EXTENT; y++) {
        const [px, py] = gridToScreen(x, y, m);
        const d = Math.hypot(px - sx, py - sy);
        if (d < m.r && d < bestD) {
          bestD = d;
          best = {x, y, info: getTile(x, y)};
        }
      }
    }
    return best;
  }

  /* ── zoom anchor: change zoom while keeping a screen point fixed */
  function setZoomAround(newZoom, anchorSx, anchorSy) {
    newZoom = Math.max(MV_ZOOM_MIN, Math.min(MV_ZOOM_MAX, newZoom));
    const g = screenToGrid(anchorSx, anchorSy);
    mvZoom = newZoom;
    const W = mvW, H = mvH;
    const m = metrics();
    const newSx = W / 2 + mvOffset.x + g.gx * m.hexW;
    const newSy = H / 2 + mvOffset.y - g.gy * m.hexH;
    mvOffset.x += (anchorSx - newSx);
    mvOffset.y += (anchorSy - newSy);
  }

  /* ── drawing ──────────────────────────────────── */
  function drawHex(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 2;
      const hx = x + Math.cos(a) * r;
      const hy = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
  }

  function draw() {
    const W = mvW, H = mvH;
    const ctx = mvCanvasCtx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const m = metrics();
    const {r, hexW, hexH} = m;
    const zoomStage = mvZoom < 0.75 ? 'far' : (mvZoom < 1.6 ? 'mid' : 'near');
    const now = performance.now();

    // ════════════════════════════════════════════════════════════════
    //  BACKGROUND: rotating honeycomb floating in space
    //  • Parallax: background moves at 25% of pan speed → appears distant
    //  • Parallax zoom: bg scales at 60% of game zoom → depth illusion
    //  • Fills entire screen always, hexes cover even void area
    // ════════════════════════════════════════════════════════════════
    mvBgRot += 0.000022;   // slow cosmic rotation
    const HOUSE_COLS_MV = ['#C9A84C','#4A7C59','#7B5EA7','#5B9AB8',
                            '#A83232','#A86A32','#2D8888','#5C2D82'];

    // Parallax-scaled hex size: bg zooms less than game = depth
    const bgZoom = Math.pow(mvZoom, 0.55);
    const BG_R   = 28 * bgZoom;
    const BG_HW  = Math.sqrt(3) * BG_R;
    const BG_HH  = BG_R * 1.5;
    // Parallax pan: bg moves at 25% of game pan offset
    const bgOX = mvOffset.x * 0.25;
    const bgOY = mvOffset.y * 0.25;

    ctx.save();
    // Rotate around screen centre
    ctx.translate(W/2, H/2);
    ctx.rotate(mvBgRot);
    ctx.translate(-W/2, -H/2);

    // Enough cells to cover canvas diagonal + rotation margin
    const bgDiag = Math.hypot(W, H);
    const bgSteps = Math.ceil(bgDiag / BG_HW) + 3;
    const bgCX = W/2 + bgOX, bgCY = H/2 + bgOY;

    for (let bq = -bgSteps; bq <= bgSteps; bq++) {
      for (let br = -bgSteps; br <= bgSteps; br++) {
        const bx = bgCX + bq * BG_HW + (br % 2 === 0 ? 0 : BG_HW * 0.5);
        const by = bgCY - br * BG_HH;   // note: -br so y matches game orientation
        // Only draw cells actually near the canvas
        if (bx < -BG_R*2 || bx > W+BG_R*2 || by < -BG_R*2 || by > H+BG_R*2) continue;
        const ang    = Math.atan2(by - bgCY, bx - bgCX);
        const sector = Math.floor(((ang + Math.PI) / (Math.PI*2)) * 8 + 0.5) % 8;
        const col    = HOUSE_COLS_MV[sector];
        const dist   = Math.hypot(bx - bgCX, by - bgCY) / (bgDiag * 0.55);
        const fade   = Math.max(0.03, 0.14 - dist * 0.09);
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = Math.PI/3*i - Math.PI/2;
          i===0 ? ctx.moveTo(bx + Math.cos(a)*BG_R, by + Math.sin(a)*BG_R)
                : ctx.lineTo(bx + Math.cos(a)*BG_R, by + Math.sin(a)*BG_R);
        }
        ctx.closePath();
        ctx.fillStyle   = col + Math.round(fade * 255).toString(16).padStart(2,'0');
        ctx.strokeStyle = col + Math.round(fade * 1.8 * 255).toString(16).padStart(2,'0');
        ctx.lineWidth   = 0.8;
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.restore();

    // ════════════════════════════════════════════════════════════════
    //  INFINITE VOID GRID: black hexes covering ALL positions on screen
    //  Both inside and outside ±GRID_EXTENT — game tiles overwrite inside
    //  Uses gridToScreen so void cells align perfectly with game cells
    // ════════════════════════════════════════════════════════════════
    // Correct visible range: screen top = highest grid y, screen bottom = lowest
    const vMinX = Math.floor((-W/2 - mvOffset.x) / hexW) - 2;
    const vMaxX = Math.ceil( ( W/2 - mvOffset.x) / hexW) + 2;
    const vMaxY = Math.ceil( (mvOffset.y + H/2)  / hexH) + 2;  // screen top → max grid y
    const vMinY = Math.floor((mvOffset.y - H/2)  / hexH) - 2;  // screen bot → min grid y
    // Void hexes: stroke only — background honeycomb shows through as colour
    ctx.fillStyle   = 'rgba(0,0,0,0)';          // transparent: rainbow bleeds through
    ctx.strokeStyle = 'rgba(30,18,50,0.45)';    // faint seam defines the grid
    ctx.lineWidth   = 0.6;
    for (let vx = vMinX; vx <= vMaxX; vx++) {
      for (let vy = vMinY; vy <= vMaxY; vy++) {
        if (Math.abs(vx) <= GRID_EXTENT && Math.abs(vy) <= GRID_EXTENT) continue;
        const [vpx, vpy] = gridToScreen(vx, vy, m);
        drawHex(ctx, vpx, vpy, r);
        ctx.stroke();
      }
    }

    // KUDRAMARDUK path overlay
    if (isKudraUnlocked()) {
      Object.keys(REALM.paths).forEach(pathId => {
        const pts = REALM.paths[pathId];
        ctx.beginPath();
        pts.forEach((pt, i) => {
          const [px, py] = gridToScreen(pt[0], pt[1], m);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = 'rgba(232,201,110,0.75)';
        ctx.lineWidth = Math.max(2, r * 0.14);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(232,201,110,0.8)';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
      });
    }

    const p = getP();
    const visited = new Set(p.visited || []);
    const selKey = mvSelected ? `${mvSelected.x},${mvSelected.y}` : null;

    // Cells
    const padR = r * 2;
    for (let x = -GRID_EXTENT; x <= GRID_EXTENT; x++) {
      for (let y = -GRID_EXTENT; y <= GRID_EXTENT; y++) {
        const [px, py] = gridToScreen(x, y, m);
        if (px < -padR || px > W + padR || py < -padR || py > H + padR) continue;

        const tile      = getTile(x, y);
        const isVisited   = visited.has(`${x},${y}`);
        const isHome      = (x === 0 && y === 0);
        const isMV        = (tile.type === 'marduk_view');
        const isQuiz      = (tile.type === 'quiz');
        const isHouse     = !!tile.house_id;
        const isFrontDoor = (tile.type === 'house_front_door');
        const isCorrectQ  = isQuiz && isCorrect(tile.question_id);
        const hasContent  = tile.type && tile.type !== 'empty';
        const isOnPath    = tile.on_path && tile.on_path.length > 0;
        const houseHex    = tile.house_color || null;
        // Distinct path colours — never match house colours
        const PATH_DISPLAY_COLORS = {
          A:'#5C2D82',B:'#1E5C3A',C:'#8B6914',D:'#1A4D6E',
          E:'#7A2020',F:'#7A4A20',G:'#1A5C5C',H:'#3C1A7A',M:'#7A6520'
        };
        const _ppid   = isOnPath ? tile.on_path.find(p => PATH_DISPLAY_COLORS[p]) : null;
        const pathHex = _ppid ? PATH_DISPLAY_COLORS[_ppid] : null;
        // Path tile: any tile on a path (except home/MV). Paths prioritise over houses.
        const isPurePath = isOnPath && tile.type !== 'home' && tile.type !== 'marduk_view';
        // Empty transit tile — no name, no content, no house, no path, no zone
        const isEmptyTransit = tile.type === 'empty' && !tile.name && !tile.lore
          && !isHouse && !tile.zone_id && !isOnPath;

        // ── Three-state visibility ──────────────────────────────────────
        // preQuiz  : ONLY tiles the user has walked to show any colour.
        //            Everything else is pure black — invisible edge, no grid implied.
        // postQuiz : House/zone/special tiles reveal colour (even unvisited).
        //            Visited tiles of ANY type also remain lit.
        //            Empty transit + ALL path tiles stay pure black.
        // kudra    : Everything shows including path colours.
        const preQuiz  = !isMVUnlocked() && !isKudraUnlocked();
        const postQuiz = isMVUnlocked()  && !isKudraUnlocked();
        const kudra    = isKudraUnlocked();

        // House tiles always show color+key for all users (discover by sight, travel by foot)
        const isHouseTile = (isHouse || isFrontDoor) && !isPurePath;

        const showFull = kudra                   // K: everything
          || isVisited                           // always: walked tiles
          || isHouseTile;                        // houses: always colored for all users

        const isSelected  = selKey === `${x},${y}`;

        // ── Base: everything starts as pure black ──────────────────────
        let fill   = 'rgba(4,2,12,0.98)';
        let stroke = 'rgba(18,14,30,0.18)';
        let lineW  = 0.4;
        let rimColor = null;

        if (!showFull) {
          // Pure black — no stroke, no hex outline. Indistinguishable from paths.
          fill = 'rgba(0,0,0,1)'; stroke = 'rgba(0,0,0,0)'; lineW = 0;
        } else if (isHome)  { fill = 'rgba(232,201,110,0.55)'; stroke = '#e8c96e'; lineW = 2.8; rimColor = 'rgba(232,201,110,0.8)'; }
        else if (isMV)      { fill = 'rgba(232,201,110,0.32)'; stroke = '#c9a84c'; lineW = 2.2; rimColor = 'rgba(232,201,110,0.55)'; }
        // ── PATHS: only in kudra; otherwise black (even if visited) ────
        else if (isPurePath && kudra && pathHex) {
          fill = pathHex + '35'; stroke = pathHex + 'EE'; lineW = 2.2;
          rimColor = pathHex + '99';
        }
        else if (isPurePath && isVisited && !kudra) {
          // Visited path — shows you went there, but no path colour revealed
          fill = 'rgba(40,32,58,0.80)'; stroke = 'rgba(90,70,120,0.30)'; lineW = 0.5;
        }
        // ── HOUSES ──────────────────────────────────────────────────────
        else if (isFrontDoor && houseHex) {
          fill = houseHex + '44'; stroke = houseHex; lineW = 2.8; rimColor = houseHex + 'AA';
        }
        else if (isHouse && houseHex) {
          fill = houseHex + '28'; stroke = houseHex + '88'; lineW = 1.4;
        }
        // ── QUIZ / ZONE / SPECIAL ────────────────────────────────────────
        else if (isCorrectQ){ fill = 'rgba(232,201,110,0.24)'; stroke = '#e8c96e'; lineW = 1.8; rimColor = 'rgba(232,201,110,0.4)'; }
        else if (isQuiz)    { fill = 'rgba(126,184,212,0.14)'; stroke = 'rgba(126,184,212,0.42)'; lineW = 1.4; }
        else if (tile.zone_id) {
          const _zhx = tile.zone_color || '#555555';
          const _zhr = parseInt(_zhx.slice(1,3),16), _zhg = parseInt(_zhx.slice(3,5),16), _zhb = parseInt(_zhx.slice(5,7),16);
          const _zUnlocked = hasAllKeys((tile.keys_required)||[]);
          if (tile.type === 'locked_zone_threshold') {
            fill = `rgba(${_zhr},${_zhg},${_zhb},0.35)`;
            stroke = _zhx; lineW = 2.2;
            rimColor = _zUnlocked ? `rgba(${_zhr},${_zhg},${_zhb},0.8)` : `rgba(${_zhr},${_zhg},${_zhb},0.35)`;
          } else {
            fill = `rgba(${_zhr},${_zhg},${_zhb},0.18)`;
            stroke = `rgba(${_zhr},${_zhg},${_zhb},0.55)`; lineW = 1.2;
          }
        }
        else if (tile.marduk_eye) {
          const eyePulse = 0.5 + 0.5*Math.sin(now*0.004);
          fill = `rgba(255,240,180,${0.12+eyePulse*0.18})`; stroke = '#D4AF37'; lineW = 2.5;
          rimColor = `rgba(212,175,55,${0.6+eyePulse*0.4})`;
        }
        else if (tile.type === 'special') {
          fill = 'rgba(180,180,200,0.12)'; stroke = 'rgba(200,200,220,0.5)'; lineW = 1.6; rimColor = 'rgba(200,200,220,0.4)';
        }
        else if (isVisited) {
          // Visited empty/content tile (no house, no path): faint gold trace
          fill = 'rgba(201,168,76,0.10)'; stroke = 'rgba(201,168,76,0.25)'; lineW = 0.8;
        }
        // All other cases (unvisited empty/content in kudra): very dark, grid just faintly visible
        // (falls through to base fill set above)

        // Radial inner gradient fill for a "shine"
        drawHex(ctx, px, py, r * 0.94);
        if (showFull && (hasContent || isHome || isMV)) {
          const g = ctx.createRadialGradient(px - r * 0.25, py - r * 0.3, 1, px, py, r * 0.95);
          const fillBase = fill;
          g.addColorStop(0, fillBase.replace(/[\d.]+\)$/, (a) => Math.min(parseFloat(a) + 0.18, 1) + ')'));
          g.addColorStop(1, fillBase);
          ctx.fillStyle = g;
        } else {
          ctx.fillStyle = fill; // dark for !showFull tiles, normal otherwise
        }
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineW;
        ctx.stroke();

        // Rim glow on important tiles (breathing)
        if (rimColor) {
          const breath = 0.55 + 0.45 * Math.sin(now * 0.0022 + (x + y) * 0.3);
          ctx.save();
          ctx.shadowColor = rimColor;
          ctx.shadowBlur = 14 * breath;
          ctx.strokeStyle = rimColor;
          ctx.lineWidth = 0.6;
          drawHex(ctx, px, py, r * 0.94);
          ctx.stroke();
          ctx.restore();
        }

        // Selected halo — bright triple ring + "tap again" label
        if (isSelected) {
          const pulse = 0.65 + 0.35 * Math.sin(now * 0.007);
          ctx.save();
          // Inner ring — solid gold
          ctx.shadowColor = 'rgba(232,201,110,1)';
          ctx.shadowBlur = 28;
          drawHex(ctx, px, py, r * 1.06);
          ctx.strokeStyle = `rgba(232,201,110,${pulse})`;
          ctx.lineWidth = 3.0;
          ctx.stroke();
          // Mid ring
          ctx.shadowBlur = 12;
          drawHex(ctx, px, py, r * 1.22);
          ctx.strokeStyle = `rgba(232,201,110,${pulse * 0.55})`;
          ctx.lineWidth = 1.6;
          ctx.stroke();
          // Outer ring
          ctx.shadowBlur = 0;
          drawHex(ctx, px, py, r * 1.42);
          ctx.strokeStyle = `rgba(232,201,110,${pulse * 0.2})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
          // "tap again" text below the hex
          if (r > 18) {
            ctx.shadowBlur = 0;
            ctx.font = `${Math.min(r * 0.22, 9)}px Cinzel,serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = `rgba(232,201,110,${pulse * 0.85})`;
            ctx.fillText('· tap again ·', px, py + r * 1.55);
          }
          ctx.restore();
        }


        // ── Key symbol — always shown for ALL users (discovery hint) ──────
        if (tile.key_id && KEY_DEFS[tile.key_id] && r > 7) {
          const kdm = KEY_DEFS[tile.key_id];
          const kpulse = 0.55 + 0.35*Math.sin(now*0.002+(x+y)*0.8);
          ctx.save();
          ctx.font = `${Math.min(r*0.62,15)}px Cinzel,serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.globalAlpha = kpulse;
          ctx.fillStyle = kdm.color;
          ctx.shadowColor = kdm.color; ctx.shadowBlur = 10;
          ctx.fillText(kdm.sym, px, py);
          ctx.restore();
        }

        // ── Coord shape + label — only on visible (showFull) tiles ─────────
        if (showFull && zoomStage !== 'far' && r > 9) {
          const cvHasContent = !!(tile.name || tile.lore ||
            tile.type === 'home' || tile.type === 'marduk_view' ||
            tile.type === 'threshold' || tile.type === 'spine' ||
            tile.type === 'quiz' || tile.type === 'house_front_door' ||
            tile.type === 'special' || tile.type === 'locked_zone_threshold' ||
            (tile.on_path && tile.on_path.length > 0 && tile.type !== 'empty'));

          // Coord label
          const cxL = x>=0?`+${x}`:`${x}`, cyL = y>=0?`+${y}`:`${y}`;
          ctx.font = `${Math.min(r*0.28,9)}px "Courier New",monospace`;
          ctx.fillStyle = cvHasContent ? 'rgba(201,168,76,0.55)' : 'rgba(140,140,160,0.35)';
          ctx.textAlign = 'center'; ctx.textBaseline = cvHasContent ? 'bottom' : 'middle';
          ctx.fillText(`${cxL},${cyL}`, px, cvHasContent ? py+r*0.82 : py+r*0.7);

          // Shape
          if (cvHasContent && !tile.key_id) { // skip shape if key already drawn there
            const shapeR = r*0.42;
            let shapeColor = stroke !== 'rgba(13,17,25,0.75)' ? stroke : 'rgba(201,168,76,0.7)';
            if (tile.on_path) {
              const _sp = tile.on_path.find(p => PATH_DISPLAY_COLORS[p]);
              if (_sp) shapeColor = PATH_DISPLAY_COLORS[_sp];
            }
            drawCoordShape(ctx, x, y, px, py-r*0.08, shapeR, shapeColor, 0.55+0.25*Math.sin(now*0.0008+(x*7+y*11)*0.4));

            // Puzzle symbol in KM/SKM mode
            if ((kudra || _skmActive) && tile.puzzle) {
              const pSolved = isPuzzleSolved(x, y);
              const pCol = pSolved ? 'rgba(74,222,128,0.85)' : 'rgba(192,132,252,0.85)';
              const pSize = Math.max(7, r * 0.38);
              ctx.save();
              ctx.font = `${pSize}px monospace`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = pCol;
              ctx.shadowColor = pCol;
              ctx.shadowBlur = 6;
              // ⊛ for unsolved, ✓ for solved
              ctx.fillText(pSolved ? '✓' : '⊛', px, py + r * 0.35);
              ctx.restore();
            }
          }
        }
      }
    }

    // ── Gate lines ──────────────────────
    if (REALM && REALM.gates) drawGateLines(ctx, now, m);

    // ── Player position marker — uses gridToScreen() for exact tile placement ──
    const _pp = getP().lastPos;
    if (_pp) {
      const [pmGx, pmGy] = _pp;
      const [pmPx, pmPy] = gridToScreen(pmGx, pmGy);
      const pmR  = Math.max(8, MV_R * mvZoom * 0.62);
      const pmPulse = 0.75 + 0.25 * Math.sin(now * 0.006);
      ctx.save();
      ctx.shadowColor = 'rgba(80,220,255,0.9)'; ctx.shadowBlur = 18;
      // Outer ring
      ctx.strokeStyle = `rgba(80,220,255,${pmPulse * 0.7})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(pmPx, pmPy, pmR * 1.6, 0, Math.PI*2); ctx.stroke();
      // Solid upward triangle (game piece / cursor)
      ctx.fillStyle = `rgba(80,220,255,${pmPulse})`;
      ctx.beginPath();
      ctx.moveTo(pmPx,            pmPy - pmR * 1.3);
      ctx.lineTo(pmPx - pmR*0.6,  pmPy - pmR * 0.1);
      ctx.lineTo(pmPx + pmR*0.6,  pmPy - pmR * 0.1);
      ctx.closePath(); ctx.fill();
      // Centre dot
      ctx.shadowBlur = 6; ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(pmPx, pmPy, pmR * 0.22, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

        // Tap ripples (gold ring expanding out from tap point)
    mvRipples = mvRipples.filter(rp => now - rp.t0 < 650);
    mvRipples.forEach(rp => {
      const t = (now - rp.t0) / 650; // 0..1
      const rad = 8 + t * 85;
      const alpha = (1 - t) * 0.55;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rad, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(232,201,110,${alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }

  /* ── animation loop: drives zoom easing, velocity decay, redraw ── */
  let panning = false;           // suspends velocity decay while actively dragging
  function loop() {
    mvRaf = requestAnimationFrame(loop);
    // Ensure canvas is sized (catches deferred init and resize)
    // Ensure canvas matches window on resize
    if (window.innerWidth !== mvW || (window.innerHeight - mvTop) !== mvH) sizeCanvas();

    // Ease zoom toward target
    if (Math.abs(mvZoom - mvTargetZoom) > 0.002) {
      if (mvZoomAnchor) {
        const newZ = mvZoom + (mvTargetZoom - mvZoom) * MV_ZOOM_EASE;
        setZoomAround(newZ, mvZoomAnchor.x, mvZoomAnchor.y);
      } else {
        mvZoom = mvZoom + (mvTargetZoom - mvZoom) * MV_ZOOM_EASE;
      }
    } else if (mvZoomAnchor) {
      mvZoomAnchor = null;
    }

    // Apply momentum
    if (!panning && (Math.abs(mvVel.x) > MV_PAN_STOP || Math.abs(mvVel.y) > MV_PAN_STOP)) {
      mvOffset.x += mvVel.x;
      mvOffset.y += mvVel.y;
      mvVel.x *= MV_PAN_DECAY;
      mvVel.y *= MV_PAN_DECAY;
    } else if (!panning) {
      mvVel.x = 0; mvVel.y = 0;
    }

    draw();
  }
  function stopLoop() {
    if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
  }
  // Kick off the loop. Stop when MV stage is hidden (see mvClose handler).
  if (mvRaf) cancelAnimationFrame(mvRaf);
  loop();

  mvDrawFn = draw;
  mvResizeFn = () => { sizeCanvas(); };

  /* ═══════════════════════════════════════════════
   *  INPUT — touch first, mouse second
   * ═══════════════════════════════════════════════ */

  // Active gestures
  let activeTouches = new Map();   // identifier -> {x, y, t}
  let panAnchor = null;            // {sx, sy, offX, offY, lastX, lastY, lastT, vx, vy}
  let pinchAnchor = null;          // {dist, zoom, midSx, midSy, midGrid}
  let tapStart = null;             // {sx, sy, t}
  let lastTap = null;              // {sx, sy, t} — for double-tap detection

  function wrapPos(clientX, clientY) {
    // Canvas-wrap is always at left:0, top:mvTop below the header
    // Using window constants avoids any dependency on cloned element layout
    return {x: clientX, y: clientY - mvTop};
  }

  function startGesture(touchList) {
    activeTouches.clear();
    for (const t of touchList) {
      const p = wrapPos(t.clientX, t.clientY);
      activeTouches.set(t.identifier, {x: p.x, y: p.y, t: performance.now()});
    }
    beginByCount();
  }

  function beginByCount() {
    if (activeTouches.size === 1) {
      const first = Array.from(activeTouches.values())[0];
      tapStart = {sx: first.x, sy: first.y, t: performance.now()};
      panAnchor = {
        sx: first.x, sy: first.y,
        offX: mvOffset.x, offY: mvOffset.y,
        lastX: first.x, lastY: first.y, lastT: performance.now(),
        vx: 0, vy: 0,
      };
      pinchAnchor = null;
      panning = true;
      mvVel.x = 0; mvVel.y = 0;
    } else if (activeTouches.size === 2) {
      tapStart = null;
      panAnchor = null;
      const arr = Array.from(activeTouches.values());
      const midSx = (arr[0].x + arr[1].x) / 2;
      const midSy = (arr[0].y + arr[1].y) / 2;
      pinchAnchor = {
        dist: Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y),
        zoom: mvZoom,
        midSx, midSy,
        midGrid: screenToGrid(midSx, midSy),
      };
      panning = true;
    }
  }

  function updateGesture(touchList) {
    // Refresh positions
    for (const t of touchList) {
      const p = wrapPos(t.clientX, t.clientY);
      activeTouches.set(t.identifier, {x: p.x, y: p.y, t: performance.now()});
    }

    if (pinchAnchor && activeTouches.size >= 2) {
      const arr = Array.from(activeTouches.values()).slice(0, 2);
      const dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      const midSx = (arr[0].x + arr[1].x) / 2;
      const midSy = (arr[0].y + arr[1].y) / 2;
      const factor = dist / pinchAnchor.dist;
      const newZoom = Math.max(MV_ZOOM_MIN, Math.min(MV_ZOOM_MAX, pinchAnchor.zoom * factor));
      mvZoom = newZoom;
      mvTargetZoom = newZoom;
      // Put pinchAnchor.midGrid back at the current midpoint
      const m = metrics();
      const W = mvW, H = mvH;
      mvOffset.x = midSx - W / 2 - pinchAnchor.midGrid.gx * m.hexW;
      mvOffset.y = midSy - H / 2 + pinchAnchor.midGrid.gy * m.hexH;
    } else if (panAnchor && activeTouches.size === 1) {
      const p = Array.from(activeTouches.values())[0];
      mvOffset.x = panAnchor.offX + (p.x - panAnchor.sx);
      mvOffset.y = panAnchor.offY + (p.y - panAnchor.sy);
      // Track velocity (px per frame at 60fps)
      const now = performance.now();
      const dt = Math.max(1, now - panAnchor.lastT);
      panAnchor.vx = (p.x - panAnchor.lastX) / dt * 16;
      panAnchor.vy = (p.y - panAnchor.lastY) / dt * 16;
      panAnchor.lastX = p.x;
      panAnchor.lastY = p.y;
      panAnchor.lastT = now;

      if (tapStart && Math.hypot(p.x - tapStart.sx, p.y - tapStart.sy) > MV_TAP_MOVE_PX) {
        tapStart = null;
        mvWrapEl.classList.add('dragging');
      }
    }
  }

  function endGesture(endedIdentifiers) {
    const now = performance.now();

    // Capture final velocity BEFORE removing the anchor
    if (panAnchor && activeTouches.size === 1 && endedIdentifiers.length === 1) {
      mvVel.x = clamp(panAnchor.vx, -50, 50);
      mvVel.y = clamp(panAnchor.vy, -50, 50);
    }

    // Remove ended touches
    for (const id of endedIdentifiers) activeTouches.delete(id);

    // Tap handling
    if (tapStart && activeTouches.size === 0) {
      const dt = now - tapStart.t;
      if (dt < MV_TAP_TIME_MS) {
        handleTap(tapStart.sx, tapStart.sy, now);
      }
      tapStart = null;
    }

    if (activeTouches.size === 0) {
      panAnchor = null;
      pinchAnchor = null;
      panning = false;
      mvWrapEl.classList.remove('dragging');
    } else {
      // Rebase gesture for remaining touches
      beginByCount();
    }
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function handleTap(sx, sy, now) {
    const tile = tileAtPixel(sx, sy);

    // Tap on empty space: dismiss panel + selection
    if (!tile) {
      mvSelected = null;
      hideInfoPanel();
      return;
    }

    mvRipples.push({x: sx, y: sy, t0: now});

    const alreadySelected = mvSelected
      && mvSelected.x === tile.x && mvSelected.y === tile.y;

    if (!alreadySelected) {
      // FIRST TAP — determine if tile is interactable
      const p2   = getP();
      const vis2 = new Set(p2.visited||[]);
      const kudra2   = isKudraUnlocked();
      const postQ2   = isMVUnlocked() && !kudra2;
      const preQ2    = !isMVUnlocked() && !kudra2;
      const info2    = tile.info;
      const isHouse2 = !!(info2.house_id);
      const isPath2  = !!(info2.on_path && info2.on_path.length > 0
                         && info2.type !== 'home' && info2.type !== 'marduk_view');
      const isEmpty2 = info2.type === 'empty' && !info2.name && !info2.lore
                       && !isHouse2 && !info2.zone_id && !isPath2;
      const isVisited2 = vis2.has(`${tile.x},${tile.y}`)
                         || (tile.x===0&&tile.y===0);

      // Houses: visible (color) always, but info/travel only after visiting
      // Pre-quiz: only visited tiles interactable
      // Post-quiz/kudra: all non-house tiles, plus houses only if visited
      const tileInteractable = kudra2
        || isVisited2;  // only visited tiles get info+travel

      if (!tileInteractable) {
        // Not yet revealed — show nothing
        const hov2 = document.getElementById('mvHover');
        if (hov2) hov2.textContent = '';
        return;
      }
      mvSelected = {x: tile.x, y: tile.y};
      hideInfoPanel();
      const hov = document.getElementById('mvHover');
      if (hov) {
        const cx_ = tile.x>=0 ? `+${tile.x}` : `${tile.x}`;
        const cy_ = tile.y>=0 ? `+${tile.y}` : `${tile.y}`;
        hov.textContent = `(${cx_},${cy_})${tile.info.name ? '  ·  ' + tile.info.name : '  ·  empty'}  — tap again to open`;
      }
      return;
    }

    // SECOND TAP on same cell: open info panel
    // (travel is now via the "Travel here" button, not a third tap)
    if (!document.getElementById('mvInfo').classList.contains('show')) {
      showInfoPanel(tile);
      if (_skmActive) skmOpenEditor(tile.x, tile.y);
      return;
    }

    // Panel already open + tap same cell = do nothing; Travel button is the only travel method
  }

  if (_firstSetup) {
  /* ── wire touch events (signal = AbortController, auto-removed on re-init) ── */
  mvWrapEl.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    startGesture(ev.touches);
  }, {passive: false});

  mvWrapEl.addEventListener('touchmove', (ev) => {
    ev.preventDefault();
    updateGesture(ev.touches);
  }, {passive: false});

  mvWrapEl.addEventListener('touchend', (ev) => {
    ev.preventDefault();
    const ended = [];
    for (const t of ev.changedTouches) ended.push(t.identifier);
    endGesture(ended);
  }, {passive: false});

  mvWrapEl.addEventListener('touchcancel', (ev) => {
    const ended = [];
    for (const t of ev.changedTouches) ended.push(t.identifier);
    endGesture(ended);
  });

  /* ── mouse events (desktop) ───────────────────── */
  let mouseDown = false;
  mvWrapEl.addEventListener('mousedown', (ev) => {
    mouseDown = true;
    const p = wrapPos(ev.clientX, ev.clientY);
    tapStart = {sx: p.x, sy: p.y, t: performance.now()};
    panAnchor = {
      sx: p.x, sy: p.y,
      offX: mvOffset.x, offY: mvOffset.y,
      lastX: p.x, lastY: p.y, lastT: performance.now(),
      vx: 0, vy: 0,
    };
    panning = true;
    mvVel.x = 0; mvVel.y = 0;
  });
  mvWrapEl.addEventListener('mousemove', (ev) => {
    if (!mouseDown) return;
    const p = wrapPos(ev.clientX, ev.clientY);
    mvOffset.x = panAnchor.offX + (p.x - panAnchor.sx);
    mvOffset.y = panAnchor.offY + (p.y - panAnchor.sy);
    const now = performance.now();
    const dt = Math.max(1, now - panAnchor.lastT);
    panAnchor.vx = (p.x - panAnchor.lastX) / dt * 16;
    panAnchor.vy = (p.y - panAnchor.lastY) / dt * 16;
    panAnchor.lastX = p.x;
    panAnchor.lastY = p.y;
    panAnchor.lastT = now;
    if (tapStart && Math.hypot(p.x - tapStart.sx, p.y - tapStart.sy) > MV_TAP_MOVE_PX) {
      tapStart = null;
      mvWrapEl.classList.add('dragging');
    }
  });
  mvWrapEl.addEventListener('mouseup', (ev) => {
    if (!mouseDown) return;
    mouseDown = false;
    const now = performance.now();
    if (panAnchor) {
      mvVel.x = clamp(panAnchor.vx, -50, 50);
      mvVel.y = clamp(panAnchor.vy, -50, 50);
    }
    if (tapStart && (now - tapStart.t) < MV_TAP_TIME_MS) {
      const p = wrapPos(ev.clientX, ev.clientY);
      handleTap(p.x, p.y, now);
    }
    tapStart = null;
    panAnchor = null;
    panning = false;
    mvWrapEl.classList.remove('dragging');
  });
  mvWrapEl.addEventListener('mouseleave', () => {
    mouseDown = false;
    panning = false;
    panAnchor = null;
    tapStart = null;
    mvWrapEl.classList.remove('dragging');
  });

  // Desktop wheel-zoom centred on cursor
  mvWrapEl.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const p = wrapPos(ev.clientX, ev.clientY);
    const factor = Math.exp(-ev.deltaY * 0.0018);
    mvTargetZoom = Math.max(MV_ZOOM_MIN, Math.min(MV_ZOOM_MAX, mvZoom * factor));
    mvZoomAnchor = {x: p.x, y: p.y};
  }, {passive: false});
}

  /* ── zoom control buttons (guarded — elements may not exist) ── */
  if (document.getElementById('mvZoomIn')) document.getElementById('mvZoomIn').onclick = () => {
    const W = mvW, H = mvH;
    mvZoomAnchor = {x: W / 2, y: H / 2};
    mvTargetZoom = Math.min(MV_ZOOM_MAX, mvZoom * 1.4);
  };
  if (document.getElementById('mvZoomOut')) document.getElementById('mvZoomOut').onclick = () => {
    const W = mvW, H = mvH;
    mvZoomAnchor = {x: W / 2, y: H / 2};
    mvTargetZoom = Math.max(MV_ZOOM_MIN, mvZoom / 1.4);
  };
  if (document.getElementById('mvRecenter')) document.getElementById('mvRecenter').onclick = () => {
    const W = mvW, H = mvH;
    mvZoomAnchor = {x: W / 2, y: H / 2};
    mvTargetZoom = MV_ZOOM_HOME;
    // Also pan back to centre (0,0) over a couple of frames by injecting
    // velocity — but simpler: snap offset to 0,0.
    mvOffset.x = 0;
    mvOffset.y = 0;
    mvVel.x = 0;
    mvVel.y = 0;
    mvSelected = null;
    hideInfoPanel();
  };

  /* ── resize — attach once ─────────────────── */
  if (_firstSetup) {
    window.addEventListener('resize', () => { sizeCanvas(); });
    const ro = new ResizeObserver(() => sizeCanvas());
    ro.observe(mvWrapEl);
    window._mvWired = true;  // mark setup complete
  }
}

/* ── Info panel (unchanged external helpers) ───── */
function stripTags(html) { return (html || '').replace(/<[^>]*>/g, ''); }

function showInfoPanel(tileRef) {
  const {x, y, info} = tileRef;
  const panel = document.getElementById('mvInfo');
  const p = getP();
  const visitedSet = new Set(p.visited || []);
  // Title: name only — no emoji (emoji varies cross-platform)
  const titleText = info.name || 'An empty tile';

  const tags = [];
  if (visitedSet.has(`${x},${y}`)) tags.push('Visited');
  if (info.type === 'quiz' && isCorrect(info.question_id)) tags.push('Answered');
  if (info.type === 'home') tags.push('Home');
  if (info.type === 'threshold') tags.push('Threshold');
  if (info.type === 'marduk_view') tags.push('Reward');
  if (info.type === 'spine') tags.push('Spine');
  if (info.house_id) {
    const h = info.house_id.charAt(0).toUpperCase() + info.house_id.slice(1);
    tags.push(`House of ${h}`);
  }
  if (info.type === 'house_front_door') tags.push('Front Door');
  if (info.on_path && info.on_path.length) tags.push('On a Path');

  let lore = '';
  if (info.lore) {
    const plain = stripTags(info.lore);
    lore = plain.length > 260 ? plain.slice(0, 260) + '…' : plain;
  } else if (info.type === 'quiz') {
    const q = REALM.questions[info.question_id];
    lore = q ? stripTags(q.lore).slice(0, 220) + '…' : '';
  } else if (!info.name) {
    lore = 'An empty tile. Still navigable — keep walking, the realm continues beyond.';
  }

  let actionDisabled = '';
  let actionLabel = 'Travel here →';
  if (info.type === 'marduk_view' && !isMVUnlocked()) {
    actionDisabled = 'disabled';
    actionLabel = 'Locked — solve the quiz';
  }
  if (info.type === 'quiz') {
    const qid = info.question_id;
    const n = parseInt(qid.slice(1));
    if (n > 1 && !isCorrect('Q' + (n - 1)) && !isCorrect(qid)) {
      actionDisabled = 'disabled';
      actionLabel = `Answer Q${n - 1} first`;
    }
  }

  // Key symbol if in kudra mode
  const keyBadge = isKudraUnlocked() && info.key_id
    ? `<div style="font-size:22px;margin-bottom:6px;color:${KEY_DEFS[info.key_id]?.color||'#aaa'}">
        ${KEY_DEFS[info.key_id]?.sym||''} <span style="font-family:Cinzel,serif;font-size:10px;
        letter-spacing:0.2em;vertical-align:middle;">${KEY_DEFS[info.key_id]?.name||''}</span>
       </div>` : '';

  panel.innerHTML = `
    <div class="info-head">
      <div class="info-title">${titleText}</div>
      <div class="info-coord">(${x >= 0 ? '+' : ''}${x}, ${y >= 0 ? '+' : ''}${y})</div>
    </div>
    ${keyBadge}
    ${info.era ? `<div class="info-era">${info.era}</div>` : ''}
    ${tags.length ? `<div class="info-tags">${tags.map(t => `<span class="info-tag">${t}</span>`).join('')}</div>` : ''}
    ${lore ? `<div class="info-lore">${lore}</div>` : ''}
    <div class="info-actions">
      <button class="info-travel" id="mvTravelBtn" ${actionDisabled}>${actionLabel}</button>
      <button class="info-dismiss" id="mvDismissBtn">Dismiss</button>
    </div>`;
  panel.classList.add('show');

  // Show transparent backdrop - catches taps outside panel to dismiss
  const _bd = document.getElementById('mvInfoBackdrop');
  if (_bd) {
    _bd.classList.add('show');
    // Only wire once
    if (!_bd.dataset.wired) {
      _bd.dataset.wired = '1';
      const _dismiss = (ev) => {
        ev.stopPropagation();
        if (ev.cancelable) ev.preventDefault();
        mvSelected = null;
        hideInfoPanel();
        if (typeof mvDrawFn === 'function') mvDrawFn();
      };
      _bd.addEventListener('touchend', _dismiss, {passive:false});
      _bd.addEventListener('click', _dismiss);
    }
  }

  // Prevent all input on the panel from reaching the canvas behind
  ['touchstart','touchmove','touchend','touchcancel','mousedown','mousemove','mouseup','click','pointerdown','pointermove','pointerup'].forEach(evtName => {
    panel.addEventListener(evtName, e => e.stopPropagation(), evtName.startsWith('touch') ? {passive:false} : false);
  });

  // Wire buttons
  const tb = panel.querySelector('#mvTravelBtn');
  if (tb && !actionDisabled) {
    tb.addEventListener('click', () => travelFromMV(x, y));
    tb.addEventListener('touchend', ev => { ev.stopPropagation(); travelFromMV(x, y); }, {passive:false});
  }
  const db = panel.querySelector('#mvDismissBtn');
  if (db) {
    db.addEventListener('click', () => { mvSelected=null; hideInfoPanel(); if(mvDrawFn) mvDrawFn(); });
    db.addEventListener('touchend', ev => { ev.stopPropagation(); mvSelected=null; hideInfoPanel(); if(mvDrawFn) mvDrawFn(); }, {passive:false});
  }
}

function travelFromMV(x, y) {
  const info = getTile(x, y);
  const kudra = isKudraUnlocked();
  const mvDone = isMVUnlocked();
  const p3 = getP();
  const vis3 = new Set(p3.visited||[]);

  if (!kudra) {
    // Pre-quiz: ONLY visited tiles. No exceptions.
    if (!mvDone) {
      if (!vis3.has(`${x},${y}`) && !(x===0&&y===0)) return;
    }
    // All modes: require prior visit for info+travel (houses show color but no travel until walked)
    if (!vis3.has(`${x},${y}`) && !(x===0&&y===0)) return;
    // MV tile: needs unlock
    if (info.type === 'marduk_view' && !mvDone) return;
    // Quiz gating
    if (info.type === 'quiz') {
      const n = parseInt(info.question_id.slice(1));
      if (n > 1 && !isCorrect('Q'+(n-1)) && !isCorrect(info.question_id)) return;
    }
    // Zone rules
    if (info.type === 'locked_zone_threshold') {
      if (!hasAllKeys(info.keys_required||[])) return;
    }
    if (info.type === 'locked_zone_interior') return;

    // PATH RULE: non-kudra always lands at step 1 of the path
    // (player must walk from there — no skipping ahead)
    if (info.on_path && info.on_path.length > 0 && REALM && REALM.paths
        && info.type !== 'home') {
      for (const pid of info.on_path) {
        const seq = REALM.paths[pid];
        if (!seq || seq.length < 2) continue;
        const [tx, ty] = seq[1]; // step 1 = second tile
        // Only reroute if the selected tile is NOT step 0 or step 1
        const myStep = (info.path_step||{})[pid];
        if (myStep !== undefined && myStep <= 1) break; // at start, go normally
        // Reroute to step 1
        document.getElementById('mv-stage').classList.remove('show');
        const _kb3a = document.getElementById('keyBar');
        if (_kb3a) _kb3a.style.visibility = 'visible';
        hideInfoPanel();
        mvSelected = null;
        goTo(tx, ty);
        return;
      }
    }
  }
  document.getElementById('mv-stage').classList.remove('show');
  const _kb3 = document.getElementById('keyBar');
  if (_kb3) _kb3.style.visibility = 'visible';
  hideInfoPanel();
  mvSelected = null;
  if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
  goTo(x, y);
}

/* ── Keyboard nav ─────────────────────────────── */
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
  const mvOpen = document.getElementById('mv-stage').classList.contains('show');

  // MV open: arrow keys move selected tile, Enter travels, Esc closes
  if (mvOpen) {
    if (ev.key === 'Escape') {
      document.getElementById('mv-stage').classList.remove('show');
      const _kb3 = document.getElementById('keyBar');
      if (_kb3) _kb3.style.visibility = 'visible';
      if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
      goTo(0, 0);
      return;
    }
    const mvArrowMap = {ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    if (mvArrowMap[ev.key] && mvSelected) {
      ev.preventDefault();
      const [dx,dy] = mvArrowMap[ev.key];
      const nx2 = mvSelected.x + dx, ny2 = mvSelected.y + dy;
      if (inBounds(nx2, ny2)) {
        mvSelected = {x: nx2, y: ny2};
        showInfoPanel({x: nx2, y: ny2, info: getTile(nx2, ny2)});
        // Pan canvas so selected tile is visible
        const W = mvWrapEl ? mvWrapEl.clientWidth : window.innerWidth;
        const H = mvWrapEl ? mvWrapEl.clientHeight : window.innerHeight;
        const m2 = {r: MV_R*mvZoom, hexW: Math.sqrt(3)*MV_R*mvZoom, hexH: 2*MV_R*mvZoom*0.75};
        const stagger2 = (ny2 % 2 === 0 ? 0 : m2.hexW/2);
        const targetPx = nx2 * m2.hexW + stagger2;
        const targetPy = -ny2 * m2.hexH;
        mvOffset.x = W/2 - targetPx - W/2;
        mvOffset.y = H/2 + targetPy - H/2;
      }
      return;
    }
    if (ev.key === 'Enter' && mvSelected) {
      ev.preventDefault();
      travelFromMV(mvSelected.x, mvSelected.y);
      return;
    }
    return; // don't process other keys when MV is open
  }

  // If Marduk View open, close on Esc (fallback)
  if (ev.key === 'Escape') {
    const mv = document.getElementById('mv-stage');
    if (mv.classList.contains('show')) {
      mv.classList.remove('show');
      goTo(0, 0);
      return;
    }
  }
  const cur = decodeXY((window.location.hash || '').replace('#', ''));
  if (!cur) return;
  const doors = getDoors(cur.x, cur.y);
  const map = {
    'ArrowUp': 'up', 'w': 'up', 'W': 'up',
    'ArrowDown': 'down', 's': 'down', 'S': 'down',
    'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
    'ArrowRight': 'right', 'd': 'right', 'D': 'right',
  };
  if (ev.key === ' ') return;  // space reserved for text editing
  const dir = map[ev.key];
  if (!dir) return;
  const door = doors[dir];
  if (!door || door.sealed) return;
  const dx = {up:0, down:0, left:-1, right:1}[dir];
  const dy = {up:1, down:-1, left:0, right:0}[dir];
  goTo(cur.x + dx, cur.y + dy);
});

/* ── Key system ───────────────────────────────────── */
const KEY_DEFS = {
  A: {sym:'♦︎', color:'#C9A84C', name:'The Gold Key'},
  B: {sym:'◆', color:'#4A7C59', name:'The Moss Key'},
  C: {sym:'✦', color:'#7B5EA7', name:'The Violet Key'},
  D: {sym:'❆', color:'#5B9AB8', name:'The Ice Key'},
  E: {sym:'✸', color:'#A83232', name:'The Crimson Key'},
  F: {sym:'⬡', color:'#A86A32', name:'The Copper Key'},
  G: {sym:'◈', color:'#2D8888', name:'The Teal Key'},
  H: {sym:'★︎', color:'#5C2D82', name:'The Purple Key'},
  I: {sym:'◇', color:'#AAAAAA', name:'The Silver Key'},
  J: {sym:'⊕', color:'#CC5500', name:'The Ember Key'},
};
const KEY_ORDER = ['A','B','C','D','E','F','G','H','I','J'];

function collectKey(kid) {
  if (!KEY_DEFS[kid]) return false;
  const p = getP();
  p.keys_collected = p.keys_collected || {};
  if (p.keys_collected[kid]) return false; // already have it
  p.keys_collected[kid] = true;
  saveP(p);
  return true; // newly collected
}
function hasKey(kid) {
  return !!(getP().keys_collected || {})[kid];
}
function hasAllKeys(needed) {
  const collected = getP().keys_collected || {};
  return (needed || []).every(k => collected[k]);
}
function collectedCount() {
  return Object.keys(getP().keys_collected || {}).length;
}

function updateKeyBar() {
  const bar = document.getElementById('keyBar');
  if (!bar) return;
  bar.innerHTML = KEY_ORDER.map(kid => {
    const kd = KEY_DEFS[kid];
    const have = hasKey(kid);
    return `<span class="key-sym${have ? ' collected' : ''}"
              title="${kd.name}"
              style="color:${have ? kd.color : '#555'};">${kd.sym}</span>`;
  }).join('');
}

    s.innerHTML = `

    s.innerHTML = `
      <div style="text-align:center;max-width:520px;">

/* Universal tile renderer — used when tile.theme is set */

  const themeKey  = tile.theme || 'space';

  const objInner = tile.object_img
    ? `<img src="${tile.object_img}" alt="" draggable="false">`
    : `<span style="color:${accent};animation:${anim};display:block;">⁂</span>`;

  // Parallax on object layer via mouse or device orientation
  if (tile.object_parallax !== false) {
    attachTileParallax();
  }
}

/* Attach mouse/gyro parallax to the object layer */
let tileParallaxRaf = null;
let tileParallaxTarget = {x: 0, y: 0};
let tileParallaxCurrent = {x: 0, y: 0};
let tileMouseHandler = null;
let tileGyroHandler  = null;

function attachTileParallax() {
  detachTileParallax(); // clean up any prior

  const MAX = 28;

  tileMouseHandler = ev => {
    tileParallaxTarget.x = (ev.clientX / window.innerWidth  - 0.5) * 2;
    tileParallaxTarget.y = (ev.clientY / window.innerHeight - 0.5) * 2;
  };
  document.addEventListener('mousemove', tileMouseHandler);

  if (typeof DeviceOrientationEvent !== 'undefined') {
    tileGyroHandler = ev => {
      tileParallaxTarget.x = Math.max(-1, Math.min(1,  (ev.gamma||0)/22));
      tileParallaxTarget.y = Math.max(-1, Math.min(1, -(ev.beta ||0)/35));
    };
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+: permission requested on first touch
      const onFirstTouch = () => {
        DeviceOrientationEvent.requestPermission().then(s => {
          if (s === 'granted') window.addEventListener('deviceorientation', tileGyroHandler);
        });
        document.removeEventListener('touchstart', onFirstTouch);
      };
      document.addEventListener('touchstart', onFirstTouch, {once:true});
    } else {
      window.addEventListener('deviceorientation', tileGyroHandler);
    }
  }

  function loop() {
    tileParallaxRaf = requestAnimationFrame(loop);
    tileParallaxCurrent.x += (tileParallaxTarget.x - tileParallaxCurrent.x) * 0.07;
    tileParallaxCurrent.y += (tileParallaxTarget.y - tileParallaxCurrent.y) * 0.07;
    const obj = document.getElementById('tileObj');
    if (!obj) { detachTileParallax(); return; }
    const dx = tileParallaxCurrent.x * MAX;
    const dy = tileParallaxCurrent.y * MAX * 0.6;
    // Preserve existing CSS animation via translate; use CSS variable approach
    obj.style.marginLeft = dx + 'px';
    obj.style.marginTop  = dy + 'px';
  }
  loop();
}

function detachTileParallax() {
  if (tileParallaxRaf) { cancelAnimationFrame(tileParallaxRaf); tileParallaxRaf = null; }
  if (tileMouseHandler) { document.removeEventListener('mousemove', tileMouseHandler); tileMouseHandler = null; }
  if (tileGyroHandler) { window.removeEventListener('deviceorientation', tileGyroHandler); tileGyroHandler = null; }
}

      const d   = Math.hypot(nx-wCx, ny-wCy);

/* ══════════════════════════════════════════════════
 *  MUSIC ENGINE — zone-aware crossfading ambient score
 *  Tracks live in realm/music/*.mp3
 *  Autoplay unlocks on first user interaction.
 *  Two Audio elements crossfade so there is no silence
 *  between zone transitions.
 * ═════════════════════════════════════════════════*/
const MusicEngine = (() => {
  const BASE = 'music/';
  const TRACKS = {
    emily_path_music_1:    BASE + 'emily_path_music_1.mp3',
    emily_path_music_2:    BASE + 'emily_path_music_2.mp3',
    eli_house_music:       BASE + 'eli_house_music.mp3',
    eli_path_music:        BASE + 'eli_path_music.mp3',
    house_threshold_music: BASE + 'house_threshold_music.mp3',
    melchizedek_path_music:BASE + 'melchizedek_path_music.mp3',
    low_stress_major:      BASE + 'low_stress_major.mp3',
    low_stress_minor:      BASE + 'low_stress_minor.mp3',
    quiz_stress_music:     BASE + 'quiz_stress_music.mp3',
    high_stress_music:     BASE + 'high_stress_music.mp3',
    puzzle_tension:        BASE + 'puzzle_tension.mp3',
    emily_triumph:         BASE + 'emily_triumph.mp3',
  };

  const TARGET_VOL = 0.62;
  const FADE_MS    = 2200; // crossfade duration

  let currentKey  = null;
  let muted       = (localStorage.getItem('mm_muted') === '1');
  let started     = false;  // true after first user gesture

  // Two audio elements — we ping-pong between them for crossfade
  const elA = new Audio(); elA.loop = true; elA.volume = 0;
  const elB = new Audio(); elB.loop = true; elB.volume = 0;
  let activeEl   = elA;
  let inactiveEl = elB;

  function _fade(el, from, to, ms) {
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min((now - start) / ms, 1);
      el.volume = from + (to - from) * t;
      if (t < 1) requestAnimationFrame(tick);
      else if (to === 0) { el.pause(); el.currentTime = 0; }
    };
    requestAnimationFrame(tick);
  }

  function _play(key) {
    if (!started || !key || !TRACKS[key]) return;
    if (key === currentKey) return;
    currentKey = key;

    const next = inactiveEl;
    next.src = TRACKS[key];
    next.load();
    const targetVol = muted ? 0 : TARGET_VOL;

    next.play().then(() => {
      // Fade new track in, fade old track out simultaneously
      _fade(next, 0, targetVol, FADE_MS);
      _fade(activeEl, activeEl.volume, 0, FADE_MS);
      [activeEl, inactiveEl] = [inactiveEl, activeEl];
    }).catch(() => {});
  }

  // Determine which track to play based on tile position
  function _getTrack(x, y, tile) {
    if (!tile) return 'low_stress_major';

    // Emily's path — two-phase score matching the design schematic
    if (tile.on_path && tile.on_path.includes('A')) {
      const step = (tile.path_step && tile.path_step['A'] != null)
                   ? tile.path_step['A'] : 0;
      // Stage 1–2 (steps 0–11): early forest, warm, mysterious
      // Stage 3–4 (steps 12–23): dark wood through facility threshold
      return step < 12 ? 'emily_path_music_1' : 'emily_path_music_2';
    }

    // Eve's house interior (House E — Crimson)
    if (tile.house_id && (tile.house_id === 'E' || tile.house_id.toLowerCase().includes('eli') || tile.house_id.toLowerCase().includes('eve'))) {
      return 'eli_house_music';
    }
    if (tile.type === 'locked_zone_interior' && tile.zone_color &&
        (tile.zone_color === '#701818' || tile.zone_color === '#A83232')) {
      return 'eli_house_music';
    }

    // Any house front door / zone threshold — momentary transition cue
    if (tile.type === 'house_front_door' || tile.type === 'locked_zone_threshold') {
      return 'house_threshold_music';
    }

    // Path E — Eve/Eli/Crimson
    if (tile.on_path && tile.on_path.includes('E')) {
      return 'eli_path_music';
    }

    // Path D — Jeremy/Melchizedek/Ice
    if (tile.on_path && tile.on_path.includes('D')) {
      return 'melchizedek_path_music';
    }

    // Puzzle tiles
    if (tile.puzzle && tile.puzzle.music) {
      return tile.puzzle.music;
    }

    // Tile-level music override
    if (tile.music) return tile.music;

    // Quiz area
    if (tile.type === 'quiz') {
      return 'quiz_stress_music';
    }

    // Darker ambient paths
    if (tile.on_path && tile.on_path.some(p => ['C','G','H','B'].includes(p))) {
      return 'low_stress_minor';
    }

    // Home, Path F, Path M, general exploration
    return 'low_stress_major';
  }

  // Public API
  function playForTile(x, y, tile) {
    _play(_getTrack(x, y, tile));
  }

  function start() {
    if (started) return;
    started = true;
    // Start with whatever is current track (or default)
    if (!currentKey) _play('low_stress_major');
    else {
      activeEl.volume = muted ? 0 : TARGET_VOL;
      activeEl.play().catch(() => {});
    }
  }

  function toggleMute() {
    muted = !muted;
    localStorage.setItem('mm_muted', muted ? '1' : '0');
    activeEl.volume = muted ? 0 : TARGET_VOL;
    const btn = document.getElementById('muteBtn');
    if (btn) {
      btn.textContent = muted ? '♪ MUTED' : '♪ MUSIC';
      btn.classList.toggle('muted', muted);
    }
    return muted;
  }

  function isMuted() { return muted; }

  // Wire up mute button once DOM is ready
  function initBtn() {
    const btn = document.getElementById('muteBtn');
    if (!btn) return;
    btn.textContent = muted ? '♪ MUTED' : '♪ MUSIC';
    if (muted) btn.classList.add('muted');
    btn.addEventListener('click', () => {
      start();        // unlock autoplay on first click
      toggleMute();
    });
  }

  // playByKey: play a specific named track (called by puzzle system etc.)
  function playByKey(key) { _play(key); }

  return { playForTile, start, toggleMute, isMuted, initBtn, playByKey };
})();

let _skmActive = false;
let _skmBuffer = '';
const SKM_CODE = 'superkudramarduk';
const SKM_OVERRIDES_KEY = 'mm_tile_overrides';

function _loadOverrides() {
  try { return JSON.parse(localStorage.getItem(SKM_OVERRIDES_KEY)||'{}'); }
  catch(e) { return {}; }
}
function _saveOverrides(obj) {
  try { localStorage.setItem(SKM_OVERRIDES_KEY, JSON.stringify(obj)); } catch(e) {}
}
// Merge overrides into REALM on boot (called after REALM loads)
function applyTileOverrides() {
  const ov = _loadOverrides();
  for (const [k, patch] of Object.entries(ov)) {
    if (!REALM.tiles[k]) REALM.tiles[k] = {};
    Object.assign(REALM.tiles[k], patch);
  }
}

document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (ev.key.length === 1) {
    _skmBuffer += ev.key.toLowerCase();
    if (_skmBuffer.length > SKM_CODE.length) _skmBuffer = _skmBuffer.slice(-SKM_CODE.length);
    if (_skmBuffer === SKM_CODE) {
      _activateSKM();
    }
  }
});

function _activateSKM() {
  if (_skmActive) return;
  _skmActive = true;
  activateKudraMode();
  document.body.classList.add('skm-active');

function skmSave(x, y) {
  const k = `${x},${y}`;
  let activeType = (document.querySelector('.skm-type-btn.active')?.dataset?.type
    || document.querySelector('.skm-type-btn.active')?.textContent?.toLowerCase()
    || 'text').replace('🎮 ','').trim();
  // Normalise 'game' → use the game dropdown value
  if (activeType === 'game' || activeType === '🎮 game') activeType = 'game';
  const nameGlobal = document.getElementById('skmNameGlobal')?.value?.trim();

  let patch = {};
  if (nameGlobal) patch.name = nameGlobal;

  if (activeType === 'text') {
    patch.name = document.getElementById('skmName')?.value?.trim() || nameGlobal;
    const loreEl = document.getElementById('skmLore');
    if (loreEl) patch.lore = loreEl.innerHTML;
    delete patch.puzzle; delete patch.embed_url; delete patch.video_url; delete patch.image_url;
  } else if (['face3d','tesseract','game'].includes(activeType)) {
    const lvA  = parseInt(document.getElementById('skmPzlRangeA')?.value)||null;
    const lvB  = parseInt(document.getElementById('skmPzlRangeB')?.value)||null;
    const lv   = parseInt(document.getElementById('skmPzlLevel')?.value)||1;
    patch.puzzle = {
      type:   document.getElementById('skmPzlType')?.value || activeType,
      title:  document.getElementById('skmPzlTitle')?.value || '',
      desc:   document.getElementById('skmPzlDesc')?.value  || '',
      music:  document.getElementById('skmPzlMusic')?.value || 'puzzle_tension',
      on_complete_music: document.getElementById('skmPzlCompleteMusic')?.value || null,
      lock_entry: document.getElementById('skmPzlLock')?.checked || false,
      lock_exit:  document.getElementById('skmPzlExitLock')?.checked || false,
    };
    if (lvA && lvB) patch.puzzle.range = [lvA,lvB];
    else patch.puzzle.level = lv;
  } else if (activeType === 'iframe') {
    patch.embed_url   = document.getElementById('skmIframeUrl')?.value || '';
    patch.embed_title = document.getElementById('skmEmbedTitle')?.value || '';
  } else if (activeType === 'video') {
    patch.video_url = document.getElementById('skmVideoUrl')?.value || '';
  } else if (activeType === 'image') {
    patch.image_url     = document.getElementById('skmImageUrl')?.value     || '';
    patch.image_caption = document.getElementById('skmImageCaption')?.value || '';
  }

  // Apply to live REALM
  if (!REALM.tiles[k]) REALM.tiles[k] = {};
  Object.assign(REALM.tiles[k], patch);

  // Persist
  const ov = _loadOverrides();
  ov[k] = Object.assign(ov[k]||{}, patch);
  _saveOverrides(ov);

  // Re-render current tile to show changes
  const coords = decodeXY(window.location.hash.replace('#',''));
  if (coords && coords.x===x && coords.y===y) render(x, y);

  // Flash save confirmation
  const btn = document.querySelector('.skm-save-btn');
  if (btn) { btn.textContent='✓ SAVED'; setTimeout(()=>btn.textContent='💾 SAVE TO MEMORY',1500); }
}

function skmExport() {
  const ov = _loadOverrides();
  const json = JSON.stringify(ov, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tile-overrides.json';
  a.click();
}
