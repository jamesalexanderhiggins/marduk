<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Realm — Marduk's Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070910; --bg2:#0d1119; --bg3:#121620;
  --gold:#c9a84c; --gold2:#e8c96e;
  --ember:#ff6b2b; --spirit:#7eb8d4;
  --violet:#c084fc; --green:#7ed49a; --moss:#2e4a3a; --moonlight:#c8cbd0;
  --text:#e4dccb; --dim:#6a6055;
  --border:rgba(201,168,76,0.18);
  --glow:0 0 18px rgba(201,168,76,0.4),0 0 60px rgba(201,168,76,0.12);
  --sglow:0 0 18px rgba(126,184,212,0.5);
  --eglow:0 0 20px rgba(255,107,43,0.6),0 0 60px rgba(255,107,43,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'EB Garamond',serif;font-size:17px;line-height:1.7;}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}

/* Top-left HOME link */
.exit-home{position:fixed;top:20px;left:24px;z-index:100;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid rgba(201,168,76,0.12);padding:8px 14px;transition:all 0.3s;background:rgba(7,9,16,0.85);}
.exit-home:hover{color:var(--gold);border-color:var(--gold);}

/* Top-right progress pill */
/* Key bar — replaces quiz progress pill */
.key-bar{position:fixed;top:20px;right:24px;z-index:100;
  display:flex;align-items:center;gap:5px;
  background:rgba(7,9,16,0.88);
  border:1px solid rgba(201,168,76,0.15);
  padding:8px 14px;border-radius:2px;}
.key-sym{font-size:15px;line-height:1;cursor:default;
  opacity:0.18;transition:opacity 0.6s,filter 0.6s,transform 0.4s;
  filter:grayscale(1);display:inline-block;}
.key-sym.collected{opacity:1;filter:none;
  animation:keyGlow 2.5s ease-in-out infinite;}
@keyframes keyGlow{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
/* Path colour tint helper (applied via inline style on body) */
.zone-door-hint{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.25em;
  color:rgba(201,168,76,0.55);text-align:center;pointer-events:none;
  opacity:0;animation:fadeUp 0.6s 0.3s both;}

/* Bottom coordinates */
.room-coords{position:fixed;bottom:20px;right:24px;z-index:100;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.3em;color:var(--dim);}

/* Stage */
#stage{position:relative;z-index:10;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 24px;text-align:center;overflow-y:auto;transition:opacity 0.5s ease;}

.room-era{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.35em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;opacity:0;animation:fadeUp 0.8s 0.3s forwards;}
.room-title{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,5vw,52px);color:var(--text);line-height:1.2;margin-bottom:28px;opacity:0;animation:fadeUp 0.8s 0.5s forwards;}
.room-lore{max-width:580px;font-size:18px;font-style:italic;color:var(--text);line-height:1.85;margin-bottom:36px;opacity:0;animation:fadeUp 0.8s 0.7s forwards;text-shadow:0 1px 8px rgba(0,0,0,0.85);}
.room-lore p+p{margin-top:12px;}
.room-lore em{color:var(--spirit);}
.room-lore strong{color:var(--gold);font-style:normal;}

/* Quiz */
.q-wrap{opacity:0;animation:fadeUp 0.8s 1s forwards;width:100%;max-width:640px;}
.q-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.4em;color:var(--dim);text-transform:uppercase;margin-bottom:10px;}
.q-text{font-family:'Cinzel',serif;font-size:clamp(13px,1.8vw,16px);letter-spacing:0.03em;color:var(--gold);margin-bottom:24px;padding:18px 22px;border:1px solid var(--border);background:rgba(0,0,0,0.72);line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,0.9);}
.doors{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.door{flex:1;min-width:160px;max-width:230px;border:1px solid var(--border);background:rgba(13,17,25,0.9);color:var(--text);padding:16px 14px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.07em;line-height:1.4;transition:all 0.25s;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
.door:hover:not(:disabled){border-color:var(--gold);background:rgba(201,168,76,0.08);color:var(--gold);box-shadow:var(--glow);transform:translateY(-2px);}
.door:disabled{opacity:0.4;cursor:default;}
.door.correct{border-color:var(--spirit)!important;background:rgba(126,184,212,0.12)!important;color:var(--spirit)!important;box-shadow:var(--sglow)!important;}
.door.wrong{border-color:var(--ember)!important;background:rgba(255,107,43,0.08)!important;color:var(--ember)!important;animation:shake 0.4s ease;}
.dsym{font-size:20px;display:block;margin-bottom:6px;}

/* Hub-like tiles */
.hub-btn{font-family:'Cinzel',serif;font-size:13px;letter-spacing:0.25em;text-transform:uppercase;color:var(--bg);background:var(--gold);padding:16px 48px;cursor:pointer;border:none;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:all 0.3s;opacity:0;animation:fadeUp 0.8s 1.2s forwards;text-decoration:none;display:inline-block;}
.hub-btn:hover{background:var(--gold2);box-shadow:var(--glow);}
.hint{margin-top:18px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.25em;color:rgba(201,168,76,0.25);animation:fadeUp 1s 2s forwards,pulse 3s 3s ease-in-out infinite;opacity:0;}

/* Navigation arrows on empty + content tiles */
.nav-arrows{position:fixed;inset:0;pointer-events:none;z-index:15;}
.nav-arrow{position:absolute;pointer-events:auto;width:56px;height:56px;border:1px solid var(--border);background:rgba(7,9,16,0.72);color:var(--gold);font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.25s;text-decoration:none;}
.nav-arrow:hover{border-color:var(--gold);background:rgba(201,168,76,0.1);box-shadow:var(--glow);transform:scale(1.1);}
.nav-arrow.up   {top:20px;    left:50%; transform:translateX(-50%);}
.nav-arrow.down {bottom:20px; left:50%; transform:translateX(-50%);}
.nav-arrow.left {left:20px;   top:50%;  transform:translateY(-50%);}
.nav-arrow.right{right:20px;  top:50%;  transform:translateY(-50%);}
.nav-arrow.up:hover   {transform:translateX(-50%) scale(1.1);}
.nav-arrow.down:hover {transform:translateX(-50%) scale(1.1);}
.nav-arrow.left:hover {transform:translateY(-50%) scale(1.1);}
.nav-arrow.right:hover{transform:translateY(-50%) scale(1.1);}
.nav-arrow.path{color:var(--gold2);border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,0.45);}
.nav-arrow.sealed{color:var(--dim);opacity:0.35;cursor:not-allowed;pointer-events:none;}

/* Empty tile asterism */
.empty-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;}
.asterism{font-family:'Cinzel Decorative',serif;font-size:clamp(54px,10vw,96px);color:var(--gold);text-shadow:var(--glow);cursor:pointer;transition:transform 0.4s;animation:sigilFloat 5s ease-in-out infinite;user-select:none;}
.asterism:hover{transform:scale(1.1) rotate(5deg);}
.empty-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.4em;color:var(--dim);text-transform:uppercase;}
.empty-coord{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.3em;color:rgba(201,168,76,0.3);margin-top:8px;}
.path-thread{position:fixed;inset:0;pointer-events:none;z-index:2;}

/* Home tile */
.home-panel{max-width:520px;text-align:center;}
.home-panel .hub-btn{margin-top:20px;}

/* Marduk View — honeycomb */
#mv-stage{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,rgba(20,18,12,0.96),var(--bg) 80%);display:none;flex-direction:column;}
#mv-stage.show{display:flex;}
#mv-header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(7,9,16,0.8);}
.mv-title{font-family:'Cinzel Decorative',serif;font-size:22px;color:var(--gold);text-shadow:var(--glow);letter-spacing:0.1em;}
.mv-sub{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.3em;color:var(--spirit);text-transform:uppercase;margin-left:12px;}
.mv-close{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid var(--border);padding:10px 18px;cursor:pointer;transition:all 0.3s;min-height:40px;}
.mv-close:hover{color:var(--gold);border-color:var(--gold);}
.mv-controls{display:flex;gap:8px;align-items:center;}
.mv-ctl{width:40px;height:40px;background:rgba(7,9,16,0.8);border:1px solid var(--border);color:var(--gold);font-size:20px;font-family:'Cinzel',serif;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.25s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.mv-ctl:hover,.mv-ctl:active{border-color:var(--gold);background:rgba(201,168,76,0.12);box-shadow:var(--glow);}
.mv-ctl:active{transform:scale(0.95);}
#mv-canvas-wrap{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:contain;}
#mv-canvas-wrap.dragging{cursor:grabbing;}
#mv-canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}

/* Info panel — slides up from bottom when a cell is tapped */
.mv-info{position:absolute;left:12px;right:12px;bottom:12px;max-width:640px;margin:0 auto;background:linear-gradient(180deg,rgba(13,17,25,0.96),rgba(7,9,16,0.98));border:1px solid var(--border);padding:18px 22px;transform:translateY(calc(100% + 24px));opacity:0;transition:transform 0.3s ease,opacity 0.3s ease;pointer-events:none;box-shadow:0 -8px 40px rgba(0,0,0,0.6),0 0 30px rgba(201,168,76,0.08);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);}
.mv-info.show{transform:translateY(0);opacity:1;pointer-events:auto;}
.info-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.info-title{font-family:'Cinzel Decorative',serif;font-size:20px;color:var(--gold);line-height:1.25;flex:1;}
.info-coord{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.25em;color:var(--dim);white-space:nowrap;padding-top:6px;}
.info-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.info-tag{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--spirit);border:1px solid rgba(126,184,212,0.3);padding:3px 10px;}
.info-era{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.info-lore{font-size:14px;line-height:1.65;color:var(--text);font-style:italic;margin-bottom:14px;max-height:120px;overflow-y:auto;}
.info-actions{display:flex;gap:10px;flex-wrap:wrap;}
.info-travel{flex:1;min-height:44px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--bg);background:var(--gold);border:none;padding:12px 20px;cursor:pointer;transition:all 0.25s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.info-travel:hover,.info-travel:active{background:var(--gold2);box-shadow:var(--glow);}
.info-travel:disabled{background:var(--dim);cursor:not-allowed;opacity:0.5;}
.info-dismiss{min-height:44px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);background:transparent;border:1px solid var(--border);padding:12px 20px;cursor:pointer;transition:all 0.25s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.info-dismiss:hover,.info-dismiss:active{color:var(--gold);border-color:var(--gold);}

@media(max-width:600px){
  #mv-header{padding:12px 14px;flex-wrap:wrap;gap:8px;}
  .mv-title{font-size:16px;}
  .mv-sub{display:none;}
  .mv-ctl{width:38px;height:38px;}
  .mv-close{padding:8px 12px;font-size:9px;}
  .info-title{font-size:16px;}
  .info-lore{font-size:13px;max-height:90px;}
  .mv-hover{display:none;}
  .mv-legend{gap:10px;font-size:8px;}
}
#mv-footer{padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);background:rgba(7,9,16,0.8);font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.2em;color:var(--dim);}
.mv-hover{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.15em;color:var(--gold);}
.mv-legend{display:flex;gap:18px;}
.mv-legend .item{display:flex;align-items:center;gap:6px;}
.mv-legend .dot{width:8px;height:8px;border-radius:50%;}

/* Penalty loop */
.loop-msg{max-width:500px;font-size:17px;font-style:italic;color:var(--dim);line-height:1.85;margin-bottom:24px;opacity:0;animation:fadeUp 0.7s 0.6s forwards;}
.redirect{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;margin-top:20px;opacity:0;animation:fadeUp 0.6s 1s forwards;}
.countdown{font-family:'Cinzel',serif;font-size:28px;margin-top:14px;opacity:0;animation:fadeUp 0.5s 1.2s forwards;}

/* Session-lock screen */
.lock-screen{max-width:520px;text-align:center;}
.lock-glyph{font-size:60px;color:var(--ember);margin-bottom:20px;text-shadow:var(--eglow);animation:sigilFloat 4s ease-in-out infinite;}
.lock-title{font-family:'Cinzel Decorative',serif;font-size:28px;color:var(--ember);margin-bottom:16px;}
.lock-text{font-size:15px;font-style:italic;color:var(--dim);line-height:1.8;margin-bottom:18px;}
.lock-timer{font-family:'Cinzel',serif;font-size:14px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;}

/* Overlays */
.grid-ov{position:fixed;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(126,184,212,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(126,184,212,0.025) 1px,transparent 1px);background-size:60px 60px;}
.scan-ov{position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);}
.house-ov{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center, rgba(46,74,58,0.28), rgba(7,9,16,0) 70%);}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
@keyframes sigilFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-8px) rotate(3deg);}}
@keyframes particleRise{0%{transform:translate(0,0);opacity:0;}10%{opacity:1;}90%{opacity:0.25;}100%{transform:translate(var(--pdx,0),-110vh);opacity:0;}}
@keyframes breathe{0%,100%{text-shadow:0 0 20px rgba(201,168,76,0.4),0 0 60px rgba(201,168,76,0.1);}50%{text-shadow:0 0 30px rgba(201,168,76,0.7),0 0 80px rgba(201,168,76,0.25);}}
@keyframes eveBlink{0%,92%,100%{opacity:1;}93%,97%{opacity:0.4;}}
@keyframes glitchT{0%,100%{transform:translateX(0);}50%{transform:translateX(2px);}}
/* KUDRAMARDUK mode glow strip */
#kudraMode{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;
  height:34px;align-items:center;justify-content:center;
  background:rgba(4,2,10,0.92);cursor:pointer;
  border-top:1px solid rgba(192,132,252,0.35);}
#kudraMode.on{display:flex;}
#kudraMode span{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.42em;
  text-transform:uppercase;
  color:#c084fc;text-shadow:0 0 14px #c084fc,0 0 40px rgba(192,132,252,0.6);
  animation:kudraThob 2.2s ease-in-out infinite;}
@keyframes kudraThob{0%,100%{text-shadow:0 0 14px #c084fc,0 0 40px rgba(192,132,252,0.6);}
  50%{text-shadow:0 0 30px #c084fc,0 0 80px rgba(192,132,252,0.9),0 0 120px rgba(192,132,252,0.4);}}

/* In-site popup */
.site-popup{position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;}
.site-popup-inner{background:var(--bg2);border:1px solid rgba(192,132,252,0.4);
  padding:42px 48px;max-width:440px;text-align:center;}
.site-popup-title{font-family:'Cinzel Decorative',serif;font-size:22px;
  color:#c084fc;text-shadow:0 0 20px rgba(192,132,252,0.7);margin-bottom:16px;}
.site-popup-body{font-family:'EB Garamond',serif;font-size:16px;font-style:italic;
  color:var(--text-dim);line-height:1.65;margin-bottom:28px;}
.site-popup-btns{display:flex;gap:14px;justify-content:center;}
.site-popup-btn{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.2em;
  text-transform:uppercase;padding:12px 28px;cursor:pointer;border:none;
  transition:all 0.25s;}
.site-popup-btn.primary{background:rgba(192,132,252,0.85);color:#0a0010;}
.site-popup-btn.primary:hover{background:#c084fc;}
.site-popup-btn.secondary{background:transparent;color:var(--dim);
  border:1px solid rgba(192,132,252,0.25);}
.site-popup-btn.secondary:hover{border-color:#c084fc;color:#c084fc;}

/* MV close button — left side */
#mvClose{margin-left:auto;}


/* ── Path tile renderer ───────────────────────── */
.pt-root{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pt-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 50%, var(--pt-color,#C9A84C) 0%, transparent 65%);opacity:0.12;pointer-events:none;}
.pt-vign{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.6) 0%,transparent 30%,transparent 70%,rgba(0,0,0,0.5) 100%);pointer-events:none;}
.pt-body{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
.pt-label{font-family:'Cinzel',serif;font-size:clamp(9px,1.2vw,12px);letter-spacing:0.55em;text-transform:uppercase;color:var(--pt-color,#C9A84C);opacity:0;animation:fadeUp 0.6s 0.2s both;}
.pt-sigil{font-family:'Cinzel Decorative',serif;font-size:clamp(64px,10vw,110px);color:var(--pt-color,#C9A84C);text-shadow:0 0 40px var(--pt-color,#C9A84C),0 0 80px var(--pt-color,#C9A84C);opacity:0;animation:fadeUp 0.7s 0.35s both, ptPulse 3.5s 1s ease-in-out infinite;line-height:1;cursor:pointer;user-select:none;}
.pt-step{font-family:'Cinzel',serif;font-size:clamp(9px,1.1vw,11px);letter-spacing:0.4em;text-transform:uppercase;color:rgba(228,220,203,0.55);opacity:0;animation:fadeUp 0.6s 0.5s both;}
.pt-hint{font-family:'EB Garamond',serif;font-style:italic;font-size:clamp(13px,1.5vw,16px);color:rgba(228,220,203,0.35);max-width:380px;line-height:1.6;opacity:0;animation:fadeUp 0.6s 0.7s both;text-align:center;}
.pt-coord{position:absolute;bottom:22px;right:26px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.3em;color:rgba(228,220,203,0.2);}
@keyframes ptPulse{0%,100%{text-shadow:0 0 30px var(--pt-color,#C9A84C),0 0 60px var(--pt-color,#C9A84C);}50%{text-shadow:0 0 60px var(--pt-color,#C9A84C),0 0 120px var(--pt-color,#C9A84C),0 0 160px var(--pt-color,#C9A84C);}}

/* ── MAP button (KUDRAMARDUK unlock) ─────────────── */
#mapBtn{display:none;position:fixed;top:20px;right:190px;z-index:100;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(192,132,252,0.8);background:rgba(7,9,16,0.88);
  border:1px solid rgba(192,132,252,0.28);padding:9px 16px;cursor:pointer;
  transition:all 0.3s;-webkit-tap-highlight-color:transparent;}
#mapBtn.show{display:block;}
#mapBtn:hover,#mapBtn:active{color:#c084fc;border-color:#c084fc;
  box-shadow:0 0 18px rgba(192,132,252,0.4);}
/* Images now have real PNG transparency (white removed via PIL).
   Background is dark — no blend mode tricks needed.             */
.hs-root{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#040210 0%,#07050F 50%,#0A0814 100%);}
/* Oversized layer for parallax headroom — 15% bleed each side */
.hs-layer{position:absolute;top:-15%;left:-15%;width:130%;height:130%;
  will-change:transform;transition:opacity 0.7s ease;}
.hs-layer img{display:block;width:100%;height:100%;
  object-fit:contain;object-position:center bottom;
  pointer-events:none;user-select:none;-webkit-user-drag:none;}
/* Atmosphere on top of images */
.hs-dark{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 90%,
    transparent 0%,rgba(0,0,0,0.45) 55%,rgba(0,0,0,0.82) 100%);}
.hs-vign{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(0,0,0,0.72) 0%,rgba(0,0,0,0.15) 22%,
    rgba(0,0,0,0.0) 60%,rgba(0,0,0,0.55) 100%);}
.hs-sides{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,
    rgba(0,0,0,0.60) 0%,transparent 20%,transparent 80%,rgba(0,0,0,0.60) 100%);}
/* Atmospheric glows */
.hs-atm{position:absolute;pointer-events:none;}
.hs-candle{animation:hsCandle 3.1s ease-in-out infinite;
  background:radial-gradient(ellipse at 42% 58%,rgba(205,118,22,0.32) 0%,transparent 62%);}
.hs-moon{animation:hsMoon 9s ease-in-out infinite;
  background:linear-gradient(145deg,rgba(100,160,210,0.22) 0%,transparent 48%);}
/* Dust particles */
.hs-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
/* Scene text overlay */
.hs-scene-text{position:absolute;left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none;z-index:14;
  animation:hsFadeIn 1.2s 0.9s both ease;}
.hs-scene-title{font-family:'Cinzel Decorative',serif;
  font-size:clamp(18px,2.4vw,30px);color:rgba(228,220,203,0.92);
  text-shadow:0 2px 18px rgba(0,0,0,0.9),0 0 40px rgba(0,0,0,0.6);
  letter-spacing:0.06em;margin-bottom:10px;}
.hs-scene-quote{font-family:'EB Garamond',serif;
  font-size:clamp(14px,1.6vw,19px);font-style:italic;
  color:rgba(201,168,76,0.78);
  text-shadow:0 1px 12px rgba(0,0,0,0.9);
  max-width:520px;line-height:1.6;}
/* Directional whispers — hover hints near each exit */
.hs-whisper{position:absolute;pointer-events:none;z-index:13;
  font-family:'EB Garamond',serif;font-style:italic;
  color:rgba(201,168,76,0);text-align:center;
  transition:color 0.4s,opacity 0.4s;
  text-shadow:0 1px 8px rgba(0,0,0,0.8);
  font-size:clamp(12px,1.3vw,15px);line-height:1.5;}
/* Hotspot zones — invisible but interactive */
.hs-hs{position:absolute;cursor:pointer;z-index:15;}
.hs-hs:hover ~ .hs-whisper,
.hs-hs:focus ~ .hs-whisper{color:rgba(201,168,76,0.72);}
/* Glow border on hover */
.hs-bloom{position:absolute;inset:0;
  border:1px solid rgba(201,168,76,0);
  transition:border-color 0.4s,box-shadow 0.4s,background 0.4s;}
.hs-hs:hover .hs-bloom,.hs-hs:active .hs-bloom{
  border-color:rgba(201,168,76,0.22);
  box-shadow:inset 0 0 60px rgba(201,168,76,0.08);}
/* Tooltip panel */
.hs-tip{position:absolute;left:50%;
  transform:translateX(-50%) translateY(8px);
  opacity:0;transition:opacity 0.35s,transform 0.35s;
  background:rgba(4,2,12,0.96);
  border:1px solid rgba(201,168,76,0.35);
  padding:14px 22px;
  font-family:'EB Garamond',serif;font-size:clamp(14px,1.5vw,17px);
  font-style:italic;color:var(--text);
  min-width:200px;max-width:310px;text-align:center;
  pointer-events:none;
  box-shadow:0 10px 40px rgba(0,0,0,0.85),0 0 20px rgba(201,168,76,0.06);
  white-space:normal;line-height:1.55;}
.hs-tip.above{bottom:calc(100% + 14px);}
.hs-tip.below{top:calc(100% + 14px);}
.hs-hs:hover .hs-tip,.hs-hs:active .hs-tip{
  opacity:1;transform:translateX(-50%) translateY(0);}
/* Exit label */
.hs-exit-cue{position:absolute;bottom:8px;left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:8px;
  letter-spacing:0.32em;text-transform:uppercase;
  color:rgba(201,168,76,0.0);transition:color 0.4s;
  white-space:nowrap;}
.hs-hs.exit:hover .hs-exit-cue{color:rgba(201,168,76,0.7);}
/* HUD — era + title bottom left */
.hs-hud{position:absolute;bottom:24px;left:26px;
  pointer-events:none;z-index:16;
  animation:hsFadeIn 1s 0.4s both ease;}
.hs-hud-era{font-family:'Cinzel',serif;font-size:8px;
  letter-spacing:0.35em;color:rgba(201,168,76,0.6);
  text-transform:uppercase;margin-bottom:5px;}
.hs-hud-name{font-family:'Cinzel Decorative',serif;
  font-size:clamp(12px,1.6vw,18px);color:rgba(228,220,203,0.88);
  text-shadow:0 2px 12px rgba(0,0,0,1);}
/* Keyframes */
@keyframes hsCandle{0%,100%{opacity:0.75;}20%{opacity:0.95;}
  42%{opacity:0.58;}65%{opacity:0.88;}84%{opacity:0.65;}}
@keyframes hsMoon{0%,100%{opacity:0.52;}50%{opacity:0.84;}}
@keyframes hsDust{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  8%{opacity:var(--dp,0.65);}90%{opacity:0.15;}
  100%{transform:translateY(var(--dy,-140px)) translateX(var(--dx,10px));opacity:0;}}
@keyframes hsFadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="particles"></div>

<a href="../index.html" class="exit-home" id="exitHome">↺  Homepage</a>
<div class="key-bar" id="keyBar"></div>
<button id="mapBtn" title="Open the Marduk View">⬡ MAP</button>
<div class="room-coords" id="roomCoords"></div>

<div id="stage"></div>
<div class="nav-arrows" id="navArrows"></div>

<!-- Marduk View overlay -->
<!-- KUDRAMARDUK mode bar -->
<div id="kudraMode" class="">
  <span>✦ KUDRAMARDUK MODE ✦ — click to exit</span>
</div>
<!-- in-site popup -->
<div id="sitePopup" style="display:none;" class="site-popup">
  <div class="site-popup-inner">
    <div class="site-popup-title" id="popupTitle"></div>
    <div class="site-popup-body" id="popupBody"></div>
    <div class="site-popup-btns" id="popupBtns"></div>
  </div>
</div>

<div id="mv-stage">
  <div id="mv-header">
    <div>
      <span class="mv-title">The Marduk View</span>
      <span class="mv-sub" id="mvSub">· All Rooms</span>
    </div>
    <div class="mv-controls">
      <button class="mv-ctl" id="mvZoomOut" title="Zoom out">−</button>
      <button class="mv-ctl" id="mvZoomIn"  title="Zoom in">+</button>
      <button class="mv-ctl" id="mvRecenter" title="Recenter">⌖</button>
      <button class="mv-close" id="mvClose">Close</button>
    </div>
  </div>
  <div id="mv-canvas-wrap">
    <canvas id="mv-canvas"></canvas>
    <!-- Info panel: slides up when a tile is tapped -->
    <div id="mvInfo" class="mv-info"></div>
  </div>
  <div id="mv-footer">
    <span class="mv-hover" id="mvHover">Tap a cell to preview  ·  tap again to travel  ·  pinch to zoom  ·  drag to pan</span>
    <div class="mv-legend">
      <div class="item"><span class="dot" style="background:var(--gold);"></span>Home</div>
      <div class="item"><span class="dot" style="background:var(--spirit);"></span>Visited</div>
      <div class="item"><span class="dot" style="background:var(--gold2);"></span>Correct</div>
      <div class="item"><span class="dot" style="background:var(--ember);"></span>House door</div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
 *  MARDUK'S MAP — /realm/  grid SPA  v4.0
 * ═══════════════════════════════════════════════
 * 33×33 grid, centred at (0,0). URL hash = salted
 * base36 encoding of (x,y). All state persisted
 * in localStorage under key "marduk_realm".
 * ═══════════════════════════════════════════════ */

const GRID_EXTENT = 16;          // tiles from centre in each direction
const GRID_SIZE   = 33;          // 2·16 + 1
const SALT        = 7919;        // URL obscurer
const SESSION_LOCK_HOURS = 12;

let REALM = null;                // loaded from realm.json

/* ── URL <-> (x,y) ─────────────────────────────── */
function encodeXY(x, y) {
  const n = (x + GRID_EXTENT) * GRID_SIZE + (y + GRID_EXTENT) + SALT;
  return n.toString(36).padStart(4, '0');
}
function decodeXY(hash) {
  if (!hash || !/^[0-9a-z]{3,5}$/i.test(hash)) return null;
  const n = parseInt(hash, 36) - SALT;
  if (isNaN(n) || n < 0) return null;
  const x = Math.floor(n / GRID_SIZE) - GRID_EXTENT;
  const y = (n % GRID_SIZE) - GRID_EXTENT;
  if (Math.abs(x) > GRID_EXTENT || Math.abs(y) > GRID_EXTENT) return null;
  return {x, y};
}
function inBounds(x, y) {
  return Math.abs(x) <= GRID_EXTENT && Math.abs(y) <= GRID_EXTENT;
}

/* ── persisted state ───────────────────────────── */
function getP() {
  try { return JSON.parse(localStorage.getItem('marduk_realm') || '{}'); }
  catch (e) { return {}; }
}
function saveP(p) {
  localStorage.setItem('marduk_realm', JSON.stringify(p));
}
function markVisited(x, y) {
  const p = getP();
  p.visited = p.visited || [];
  const k = `${x},${y}`;
  if (!p.visited.includes(k)) p.visited.push(k);
  saveP(p);
}
function markCorrect(qid) {
  const p = getP();
  p.correct = p.correct || {};
  if (!p.correct[qid]) p.correct[qid] = true;
  saveP(p);
  return Object.keys(p.correct).length;
}
function countCorrect() {
  const p = getP();
  return Object.keys(p.correct || {}).length;
}
function isCorrect(qid) {
  const p = getP();
  return !!(p.correct && p.correct[qid]);
}
function incAttempts() {
  const p = getP();
  p.attempts = (p.attempts || 0) + 1;
  saveP(p);
  return p.attempts;
}
function setSessionLock() {
  const p = getP();
  p.lockedUntil = Date.now() + SESSION_LOCK_HOURS * 3600 * 1000;
  saveP(p);
}
function isLocked() {
  const p = getP();
  return p.lockedUntil && p.lockedUntil > Date.now();
}
function unlockMV() {
  const p = getP();
  p.mv_unlocked = true;
  saveP(p);
}
function isMVUnlocked() {
  return !!getP().mv_unlocked;
}
function unlockKudra() {
  const p = getP();
  p.kudra = true;
  saveP(p);
}
function isKudraUnlocked() {
  return !!getP().kudra;
}
function updateKeyBar() {
  const el = document.getElementById('progressDisplay');
  if (el) el.textContent = `${countCorrect()} / 10`;
}

/* ── tile lookup ───────────────────────────────── */
function getTile(x, y) {
  if (!REALM) return null;
  if (!inBounds(x, y)) return null;
  const k = `${x},${y}`;
  return REALM.tiles[k] || {type: 'empty'};
}

/* ── Starfield ─────────────────────────────────── */
let starCtx, starStars = [], starT = 0, starW, starH;
let starOpts = {speed: 0.015, count: 200, color: '220,215,200'};
let starRaf;
function initStars(opts) {
  starOpts = Object.assign({}, starOpts, opts || {});
  const c = document.getElementById('bg');
  starCtx = c.getContext('2d');
  resizeStars();
  initStarData();
  if (starRaf) cancelAnimationFrame(starRaf);
  drawStars();
}
function resizeStars() {
  const c = document.getElementById('bg');
  starW = c.width = window.innerWidth;
  starH = c.height = window.innerHeight;
}
function initStarData() {
  starStars = [];
  for (let i = 0; i < starOpts.count; i++) {
    starStars.push({
      x: Math.random() * starW, y: Math.random() * starH,
      r: Math.random() * 1.4 + 0.2,
      speed: Math.random() * starOpts.speed * 2 + starOpts.speed * 0.5,
      op: Math.random() * 0.6 + 0.1,
      tw: Math.random() * Math.PI * 2,
    });
  }
}
function drawStars() {
  starRaf = requestAnimationFrame(drawStars);
  starT += 0.004;
  starCtx.clearRect(0, 0, starW, starH);
  starStars.forEach(s => {
    const op = s.op * (0.7 + 0.3 * Math.sin(starT + s.tw));
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(${starOpts.color},${op})`;
    starCtx.fill();
    s.y += s.speed;
    if (s.y > starH) { s.y = 0; s.x = Math.random() * starW; }
  });
}

/* ── Particles ─────────────────────────────────── */
let particleInterval;
function startParticles(opts) {
  clearInterval(particleInterval);
  const el = document.getElementById('particles');
  el.innerHTML = '';
  opts = Object.assign({colors: ['#c9a84c'], min: 1, max: 3, speed: 5}, opts || {});
  particleInterval = setInterval(() => {
    const p = document.createElement('div');
    const c = opts.colors[Math.floor(Math.random() * opts.colors.length)];
    const size = Math.random() * (opts.max - opts.min) + opts.min;
    const x = Math.random() * 100;
    const dur = Math.random() * opts.speed + opts.speed * 0.5;
    const dx = (Math.random() - 0.5) * 100;
    p.style.cssText = `position:absolute;bottom:0;left:${x}%;width:${size}px;height:${size}px;background:${c};border-radius:50%;pointer-events:none;animation:particleRise ${dur}s linear forwards;--pdx:${dx}px;`;
    el.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000 + 100);
  }, 400);
}

/* ── FX canvas ─────────────────────────────────── */
let fxRaf;
function clearFx() {
  if (fxRaf) cancelAnimationFrame(fxRaf);
  const c = document.getElementById('fx');
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
}
function clearOverlays() {
  document.querySelectorAll('.grid-ov,.scan-ov,.house-ov').forEach(e => e.remove());
}
function addOverlay(cls) {
  const d = document.createElement('div');
  d.className = cls;
  document.body.appendChild(d);
}

function initFxForRoom(fx) {
  if (!fx) return;
  const c = document.getElementById('fx');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  const ctx = c.getContext('2d');
  if (fx === 'ripple') {
    let ripples = [];
    setInterval(() => ripples.push({x: Math.random() * c.width, y: c.height * 0.6 + Math.random() * c.height * 0.4, r: 0, max: Math.random() * 120 + 60, speed: Math.random() * 0.5 + 0.3}), 900);
    (function draw(){fxRaf = requestAnimationFrame(draw); ctx.clearRect(0,0,c.width,c.height); ripples = ripples.filter(r => {r.r += r.speed; const op = Math.max(0, 0.07 * (1 - r.r/r.max)); ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.strokeStyle = `rgba(126,184,212,${op})`; ctx.lineWidth = 1; ctx.stroke(); return r.r < r.max;});})();
  } else if (fx === 'matrix') {
    const cols = Math.floor(c.width / 20);
    const drops = new Array(cols).fill(0);
    const chars = '01アイウエオ█▓▒░';
    (function draw(){fxRaf = requestAnimationFrame(draw); ctx.fillStyle = 'rgba(5,7,9,0.05)'; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle = 'rgba(126,212,160,0.1)'; ctx.font = '12px monospace'; drops.forEach((y, i) => {ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i*20, y*20); if (y*20 > c.height && Math.random() > 0.975) drops[i] = 0; else drops[i]++;});})();
  } else if (fx === 'nodes') {
    const nodes = [];
    for (let i = 0; i < 40; i++) nodes.push({x: Math.random()*c.width, y: Math.random()*c.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*2 + 1});
    (function draw(){fxRaf = requestAnimationFrame(draw); ctx.clearRect(0,0,c.width,c.height); nodes.forEach(n => {n.x += n.vx; n.y += n.vy; if (n.x<0||n.x>c.width) n.vx*=-1; if (n.y<0||n.y>c.height) n.vy*=-1; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fillStyle='rgba(192,132,252,0.4)'; ctx.fill();}); nodes.forEach((a, i) => nodes.forEach((b, j) => {if (j<=i) return; const d = Math.hypot(a.x-b.x, a.y-b.y); if (d<120) {ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.strokeStyle = `rgba(192,132,252,${0.06*(1-d/120)})`; ctx.lineWidth=0.5; ctx.stroke();}}));})();
  } else if (fx === 'orbit') {
    let t = 0;
    (function draw(){fxRaf = requestAnimationFrame(draw); ctx.clearRect(0,0,c.width,c.height); t += 0.008; for (let i = 0; i < 8; i++) {const a = t + i*(Math.PI*2/8); const x = c.width/2 + Math.cos(a)*(80+i*30); const y = c.height/2 + Math.sin(a)*(60+i*20); ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fillStyle = `rgba(201,168,76,${0.15-i*0.015})`; ctx.fill();}})();
  }
}

/* ── Door permissions ──────────────────────────── */
/* Returns which directions are passable from (x,y).
 * Returns {up, down, left, right} each: {open:bool, path?:bool, sealed?:bool, reason?:string}
 */
function getDoors(x, y) {
  const tile = getTile(x, y);
  const dirs = {
    up:    {dx: 0,  dy: 1},
    down:  {dx: 0,  dy:-1},
    left:  {dx:-1,  dy: 0},
    right: {dx: 1,  dy: 0},
  };
  const out = {};
  for (const [d, v] of Object.entries(dirs)) {
    const nx = x + v.dx, ny = y + v.dy;
    if (!inBounds(nx, ny)) { out[d] = {sealed: true, reason: 'edge'}; continue; }

    const neighbour = getTile(nx, ny);

    /* House perimeter rules: sealed except at front door */
    if (tile.type === 'house_interior' || tile.type === 'house_front_door') {
      const sameHouse = neighbour.house_id === tile.house_id;
      if (!sameHouse) {
        // Exiting the house: only allowed from the front door tile
        if (tile.type === 'house_front_door') {
          out[d] = {open: true};
        } else {
          out[d] = {sealed: true, reason: 'house-wall'};
        }
        continue;
      }
    }
    /* Going from outside into a house block — only front door is accessible */
    if ((neighbour.type === 'house_interior' || neighbour.type === 'house_front_door') &&
        tile.house_id !== neighbour.house_id) {
      if (neighbour.type === 'house_front_door') {
        // Allow entry from any direction — the path guard handles sequencing
        out[d] = {open: true};
      } else {
        out[d] = {sealed: true, reason: 'house-wall'};
      }
      continue;
    }

    /* Marduk View tile — only accessible from (0, +2) Spine after all 10 correct, or if already unlocked */
    if (neighbour.type === 'marduk_view') {
      if (isMVUnlocked() || (x === 0 && y === 2 && countCorrect() >= 10)) {
        out[d] = {open: true};
      } else {
        out[d] = {sealed: true, reason: 'mv-locked'};
      }
      continue;
    }
    if (tile.type === 'marduk_view') { out[d] = {open: true}; continue; }

    /* Quiz tiles — only enterable if previous rooms solved in sequence */
    if (neighbour.type === 'quiz') {
      const qid = neighbour.question_id;
      const prevQ = qid === 'Q1' ? null : 'Q' + (parseInt(qid.slice(1)) - 1);
      if (!prevQ || isCorrect(prevQ) || isCorrect(qid)) {
        out[d] = {open: true};
      } else {
        out[d] = {sealed: true, reason: 'locked-quiz'};
      }
      continue;
    }

    /* Path guard — skip-over rule.
     * Walking into a path tile from the wrong direction skips OVER it
     * to the tile beyond, rather than blocking.  The path itself is
     * still a tunnel: you just pass through without entering it.
     * Step-0 (entrance) tiles of every path are always enterable.
     * KUDRAMARDUK mode bypasses the guard entirely. */
    if (neighbour.on_path && neighbour.on_path.length > 0 && REALM && REALM.paths
        && !isKudraUnlocked()) {
      let anyPathAllows = false;
      for (const pid of neighbour.on_path) {
        const seq = REALM.paths[pid];
        if (!seq) continue;
        const nIdx = seq.findIndex(pt => pt[0] === nx && pt[1] === ny);
        if (nIdx <= 0) { anyPathAllows = true; break; }
        // Allow if coming from the true predecessor OR successor (walk both ways)
        const pred = seq[nIdx - 1];
        const succ = nIdx + 1 < seq.length ? seq[nIdx + 1] : null;
        if ((pred[0] === x && pred[1] === y) ||
            (succ && succ[0] === x && succ[1] === y)) {
          anyPathAllows = true; break;
        }
        // Also allow if the CURRENT tile is at step 0 of this path
        // (i.e. we are the path entrance and entering step 1)
        const curStep = (tile.path_step || {})[pid];
        if (curStep === 0) { anyPathAllows = true; break; }
      }
      if (!anyPathAllows) {
        // Skip over the path tile to the one beyond in the same direction
        const skipX = nx + v.dx, skipY = ny + v.dy;
        if (inBounds(skipX, skipY)) {
          out[d] = {open: true, skip_to: [skipX, skipY]};
        }
        // No arrow if skip target is out of bounds
        continue;
      }
    }

    /* Zone wall — skip-over rule.
     * Approaching a zone boundary without keys or from the wrong side
     * skips to the tile beyond the zone.  No lock screen is shown. */
    const tileInZone = !!tile.zone_id;
    const nbInZone   = !!neighbour.zone_id;
    if (!tileInZone && nbInZone) {
      if (neighbour.type === 'locked_zone_threshold' && isKudraUnlocked()) {
        // KUDRAMARDUK — let through, fall to default open
      } else if (neighbour.type === 'locked_zone_threshold') {
        const needed = neighbour.keys_required || [];
        if (!hasAllKeys(needed)) {
          const skipX = nx + v.dx, skipY = ny + v.dy;
          if (inBounds(skipX, skipY)) out[d] = {open: true, skip_to: [skipX, skipY]};
          continue;
        }
      } else {
        // Perimeter interior — skip over
        const skipX = nx + v.dx, skipY = ny + v.dy;
        if (inBounds(skipX, skipY)) out[d] = {open: true, skip_to: [skipX, skipY]};
        continue;
      }
    } else if (tileInZone && !nbInZone) {
      if (tile.type !== 'locked_zone_threshold' && !isKudraUnlocked()) {
        // Can't exit zone interior tiles sideways
        const skipX = nx + v.dx, skipY = ny + v.dy;
        if (inBounds(skipX, skipY)) out[d] = {open: true, skip_to: [skipX, skipY]};
        continue;
      }
    }

    /* Default open — mark as on-path for visual thread rendering */
    const onSharedPath = tile.on_path && neighbour.on_path &&
                 tile.on_path.some(p => neighbour.on_path.includes(p));
    out[d] = {open: true, path: !!onSharedPath};
  }
  return out;
}

/* ── Navigation ────────────────────────────────── */
function saveLastTile(x, y) {
  const p = getP();
  p.lastTile = [x, y];
  saveP(p);
}
function getLastTile() {
  const lt = getP().lastTile;
  return lt ? {x: lt[0], y: lt[1]} : null;
}

/* Path guard: returns true if arriving at (x,y) from lastTile is legal.
 * Rule: step 0 of any path = open entry. Any other step = must come
 * from the adjacent step on the same path (prev or next). */
function pathGuardOk(x, y) {
  const tile = getTile(x, y);
  if (!tile.on_path || tile.on_path.length === 0) return true;
  for (const pid of tile.on_path) {
    const myStep = (tile.path_step || {})[pid];
    if (myStep === undefined) continue;
    if (myStep === 0) return true;            // entrance — always open
    const lt = getLastTile();
    if (!lt) return true;                     // fresh start — be lenient
    const prev = getTile(lt.x, lt.y);
    const prevStep = (prev.path_step || {})[pid];
    if (prevStep === myStep - 1 || prevStep === myStep + 1) return true;
  }
  return false;
}

/* showPathError removed — skip-over used instead */

function goTo(x, y, delay) {
  delay = delay || 0;
  // Save current position as lastTile before navigating away
  const curHash = (window.location.hash || '').replace('#', '');
  const cur = decodeXY(curHash);
  if (cur) saveLastTile(cur.x, cur.y);

  setTimeout(() => {
    const s = document.getElementById('stage');
    s.style.opacity = '0';
    setTimeout(() => {
      window.location.hash = encodeXY(x, y);
      render(x, y);
    }, 400);
  }, delay);
}

function randomSouthTile() {
  const cx = Math.floor(Math.random() * 21) - 10;
  const cy = -Math.floor(Math.random() * 6) - 5;
  return {x: cx, y: cy};
}

/* ── Rendering ─────────────────────────────────── */
function render(x, y) {
  clearFx();
  clearOverlays();
  if (particleInterval) clearInterval(particleInterval);
  // Clean up house scene if active
  const prevStage = document.getElementById('stage');
  if (prevStage && prevStage._hsCleanup) { prevStage._hsCleanup(); prevStage._hsCleanup = null; }

  // Lock only applies to the quiz corridor: threshold → quiz tiles → spine.
  // marduk_view is excluded — KUDRAMARDUK routes there directly and must bypass.
  // Normal gateway entry (content/house/empty tiles) is never affected.
  const tileForLockCheck = getTile(x, y);
  const quizPathTypes = ['threshold', 'quiz', 'spine'];
  if (isLocked() && quizPathTypes.includes(tileForLockCheck.type)) {
    renderLock();
    return;
  }

  markVisited(x, y);
  updateKeyBar();
  // Auto-collect key if this tile holds one
  const _thisTile = getTile(x, y);
  if (_thisTile.key_id) {
    const _isNew = collectKey(_thisTile.key_id);
    if (_isNew) {
      flashKeyCollect(_thisTile.key_id);
      updateKeyBar();
    }
  }

  const tile = getTile(x, y);

  // Path entry is now managed by skip-over in getDoors — no guard needed here.
  // (showPathError was removed in v4.9; this block was the crash source.)

  // Save current tile as lastTile
  saveLastTile(x, y);
  const s = document.getElementById('stage');
  const navEl = document.getElementById('navArrows');
  s.style.opacity = '1';
  navEl.innerHTML = '';
  // Reset stage style so house-scene leftover styles don't bleed
  s.style.cssText = 'position:relative;z-index:10;width:100%;height:100vh;'
    + 'display:flex;flex-direction:column;justify-content:center;'
    + 'align-items:center;padding:80px 24px;text-align:center;'
    + 'overflow-y:auto;transition:opacity 0.5s ease;';

  // Coords display
  const coord = tile.coord || `(${x >= 0 ? '+' : ''}${x}, ${y >= 0 ? '+' : ''}${y})`;
  document.getElementById('roomCoords').textContent = coord;

  // Route by type
  if (tile.type === 'marduk_view') { renderMardukView(); return; }
  if (tile.type === 'threshold')   { renderThreshold(s, x, y); }
  else if (tile.type === 'quiz')   { renderQuiz(s, x, y, tile); }
  else if (tile.type === 'home')   { renderHome(s, x, y, tile); }
  else if (tile.type === 'spine')  { renderSpine(s, x, y, tile); }
  else if (tile.type === 'content' || tile.type === 'house_interior' || tile.type === 'house_front_door') {
    const sceneKey = `${x},${y}`;
    if (HOUSE_SCENES[sceneKey]) {
      renderHouseScene(s, x, y, tile, HOUSE_SCENES[sceneKey]);
    } else {
      renderContent(s, x, y, tile);
    }
  }
  else if (tile.on_path && tile.on_path.length > 0 && !tile.name) {
    // Unmarked path tile — show coloured transit render
    renderPathTile(s, x, y, tile);
  }
  else if (tile.type === 'locked_zone_threshold' || tile.type === 'locked_zone_interior') {
    renderZoneTile(s, x, y, tile);
  }
  else if (tile.type === 'special') {
    renderSpecialTile(s, x, y, tile);
  }
  else { renderEmpty(s, x, y, tile); }

  // Navigation arrows — suppressed inside house scenes (exits are in-scene)
  if (!HOUSE_SCENES[`${x},${y}`]) {
    renderNavArrows(x, y);
  }

  // Environmental overlays
  if (tile.house_id) {
    addOverlay('house-ov');
  }
  if (tile.type === 'quiz') {
    const q = REALM.questions[tile.question_id];
    if (q.tier === 3) addOverlay('grid-ov');
    if (q.fx === 'matrix') addOverlay('scan-ov');
  }
}

  const tierDark = q.tier === 3

  s.querySelectorAll('.door').forEach(btn => {

      const kind = btn.dataset.kind;
      s.querySelectorAll('.door').forEach(b => b.disabled = true);
      if (kind === 'correct') {
        btn.classList.add('correct');
        markCorrect(tile.question_id);
        // Move to next tile in spine towards Marduk View
        setTimeout(() => advanceFromQuiz(tile.question_id), 800);
      } else {
        btn.classList.add('wrong');
        setTimeout(() => penaltyForTier(q.tier, x, y), 900);

function advanceFromQuiz(qid) {
  // After answering a quiz correctly, fall through to the next quiz tile.
  // Q1 -> Q2 -> Q3 -> Q4 -> Q5 -> Q6 -> Q7 -> Q8 -> Q9 -> Q10 -> Spine (0,+2)
  const n = parseInt(qid.slice(1));
  const coordsByQ = {
    1: [-2, 2], 2: [-1, 2], 3: [1, 2], 4: [2, 2],
    5: [-1, 3], 6: [0, 3], 7: [1, 3],
    8: [-1, 4], 9: [0, 4], 10: [1, 4],
  };
  if (n < 10) {
    const [nx, ny] = coordsByQ[n + 1];
    goTo(nx, ny);
  } else {
    // All ten done — unlock and funnel into the Spine
    unlockMV();
    goTo(0, 2);
  }
}

function penaltyForTier(tier, x, y) {
  if (tier === 1) {
    // Return to the previous tile (whatever the user came from — best-effort = go south)
    goTo(x, y - 1);
  } else if (tier === 2) {
    // Teleport to a random south-side maze tile
    const t = randomSouthTile();
    goTo(t.x, t.y);
  } else {
    // Tier 3: return to threshold; increment attempts; lock after 3 wipes
    const attempts = incAttempts();
    if (attempts >= 3) {
      setSessionLock();
      renderLock();
      return;
    }
    goTo(0, 5);
  }
}

function renderLock() {
  const p = getP();
  const s = document.getElementById('stage');
  document.getElementById('navArrows').innerHTML = '';
  document.body.style.background = 'radial-gradient(ellipse at center, rgba(60,15,5,0.3), var(--bg) 80%)';
  initStars({count: 100, color: '180,100,80', speed: 0.005});
  startParticles({colors: ['#ff6b2b44', '#c9a84c22'], min: 1, max: 2, speed: 10});

  function fmt() {
    const remaining = Math.max(0, p.lockedUntil - Date.now());
    const h = Math.floor(remaining / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const sec = Math.floor((remaining % 60000) / 1000);
    if (remaining <= 0) return 'Unlocking…';
    return `${h}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s remaining`;
  }

  s.innerHTML = `
    <div class="lock-screen">
      <div class="lock-glyph">𒀭</div>
      <div class="lock-title">The Quiz Is Sealed</div>
      <div class="lock-text">
        You chose wrongly in the deepest chambers three times. The quiz path has sealed itself — not as punishment, but as mercy. <em>Come back when the books have settled inside you.</em>
        <br><br>
        The rest of the Realm remains open. You may still enter through the western, eastern, or southern gates.
      </div>
      <div class="lock-timer" id="lockTimer">${fmt()}</div>
    </div>`;

  // Live countdown — refreshes every second
  const lockInterval = setInterval(() => {
    const el = document.getElementById('lockTimer');
    if (!el) { clearInterval(lockInterval); return; }
    el.textContent = fmt();
    if (Date.now() >= p.lockedUntil) {
      clearInterval(lockInterval);
      el.textContent = 'The seal has lifted. You may try again.';
      el.style.color = 'var(--spirit)';
    }
  }, 1000);
}

/* ── Navigation arrows ────────────────────────── */
function renderNavArrows(x, y) {
  const el = document.getElementById('navArrows');
  el.innerHTML = '';
  const tile = getTile(x, y);
  // Quiz / threshold: no arrows (doors are the nav)
  if (tile.type === 'quiz' || tile.type === 'threshold' || tile.type === 'marduk_view') return;

  const doors = getDoors(x, y);
  const dirs = [
    {key:'up',    dx: 0, dy: 1, glyph:'↑'},
    {key:'down',  dx: 0, dy:-1, glyph:'↓'},
    {key:'left',  dx:-1, dy: 0, glyph:'←'},
    {key:'right', dx: 1, dy: 0, glyph:'→'},
  ];
  dirs.forEach(d => {
    const door = doors[d.key];
    if (!door) return;
    if (door.sealed) return; // don't render sealed-edge arrows at all
    // skip_to: arrow navigates to the tile beyond the blocked one
    const destX = door.skip_to ? door.skip_to[0] : x + d.dx;
    const destY = door.skip_to ? door.skip_to[1] : x + d.dx === destX ? y + d.dy : y + d.dy;
    const dX = door.skip_to ? door.skip_to[0] : x + d.dx;
    const dY = door.skip_to ? door.skip_to[1] : y + d.dy;
    const a = document.createElement('a');
    a.className = 'nav-arrow ' + d.key + (door.path ? ' path' : '');
    a.href = '#' + encodeXY(dX, dY);
    a.textContent = d.glyph;
    a.title = `Go ${d.key}`;
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      goTo(dX, dY);
    });
    el.appendChild(a);
  });
}

/* ═══════════════════════════════════════════════
 *  MARDUK VIEW — game-like map (v4.2)
 * ═══════════════════════════════════════════════
 * - Touch-native: dedicated touchstart/move/end handlers
 *   (avoids Pointer Events, which are unreliable in iOS Safari)
 * - Kinetic panning with velocity + decay after flick
 * - Smooth eased zoom (tweens mvZoom -> mvTargetZoom per frame)
 * - Pinch-to-zoom anchored on pinch midpoint (no drift)
 * - Double-tap to zoom in centred on tap point
 * - Tap-to-preview (single tap), tap-again-to-travel
 * - Visual feedback: tap ripple, selected-cell halo pulse
 * - Big default cells (radius 36px) — feels like a strategy map
 * - Continuous rAF loop so zoom / velocity / ripple all ease
 * ═══════════════════════════════════════════════ */

const MV_R = 24;                   // base hex radius at zoom 1
const MV_ZOOM_MIN  = 0.5;
const MV_ZOOM_MAX  = 5.5;
const MV_ZOOM_HOME = 1.8;          // default zoom on open / recenter
const MV_ZOOM_EASE = 0.18;         // 0..1 per frame — higher = snappier
const MV_PAN_DECAY = 0.90;         // velocity decay per frame
const MV_PAN_STOP  = 0.35;         // below this px/frame, stop
const MV_TAP_MOVE_PX = 22;         // move threshold for tap vs drag (raised to avoid accidental nav)
const MV_TAP_TIME_MS = 320;
const MV_DBL_TIME_MS = 320;
const MV_DBL_DIST_PX = 36;

let mvZoom       = MV_ZOOM_HOME;
let mvTargetZoom = MV_ZOOM_HOME;
let mvZoomAnchor = null;           // screen point to keep fixed during zoom tween
let mvOffset     = {x: 0, y: 0};
let mvVel        = {x: 0, y: 0};
let mvSelected   = null;
let mvRipples    = [];             // [{x, y, t0}]
let mvRaf        = null;
let mvCanvasCtx  = null;
let mvWrapEl     = null;
let mvCanvasEl   = null;
let mvDrawFn     = null;
let mvResizeFn   = null;

function renderMardukView() {
  updateKeyBar();
  document.getElementById('stage').innerHTML = '';
  document.getElementById('navArrows').innerHTML = '';
  const mv = document.getElementById('mv-stage');
  mv.classList.add('show');
  // Hide key bar and kudra bar behind MV header
  const _kb = document.getElementById('keyBar');
  if (_kb) _kb.style.visibility = 'hidden';
  document.getElementById('mvSub').textContent = isKudraUnlocked()
    ? '· All Rooms · KUDRAMARDUK overlay'
    : '· All Rooms';
  setupMVCanvas();
  document.body.style.background = 'var(--bg)';
  initStars({count: 320, color: '230,220,190', speed: 0.005});
  startParticles({colors: ['#c9a84c22', '#7eb8d422'], min: 1, max: 2, speed: 12});
}

function setupMVCanvas() {
  mvWrapEl   = document.getElementById('mv-canvas-wrap');
  mvCanvasEl = document.getElementById('mv-canvas');
  mvCanvasCtx = mvCanvasEl.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  // Set initial state
  mvZoom = mvTargetZoom = MV_ZOOM_HOME;
  mvOffset = {x: 0, y: 0};
  mvVel = {x: 0, y: 0};
  mvSelected = null;
  mvRipples = [];
  hideInfoPanel();

  function sizeCanvas() {
    const w = mvWrapEl.clientWidth;
    const h = mvWrapEl.clientHeight;
    mvCanvasEl.style.width  = w + 'px';
    mvCanvasEl.style.height = h + 'px';
    mvCanvasEl.width  = Math.floor(w * dpr);
    mvCanvasEl.height = Math.floor(h * dpr);
  }
  sizeCanvas();

  /* ── hex geometry ─────────────────────────────── */
  function metrics() {
    const r = MV_R * mvZoom;
    return {r, hexW: Math.sqrt(3) * r, hexH: 2 * r * 0.75};
  }
  function gridToScreen(x, y, m) {
    m = m || metrics();
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    const stagger = (y % 2 === 0 ? 0 : m.hexW / 2);
    const px = W / 2 + mvOffset.x + x * m.hexW + stagger;
    const py = H / 2 + mvOffset.y - y * m.hexH;
    return [px, py];
  }
  function screenToGrid(sx, sy) {
    // Inverse of gridToScreen, approximate — used for zoom anchoring.
    // Ignores row stagger; good enough for pinch/tween centring.
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    const m = metrics();
    return {
      gx: (sx - W / 2 - mvOffset.x) / m.hexW,
      gy: (H / 2 + mvOffset.y - sy) / m.hexH,
    };
  }
  function tileAtPixel(sx, sy) {
    const m = metrics();
    let best = null, bestD = Infinity;
    for (let x = -GRID_EXTENT; x <= GRID_EXTENT; x++) {
      for (let y = -GRID_EXTENT; y <= GRID_EXTENT; y++) {
        const [px, py] = gridToScreen(x, y, m);
        const d = Math.hypot(px - sx, py - sy);
        if (d < m.r && d < bestD) {
          bestD = d;
          best = {x, y, info: getTile(x, y)};
        }
      }
    }
    return best;
  }

  /* ── zoom anchor: change zoom while keeping a screen point fixed */
  function setZoomAround(newZoom, anchorSx, anchorSy) {
    newZoom = Math.max(MV_ZOOM_MIN, Math.min(MV_ZOOM_MAX, newZoom));
    // Find the grid point currently under the anchor
    const g = screenToGrid(anchorSx, anchorSy);
    // Apply new zoom
    mvZoom = newZoom;
    // Recompute where that grid point would be in screen space, shift offset to re-anchor
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    const m = metrics();
    const newSx = W / 2 + mvOffset.x + g.gx * m.hexW;
    const newSy = H / 2 + mvOffset.y - g.gy * m.hexH;
    mvOffset.x += (anchorSx - newSx);
    mvOffset.y += (anchorSy - newSy);
  }

  /* ── drawing ──────────────────────────────────── */
  function drawHex(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 2;
      const hx = x + Math.cos(a) * r;
      const hy = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
  }

  function draw() {
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    const ctx = mvCanvasCtx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const m = metrics();
    const {r, hexW, hexH} = m;
    const zoomStage = mvZoom < 0.75 ? 'far' : (mvZoom < 1.6 ? 'mid' : 'near');
    const now = performance.now();

    // Parallax background wash — subtle coloured radial that shifts with offset
    const bgGrad = ctx.createRadialGradient(W / 2 + mvOffset.x * 0.3, H / 2 + mvOffset.y * 0.3, 40,
                                            W / 2, H / 2, Math.max(W, H) * 0.8);
    bgGrad.addColorStop(0, 'rgba(40,30,15,0.22)');
    bgGrad.addColorStop(1, 'rgba(5,7,12,0)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // KUDRAMARDUK path overlay
    if (isKudraUnlocked()) {
      Object.keys(REALM.paths).forEach(pathId => {
        const pts = REALM.paths[pathId];
        ctx.beginPath();
        pts.forEach((pt, i) => {
          const [px, py] = gridToScreen(pt[0], pt[1], m);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = 'rgba(232,201,110,0.75)';
        ctx.lineWidth = Math.max(2, r * 0.14);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(232,201,110,0.8)';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
      });
    }

    const p = getP();
    const visited = new Set(p.visited || []);
    const selKey = mvSelected ? `${mvSelected.x},${mvSelected.y}` : null;

    // Cells
    const padR = r * 2;
    for (let x = -GRID_EXTENT; x <= GRID_EXTENT; x++) {
      for (let y = -GRID_EXTENT; y <= GRID_EXTENT; y++) {
        const [px, py] = gridToScreen(x, y, m);
        if (px < -padR || px > W + padR || py < -padR || py > H + padR) continue;

        const tile      = getTile(x, y);
        const isVisited = visited.has(`${x},${y}`);
        const isHome    = (x === 0 && y === 0);
        const isMV      = (tile.type === 'marduk_view');
        const isQuiz    = (tile.type === 'quiz');
        const isHouse   = !!tile.house_id;
        const isFrontDoor = (tile.type === 'house_front_door');
        const isCorrectQ  = isQuiz && isCorrect(tile.question_id);
        const hasContent  = tile.type && tile.type !== 'empty';
        const isOnPath    = tile.on_path && tile.on_path.length > 0;
        // House/path colour from tile data (set by realm.json)
        const houseHex  = tile.house_color || null;  // e.g. '#C9A84C'
        // For path tiles, use the first path's colour
        const pathHex   = isOnPath && tile.path_colors
          ? tile.path_colors[tile.on_path[0]] : null;
        const isSelected  = selKey === `${x},${y}`;

        // Base styling
        let fill = 'rgba(10,14,22,0.55)';
        let stroke = 'rgba(201,168,76,0.08)';
        let lineW = 1;
        let rimColor = null;

        if (isHome)         { fill = 'rgba(232,201,110,0.55)'; stroke = '#e8c96e'; lineW = 2.8; rimColor = 'rgba(232,201,110,0.8)'; }
        else if (isMV)      { fill = 'rgba(232,201,110,0.32)'; stroke = '#c9a84c'; lineW = 2.2; rimColor = 'rgba(232,201,110,0.55)'; }
        else if (isFrontDoor && houseHex) {
          // Front door glows with its house colour
          fill = houseHex + '44'; stroke = houseHex; lineW = 2.8; rimColor = houseHex + 'AA';
        }
        else if (isHouse && houseHex) {
          // Interior house tile — tinted in house colour
          fill = houseHex + '28'; stroke = houseHex + '88'; lineW = 1.4;
        }
        else if (isOnPath && pathHex && !isHouse) {
          // Path tile — coloured thread
          fill = pathHex + '1E'; stroke = pathHex + 'CC'; lineW = 1.8;
          if (tile.on_path.length > 1) { rimColor = pathHex + '66'; } // shared tile
        }
        else if (isCorrectQ){ fill = 'rgba(232,201,110,0.24)'; stroke = '#e8c96e'; lineW = 1.8; rimColor = 'rgba(232,201,110,0.4)'; }
        else if (isQuiz)    { fill = 'rgba(126,184,212,0.14)'; stroke = 'rgba(126,184,212,0.42)'; lineW = 1.4; }
        else if (tile.zone_id) {
          const _zhx = tile.zone_color || '#555555';
          const _zhr = parseInt(_zhx.slice(1,3),16), _zhg = parseInt(_zhx.slice(3,5),16), _zhb = parseInt(_zhx.slice(5,7),16);
          const _zUnlocked = hasAllKeys((tile.keys_required)||[]);
          if (tile.type === 'locked_zone_threshold') {
            fill = `rgba(${_zhr},${_zhg},${_zhb},0.35)`;
            stroke = _zhx; lineW = 2.2;
            rimColor = _zUnlocked ? `rgba(${_zhr},${_zhg},${_zhb},0.8)` : `rgba(${_zhr},${_zhg},${_zhb},0.35)`;
          } else {
            fill = `rgba(${_zhr},${_zhg},${_zhb},0.18)`;
            stroke = `rgba(${_zhr},${_zhg},${_zhb},0.55)`; lineW = 1.2;
          }
        }
        else if (tile.type === 'special') {
          fill = 'rgba(180,180,200,0.12)'; stroke = 'rgba(200,200,220,0.5)'; lineW = 1.6; rimColor = 'rgba(200,200,220,0.4)';
        }
        else if (isVisited) { fill = 'rgba(201,168,76,0.11)'; stroke = 'rgba(126,184,212,0.3)'; lineW = 1.1; }
        else if (hasContent){ fill = 'rgba(13,17,25,0.75)';   stroke = 'rgba(201,168,76,0.22)'; lineW = 1; }

        // Radial inner gradient fill for a "shine"
        drawHex(ctx, px, py, r * 0.94);
        if (hasContent || isHome || isMV) {
          const g = ctx.createRadialGradient(px - r * 0.25, py - r * 0.3, 1, px, py, r * 0.95);
          const fillBase = fill;
          g.addColorStop(0, fillBase.replace(/[\d.]+\)$/, (a) => Math.min(parseFloat(a) + 0.18, 1) + ')'));
          g.addColorStop(1, fillBase);
          ctx.fillStyle = g;
        } else {
          ctx.fillStyle = fill;
        }
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineW;
        ctx.stroke();

        // Rim glow on important tiles (breathing)
        if (rimColor) {
          const breath = 0.55 + 0.45 * Math.sin(now * 0.0022 + (x + y) * 0.3);
          ctx.save();
          ctx.shadowColor = rimColor;
          ctx.shadowBlur = 14 * breath;
          ctx.strokeStyle = rimColor;
          ctx.lineWidth = 0.6;
          drawHex(ctx, px, py, r * 0.94);
          ctx.stroke();
          ctx.restore();
        }

        // Selected halo — dual ring pulse
        if (isSelected) {
          const pulse = 0.72 + 0.28 * Math.sin(now * 0.006);
          ctx.save();
          ctx.shadowColor = 'rgba(232,201,110,0.9)';
          ctx.shadowBlur = 22;
          drawHex(ctx, px, py, r * 1.08);
          ctx.strokeStyle = `rgba(232,201,110,${pulse})`;
          ctx.lineWidth = 2.6;
          ctx.stroke();
          ctx.restore();
          drawHex(ctx, px, py, r * 1.35);
          ctx.strokeStyle = `rgba(232,201,110,${pulse * 0.28})`;
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }

        // Emoji — mid and near
        if (tile.emoji && zoomStage !== 'far' && r > 12) {
          ctx.font = `${Math.min(r * 1.0, 34)}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const ey = (zoomStage === 'near' && tile.name) ? py - r * 0.12 : py;
          ctx.fillText(tile.emoji, px, ey);
        }

        // Name — near only
        if (zoomStage === 'near' && tile.name && r > 28) {
          ctx.font = `600 ${Math.min(r * 0.24, 12)}px Cinzel,serif`;
          ctx.fillStyle = 'rgba(228,220,203,0.9)';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          const nm = tile.name.length > 17 ? tile.name.slice(0, 15) + '…' : tile.name;
          ctx.fillText(nm, px, py + r * 0.38);
        }
      }
    }

    // Tap ripples (gold ring expanding out from tap point)
    mvRipples = mvRipples.filter(rp => now - rp.t0 < 650);
    mvRipples.forEach(rp => {
      const t = (now - rp.t0) / 650; // 0..1
      const rad = 8 + t * 85;
      const alpha = (1 - t) * 0.55;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rad, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(232,201,110,${alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }

  /* ── animation loop: drives zoom easing, velocity decay, redraw ── */
  let panning = false;           // suspends velocity decay while actively dragging
  function loop() {
    mvRaf = requestAnimationFrame(loop);

    // Ease zoom toward target
    if (Math.abs(mvZoom - mvTargetZoom) > 0.002) {
      if (mvZoomAnchor) {
        const newZ = mvZoom + (mvTargetZoom - mvZoom) * MV_ZOOM_EASE;
        setZoomAround(newZ, mvZoomAnchor.x, mvZoomAnchor.y);
      } else {
        mvZoom = mvZoom + (mvTargetZoom - mvZoom) * MV_ZOOM_EASE;
      }
    } else if (mvZoomAnchor) {
      mvZoomAnchor = null;
    }

    // Apply momentum
    if (!panning && (Math.abs(mvVel.x) > MV_PAN_STOP || Math.abs(mvVel.y) > MV_PAN_STOP)) {
      mvOffset.x += mvVel.x;
      mvOffset.y += mvVel.y;
      mvVel.x *= MV_PAN_DECAY;
      mvVel.y *= MV_PAN_DECAY;
    } else if (!panning) {
      mvVel.x = 0; mvVel.y = 0;
    }

    draw();
  }
  function stopLoop() {
    if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
  }
  // Kick off the loop. Stop when MV stage is hidden (see mvClose handler).
  if (mvRaf) cancelAnimationFrame(mvRaf);
  loop();

  mvDrawFn = draw;
  mvResizeFn = () => { sizeCanvas(); };

  /* ═══════════════════════════════════════════════
   *  INPUT — touch first, mouse second
   * ═══════════════════════════════════════════════ */

  // Active gestures
  let activeTouches = new Map();   // identifier -> {x, y, t}
  let panAnchor = null;            // {sx, sy, offX, offY, lastX, lastY, lastT, vx, vy}
  let pinchAnchor = null;          // {dist, zoom, midSx, midSy, midGrid}
  let tapStart = null;             // {sx, sy, t}
  let lastTap = null;              // {sx, sy, t} — for double-tap detection

  function wrapPos(clientX, clientY) {
    const r = mvWrapEl.getBoundingClientRect();
    return {x: clientX - r.left, y: clientY - r.top};
  }

  function startGesture(touchList) {
    activeTouches.clear();
    for (const t of touchList) {
      const p = wrapPos(t.clientX, t.clientY);
      activeTouches.set(t.identifier, {x: p.x, y: p.y, t: performance.now()});
    }
    beginByCount();
  }

  function beginByCount() {
    if (activeTouches.size === 1) {
      const first = Array.from(activeTouches.values())[0];
      tapStart = {sx: first.x, sy: first.y, t: performance.now()};
      panAnchor = {
        sx: first.x, sy: first.y,
        offX: mvOffset.x, offY: mvOffset.y,
        lastX: first.x, lastY: first.y, lastT: performance.now(),
        vx: 0, vy: 0,
      };
      pinchAnchor = null;
      panning = true;
      mvVel.x = 0; mvVel.y = 0;
    } else if (activeTouches.size === 2) {
      tapStart = null;
      panAnchor = null;
      const arr = Array.from(activeTouches.values());
      const midSx = (arr[0].x + arr[1].x) / 2;
      const midSy = (arr[0].y + arr[1].y) / 2;
      pinchAnchor = {
        dist: Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y),
        zoom: mvZoom,
        midSx, midSy,
        midGrid: screenToGrid(midSx, midSy),
      };
      panning = true;
    }
  }

  function updateGesture(touchList) {
    // Refresh positions
    for (const t of touchList) {
      const p = wrapPos(t.clientX, t.clientY);
      activeTouches.set(t.identifier, {x: p.x, y: p.y, t: performance.now()});
    }

    if (pinchAnchor && activeTouches.size >= 2) {
      const arr = Array.from(activeTouches.values()).slice(0, 2);
      const dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      const midSx = (arr[0].x + arr[1].x) / 2;
      const midSy = (arr[0].y + arr[1].y) / 2;
      const factor = dist / pinchAnchor.dist;
      const newZoom = Math.max(MV_ZOOM_MIN, Math.min(MV_ZOOM_MAX, pinchAnchor.zoom * factor));
      mvZoom = newZoom;
      mvTargetZoom = newZoom;
      // Put pinchAnchor.midGrid back at the current midpoint
      const m = metrics();
      const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
      mvOffset.x = midSx - W / 2 - pinchAnchor.midGrid.gx * m.hexW;
      mvOffset.y = midSy - H / 2 + pinchAnchor.midGrid.gy * m.hexH;
    } else if (panAnchor && activeTouches.size === 1) {
      const p = Array.from(activeTouches.values())[0];
      mvOffset.x = panAnchor.offX + (p.x - panAnchor.sx);
      mvOffset.y = panAnchor.offY + (p.y - panAnchor.sy);
      // Track velocity (px per frame at 60fps)
      const now = performance.now();
      const dt = Math.max(1, now - panAnchor.lastT);
      panAnchor.vx = (p.x - panAnchor.lastX) / dt * 16;
      panAnchor.vy = (p.y - panAnchor.lastY) / dt * 16;
      panAnchor.lastX = p.x;
      panAnchor.lastY = p.y;
      panAnchor.lastT = now;

      if (tapStart && Math.hypot(p.x - tapStart.sx, p.y - tapStart.sy) > MV_TAP_MOVE_PX) {
        tapStart = null;
        mvWrapEl.classList.add('dragging');
      }
    }
  }

  function endGesture(endedIdentifiers) {
    const now = performance.now();

    // Capture final velocity BEFORE removing the anchor
    if (panAnchor && activeTouches.size === 1 && endedIdentifiers.length === 1) {
      mvVel.x = clamp(panAnchor.vx, -50, 50);
      mvVel.y = clamp(panAnchor.vy, -50, 50);
    }

    // Remove ended touches
    for (const id of endedIdentifiers) activeTouches.delete(id);

    // Tap handling
    if (tapStart && activeTouches.size === 0) {
      const dt = now - tapStart.t;
      if (dt < MV_TAP_TIME_MS) {
        handleTap(tapStart.sx, tapStart.sy, now);
      }
      tapStart = null;
    }

    if (activeTouches.size === 0) {
      panAnchor = null;
      pinchAnchor = null;
      panning = false;
      mvWrapEl.classList.remove('dragging');
    } else {
      // Rebase gesture for remaining touches
      beginByCount();
    }
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function handleTap(sx, sy, now) {
    // Double-tap detection
    if (lastTap && (now - lastTap.t) < MV_DBL_TIME_MS &&
        Math.hypot(sx - lastTap.sx, sy - lastTap.sy) < MV_DBL_DIST_PX) {
      // Zoom in centred on tap point
      mvTargetZoom = Math.min(MV_ZOOM_MAX, mvZoom * 1.8);
      mvZoomAnchor = {x: sx, y: sy};
      mvRipples.push({x: sx, y: sy, t0: now});
      lastTap = null;
      return;
    }
    lastTap = {sx, sy, t: now};

    // Single tap on cell
    const tile = tileAtPixel(sx, sy);
    if (!tile) {
      mvSelected = null;
      hideInfoPanel();
      return;
    }
    mvRipples.push({x: sx, y: sy, t0: now});

    if (mvSelected && mvSelected.x === tile.x && mvSelected.y === tile.y) {
      travelFromMV(tile.x, tile.y);
      return;
    }
    mvSelected = {x: tile.x, y: tile.y};
    showInfoPanel(tile);
  }

  /* ── wire touch events ────────────────────────── */
  mvWrapEl.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    startGesture(ev.touches);
  }, {passive: false});

  mvWrapEl.addEventListener('touchmove', (ev) => {
    ev.preventDefault();
    updateGesture(ev.touches);
  }, {passive: false});

  mvWrapEl.addEventListener('touchend', (ev) => {
    ev.preventDefault();
    const ended = [];
    for (const t of ev.changedTouches) ended.push(t.identifier);
    endGesture(ended);
  }, {passive: false});

  mvWrapEl.addEventListener('touchcancel', (ev) => {
    const ended = [];
    for (const t of ev.changedTouches) ended.push(t.identifier);
    endGesture(ended);
  });

  /* ── mouse events (desktop) ───────────────────── */
  let mouseDown = false;
  mvWrapEl.addEventListener('mousedown', (ev) => {
    mouseDown = true;
    const p = wrapPos(ev.clientX, ev.clientY);
    tapStart = {sx: p.x, sy: p.y, t: performance.now()};
    panAnchor = {
      sx: p.x, sy: p.y,
      offX: mvOffset.x, offY: mvOffset.y,
      lastX: p.x, lastY: p.y, lastT: performance.now(),
      vx: 0, vy: 0,
    };
    panning = true;
    mvVel.x = 0; mvVel.y = 0;
  });
  mvWrapEl.addEventListener('mousemove', (ev) => {
    if (!mouseDown) return;
    const p = wrapPos(ev.clientX, ev.clientY);
    mvOffset.x = panAnchor.offX + (p.x - panAnchor.sx);
    mvOffset.y = panAnchor.offY + (p.y - panAnchor.sy);
    const now = performance.now();
    const dt = Math.max(1, now - panAnchor.lastT);
    panAnchor.vx = (p.x - panAnchor.lastX) / dt * 16;
    panAnchor.vy = (p.y - panAnchor.lastY) / dt * 16;
    panAnchor.lastX = p.x;
    panAnchor.lastY = p.y;
    panAnchor.lastT = now;
    if (tapStart && Math.hypot(p.x - tapStart.sx, p.y - tapStart.sy) > MV_TAP_MOVE_PX) {
      tapStart = null;
      mvWrapEl.classList.add('dragging');
    }
  });
  mvWrapEl.addEventListener('mouseup', (ev) => {
    if (!mouseDown) return;
    mouseDown = false;
    const now = performance.now();
    if (panAnchor) {
      mvVel.x = clamp(panAnchor.vx, -50, 50);
      mvVel.y = clamp(panAnchor.vy, -50, 50);
    }
    if (tapStart && (now - tapStart.t) < MV_TAP_TIME_MS) {
      const p = wrapPos(ev.clientX, ev.clientY);
      handleTap(p.x, p.y, now);
    }
    tapStart = null;
    panAnchor = null;
    panning = false;
    mvWrapEl.classList.remove('dragging');
  });
  mvWrapEl.addEventListener('mouseleave', () => {
    mouseDown = false;
    panning = false;
    panAnchor = null;
    tapStart = null;
    mvWrapEl.classList.remove('dragging');
  });

  // Desktop wheel-zoom centred on cursor
  mvWrapEl.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const p = wrapPos(ev.clientX, ev.clientY);
    const factor = Math.exp(-ev.deltaY * 0.0018);
    mvTargetZoom = Math.max(MV_ZOOM_MIN, Math.min(MV_ZOOM_MAX, mvZoom * factor));
    mvZoomAnchor = {x: p.x, y: p.y};
  }, {passive: false});

  /* ── zoom control buttons ─────────────────────── */
  document.getElementById('mvZoomIn').onclick = () => {
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    mvZoomAnchor = {x: W / 2, y: H / 2};
    mvTargetZoom = Math.min(MV_ZOOM_MAX, mvZoom * 1.4);
  };
  document.getElementById('mvZoomOut').onclick = () => {
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    mvZoomAnchor = {x: W / 2, y: H / 2};
    mvTargetZoom = Math.max(MV_ZOOM_MIN, mvZoom / 1.4);
  };
  document.getElementById('mvRecenter').onclick = () => {
    const W = mvWrapEl.clientWidth, H = mvWrapEl.clientHeight;
    mvZoomAnchor = {x: W / 2, y: H / 2};
    mvTargetZoom = MV_ZOOM_HOME;
    // Also pan back to centre (0,0) over a couple of frames by injecting
    // velocity — but simpler: snap offset to 0,0.
    mvOffset.x = 0;
    mvOffset.y = 0;
    mvVel.x = 0;
    mvVel.y = 0;
    mvSelected = null;
    hideInfoPanel();
  };

  /* ── resize ───────────────────────────────────── */
  const ro = new ResizeObserver(() => sizeCanvas());
  ro.observe(mvWrapEl);
}

/* ── Info panel (unchanged external helpers) ───── */
function stripTags(html) { return (html || '').replace(/<[^>]*>/g, ''); }

function showInfoPanel(tileRef) {
  const {x, y, info} = tileRef;
  const panel = document.getElementById('mvInfo');
  const p = getP();
  const visitedSet = new Set(p.visited || []);
  const titleText = info.name
    ? `${info.emoji ? info.emoji + '  ' : ''}${info.name}`
    : 'An empty tile';

  const tags = [];
  if (visitedSet.has(`${x},${y}`)) tags.push('Visited');
  if (info.type === 'quiz' && isCorrect(info.question_id)) tags.push('Answered');
  if (info.type === 'home') tags.push('Home');
  if (info.type === 'threshold') tags.push('Threshold');
  if (info.type === 'marduk_view') tags.push('Reward');
  if (info.type === 'spine') tags.push('Spine');
  if (info.house_id) {
    const h = info.house_id.charAt(0).toUpperCase() + info.house_id.slice(1);
    tags.push(`House of ${h}`);
  }
  if (info.type === 'house_front_door') tags.push('Front Door');
  if (info.on_path && info.on_path.length) tags.push('On a Path');

  let lore = '';
  if (info.lore) {
    const plain = stripTags(info.lore);
    lore = plain.length > 260 ? plain.slice(0, 260) + '…' : plain;
  } else if (info.type === 'quiz') {
    const q = REALM.questions[info.question_id];
    lore = q ? stripTags(q.lore).slice(0, 220) + '…' : '';
  } else if (!info.name) {
    lore = 'An empty tile. Still navigable — keep walking, the realm continues beyond.';
  }

  let actionDisabled = '';
  let actionLabel = 'Travel here →';
  if (info.type === 'marduk_view' && !isMVUnlocked()) {
    actionDisabled = 'disabled';
    actionLabel = 'Locked — solve the quiz';
  }
  if (info.type === 'quiz') {
    const qid = info.question_id;
    const n = parseInt(qid.slice(1));
    if (n > 1 && !isCorrect('Q' + (n - 1)) && !isCorrect(qid)) {
      actionDisabled = 'disabled';
      actionLabel = `Answer Q${n - 1} first`;
    }
  }

  // Key symbol if in kudra mode
  const keyBadge = isKudraUnlocked() && info.key_id
    ? `<div style="font-size:22px;margin-bottom:6px;color:${KEY_DEFS[info.key_id]?.color||'#aaa'}">
        ${KEY_DEFS[info.key_id]?.sym||''} <span style="font-family:Cinzel,serif;font-size:10px;
        letter-spacing:0.2em;vertical-align:middle;">${KEY_DEFS[info.key_id]?.name||''}</span>
       </div>` : '';

  panel.innerHTML = `
    <div class="info-head">
      <div class="info-title">${titleText}</div>
      <div class="info-coord">(${x >= 0 ? '+' : ''}${x}, ${y >= 0 ? '+' : ''}${y})</div>
    </div>
    ${keyBadge}
    ${info.era ? `<div class="info-era">${info.era}</div>` : ''}
    ${tags.length ? `<div class="info-tags">${tags.map(t => `<span class="info-tag">${t}</span>`).join('')}</div>` : ''}
    ${lore ? `<div class="info-lore">${lore}</div>` : ''}
    <div class="info-actions">
      <button class="info-travel" id="mvTravelBtn" ${actionDisabled}>${actionLabel}</button>
      <button class="info-dismiss" id="mvDismissBtn">Dismiss</button>
    </div>`;
  panel.classList.add('show');

  // Wire buttons with event listeners (not onclick — avoids scope issues)
  const tb = panel.querySelector('#mvTravelBtn');
  if (tb && !actionDisabled) tb.addEventListener('click', () => travelFromMV(x, y));
  const db = panel.querySelector('#mvDismissBtn');
  if (db) db.addEventListener('click', () => { mvSelected=null; hideInfoPanel(); });
}

function hideInfoPanel() {
  const panel = document.getElementById('mvInfo');
  if (panel) panel.classList.remove('show');
}

function travelFromMV(x, y) {
  const info = getTile(x, y);
  if (info.type === 'marduk_view' && !isMVUnlocked()) return;
  if (info.type === 'quiz') {
    const n = parseInt(info.question_id.slice(1));
    if (n > 1 && !isCorrect('Q' + (n - 1)) && !isCorrect(info.question_id)) return;
  }
  document.getElementById('mv-stage').classList.remove('show');
  hideInfoPanel();
  mvSelected = null;
  if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
  goTo(x, y);
}
