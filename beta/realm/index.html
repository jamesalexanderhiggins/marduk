/* ── Keyboard nav ─────────────────────────────── */
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
  const mvOpen = document.getElementById('mv-stage').classList.contains('show');

  // MV open: arrow keys move selected tile, Enter travels, Esc closes
  if (mvOpen) {
    if (ev.key === 'Escape') {
      document.getElementById('mv-stage').classList.remove('show');
      const _kb3 = document.getElementById('keyBar');
      if (_kb3) _kb3.style.visibility = 'visible';
      if (mvRaf) { cancelAnimationFrame(mvRaf); mvRaf = null; }
      goTo(0, 0);
      return;
    }
    const mvArrowMap = {ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    if (mvArrowMap[ev.key] && mvSelected) {
      ev.preventDefault();
      const [dx,dy] = mvArrowMap[ev.key];
      const nx2 = mvSelected.x + dx, ny2 = mvSelected.y + dy;
      if (inBounds(nx2, ny2)) {
        mvSelected = {x: nx2, y: ny2};
        showInfoPanel({x: nx2, y: ny2, info: getTile(nx2, ny2)});
        // Pan canvas so selected tile is visible
        const W = mvWrapEl ? mvWrapEl.clientWidth : window.innerWidth;
        const H = mvWrapEl ? mvWrapEl.clientHeight : window.innerHeight;
        const m2 = {r: MV_R*mvZoom, hexW: Math.sqrt(3)*MV_R*mvZoom, hexH: 2*MV_R*mvZoom*0.75};
        const stagger2 = (ny2 % 2 === 0 ? 0 : m2.hexW/2);
        const targetPx = nx2 * m2.hexW + stagger2;
        const targetPy = -ny2 * m2.hexH;
        mvOffset.x = W/2 - targetPx - W/2;
        mvOffset.y = H/2 + targetPy - H/2;
      }
      return;
    }
    if ((ev.key === 'Enter' || ev.key === ' ') && mvSelected) {
      ev.preventDefault();
      travelFromMV(mvSelected.x, mvSelected.y);
      return;
    }
    return; // don't process other keys when MV is open
  }

  // If Marduk View open, close on Esc (fallback)
  if (ev.key === 'Escape') {
    const mv = document.getElementById('mv-stage');
    if (mv.classList.contains('show')) {
      mv.classList.remove('show');
      goTo(0, 0);
      return;
    }
  }
  const cur = decodeXY((window.location.hash || '').replace('#', ''));
  if (!cur) return;
  const doors = getDoors(cur.x, cur.y);
  const map = {
    'ArrowUp': 'up', 'w': 'up', 'W': 'up',
    'ArrowDown': 'down', 's': 'down', 'S': 'down',
    'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
    'ArrowRight': 'right', 'd': 'right', 'D': 'right',
  };
  const dir = map[ev.key];
  if (!dir) return;
  const door = doors[dir];
  if (!door || door.sealed) return;
  const dx = {up:0, down:0, left:-1, right:1}[dir];
  const dy = {up:1, down:-1, left:0, right:0}[dir];
  goTo(cur.x + dx, cur.y + dy);
});

/* ── Key system ───────────────────────────────────── */
const KEY_DEFS = {
  A: {sym:'♦', color:'#C9A84C', name:'The Gold Key'},
  B: {sym:'◆', color:'#4A7C59', name:'The Moss Key'},
  C: {sym:'✦', color:'#7B5EA7', name:'The Violet Key'},
  D: {sym:'❆', color:'#5B9AB8', name:'The Ice Key'},
  E: {sym:'✸', color:'#A83232', name:'The Crimson Key'},
  F: {sym:'⬡', color:'#A86A32', name:'The Copper Key'},
  G: {sym:'◈', color:'#2D8888', name:'The Teal Key'},
  H: {sym:'★', color:'#5C2D82', name:'The Purple Key'},
  I: {sym:'◇', color:'#AAAAAA', name:'The Silver Key'},
  J: {sym:'⊕', color:'#CC5500', name:'The Ember Key'},
};
const KEY_ORDER = ['A','B','C','D','E','F','G','H','I','J'];

function collectKey(kid) {
  if (!KEY_DEFS[kid]) return false;
  const p = getP();
  p.keys_collected = p.keys_collected || {};
  if (p.keys_collected[kid]) return false; // already have it
  p.keys_collected[kid] = true;
  saveP(p);
  return true; // newly collected
}
function hasKey(kid) {
  return !!(getP().keys_collected || {})[kid];
}
function hasAllKeys(needed) {
  const collected = getP().keys_collected || {};
  return (needed || []).every(k => collected[k]);
}
function collectedCount() {
  return Object.keys(getP().keys_collected || {}).length;
}

function updateKeyBar() {
  const bar = document.getElementById('keyBar');
  if (!bar) return;
  bar.innerHTML = KEY_ORDER.map(kid => {
    const kd = KEY_DEFS[kid];
    const have = hasKey(kid);
    return `<span class="key-sym${have ? ' collected' : ''}"
              title="${kd.name}"
              style="color:${have ? kd.color : '#555'};">${kd.sym}</span>`;
  }).join('');
}

function flashKeyCollect(kid) {
  const kd = KEY_DEFS[kid];
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:800;font-family:'Cinzel Decorative',serif;font-size:clamp(24px,5vw,48px);
    color:${kd.color};text-shadow:0 0 40px ${kd.color};
    text-align:center;pointer-events:none;
    animation:hsFadeIn 0.4s ease both;`;
  el.innerHTML = `${kd.sym}<br><span style="font-size:0.45em;letter-spacing:0.25em;
    font-family:'Cinzel',serif;display:block;margin-top:8px;">${kd.name}</span>`;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 0.8s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 800);
  }, 1600);
}

    let tc = 0;
    el.addEventListener('touchend', ev => {
      if (el.dataset.type !== 'exit') return;
      ev.preventDefault();
      tc++;
      if (tc >= 2) { tc = 0; goTo(parseInt(el.dataset.tx), parseInt(el.dataset.ty)); }
      else setTimeout(() => { tc = 0; }, 2000);
    }, {passive:false});
  });

  // Dust particles
  const pEl = document.getElementById('hsParticles');
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    const amber = i < 16;
    const sz  = 1.4 + Math.random() * 2.4;
    const lft = amber ? (2 + Math.random() * 38) : (56 + Math.random() * 38);
    const bot = 5 + Math.random() * 55;
    const dur = 5 + Math.random() * 7;
    const del = Math.random() * 9;
    const dx  = (Math.random() - 0.5) * 36;
    const dy  = -(90 + Math.random() * 110);
    const op  = 0.45 + Math.random() * 0.5;
    p.style.cssText = `position:absolute;bottom:${bot}%;left:${lft}%;`
      + `width:${sz}px;height:${sz}px;border-radius:50%;`
      + `background:${amber?`rgba(215,135,30,${op})`:`rgba(108,172,218,${op})`};`
      + `pointer-events:none;--dp:${op};--dx:${dx}px;--dy:${dy}px;`
      + `animation:hsDust ${dur}s ${del}s linear infinite;`;
    pEl.appendChild(p);
  }

  // Parallax
  let tX=0, tY=0, cX=0, cY=0;
  const EASE=0.06, PX=70, PY=45;
  const layerEls = [
    {el:document.getElementById('hsL0'), f:scene.layers[0].parallax},
    {el:document.getElementById('hsL1'), f:scene.layers[1].parallax},
    {el:document.getElementById('hsL2'), f:scene.layers[2].parallax},
  ];
  function parallaxLoop() {
    hsParallaxRaf = requestAnimationFrame(parallaxLoop);
    cX += (tX-cX)*EASE; cY += (tY-cY)*EASE;
    layerEls.forEach(({el,f}) => {
      el.style.transform = `translate(calc(-15% + ${cX*f*PX}px), calc(-15% + ${cY*f*PY}px))`;
    });
  }
  parallaxLoop();

  const onMouse = ev => {
    tX = (ev.clientX/window.innerWidth  - 0.5)*2;
    tY = (ev.clientY/window.innerHeight - 0.5)*2;
  };
  document.addEventListener('mousemove', onMouse);

  let onGyro = null;
  function attachGyro() {
    onGyro = ev => {
      tX = Math.max(-1, Math.min(1,  (ev.gamma||0)/22));
      tY = Math.max(-1, Math.min(1, -(ev.beta ||0)/35));
    };
    window.addEventListener('deviceorientation', onGyro);
  }
  if (typeof DeviceOrientationEvent !== 'undefined') {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const reqBtn = document.createElement('button');
      reqBtn.style.cssText = 'position:fixed;bottom:80px;right:22px;z-index:200;'
        +'font-family:Cinzel,serif;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;'
        +'color:rgba(201,168,76,0.7);background:rgba(0,0,0,0.65);'
        +'border:1px solid rgba(201,168,76,0.25);padding:8px 14px;cursor:pointer;';
      reqBtn.textContent = 'Enable Motion';
      document.body.appendChild(reqBtn);
      reqBtn.addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission().then(st => {
          if (st==='granted') attachGyro();
        });
        reqBtn.remove();
      });
    } else {
      attachGyro();
    }
  }

  // Whisper proximity brightening on desktop
  const whisperEls = (scene.whispers||[]).map((_,i) => document.getElementById(`hsW${i}`));
  const onMouseW = ev => {
    const nx = ev.clientX/window.innerWidth;
    const ny = ev.clientY/window.innerHeight;
    whisperEls.forEach(w => {
      if (!w) return;
      const r   = w.getBoundingClientRect();
      const wCx = (r.left+r.right) /2/window.innerWidth;
      const wCy = (r.top +r.bottom)/2/window.innerHeight;
      const d   = Math.hypot(nx-wCx, ny-wCy);
      const a   = Math.max(0, Math.min(0.65, 0.65 - d*2.0));
      w.style.color = `rgba(201,168,76,${a})`;
    });
  };
  document.addEventListener('mousemove', onMouseW);

  // Staggered fade-in
  layerEls.forEach(({el},i) => {
    el.style.transition = `opacity 0.8s ${0.1 + i*0.28}s ease`;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity='1'; }));
  });

  s._hsCleanup = () => {
    if (hsParallaxRaf) { cancelAnimationFrame(hsParallaxRaf); hsParallaxRaf=null; }
    document.removeEventListener('mousemove', onMouse);
    document.removeEventListener('mousemove', onMouseW);
    if (onGyro) window.removeEventListener('deviceorientation', onGyro);
    document.querySelectorAll('button[style*="Enable Motion"]').forEach(b=>b.remove());
    initStars({count:200, color:'220,215,200', speed:0.015});
  };
}


/* ── Boot ──────────────────────────────────────── */
async function boot() {
  const res = await fetch('realm.json');
  REALM = await res.json();
  updateMapBtn(); // show MAP button if kudra already unlocked from a prior session
  window.addEventListener('resize', () => {
    const bg = document.getElementById('bg');
    const fx = document.getElementById('fx');
    bg.width = fx.width = window.innerWidth;
    bg.height = fx.height = window.innerHeight;
    resizeStars(); initStarData();
  });
  // Read hash, else check for gateway querystring
  let start = {x: 0, y: 0};
  const h = (window.location.hash || '').replace('#', '');
  if (h) {
    if (h === 'gate=left')  start = {x: -1, y: 0};
    else if (h === 'gate=right') start = {x: 1, y: 0};
    else if (h === 'gate=down')  start = {x: 0, y: -1};
    else if (h === 'threshold')  start = {x: 0, y: 5};
    else if (h === 'marduk_view') { unlockMV(); start = {x: 0, y: 1}; }
    else {
      const dec = decodeXY(h);
      if (dec) start = dec;
    }
  }
  render(start.x, start.y);
}
boot();
</script>
