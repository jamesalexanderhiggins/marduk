/* ══ GATE SYSTEM ════════════════════════════════ */

function getVisited() {
  const p = getP();
  return new Set(p.visited || ['0,0']);
}


const GATE_URLS = {
  tesseract: 'https://jamesalexanderhiggins.github.io/marduk/beta/realm/tesseract/',
  masklock:  'https://jamesalexanderhiggins.github.io/marduk/beta/realm/masklock/',
  turing:    'https://jamesalexanderhiggins.github.io/marduk/beta/realm/turing-test/',
};
const GATE_LABELS = {
  tesseract: 'Tesseract',
  masklock:  'Mask Lock',
  turing:    'Turing Test',
};
const DIR_DELTA = {N:[0,1],S:[0,-1],E:[1,0],W:[-1,0]};
const DELTA_DIR = {'0,1':'N','0,-1':'S','1,0':'E','-1,0':'W'};

const GATE_SOLVED_KEY = 'mm_gate_solved_v8';
function _loadGateSolved() {
  try { return new Set(JSON.parse(localStorage.getItem(GATE_SOLVED_KEY)||'[]')); }
  catch(e) { return new Set(); }
}
function _saveGateSolved(set) {
  try { localStorage.setItem(GATE_SOLVED_KEY, JSON.stringify([...set])); } catch(e) {}
}
let _gateSolved = _loadGateSolved();


function gateKey(x, y, dir) { return `${x},${y}:${dir}`; }
function getGate(x, y, dir) {
  if (!REALM || !REALM.gates) return null;
  const ovKey = gateKey(x,y,dir);
  const ov = _loadOverrides();
  if (ov._gates && ov._gates[ovKey]) return ov._gates[ovKey];
  return REALM.gates[ovKey] || null;
}
function isGateSolved(x, y, dir) { return _gateSolved.has(gateKey(x,y,dir)); }
function markGateSolved(x, y, dir) {
  _gateSolved.add(gateKey(x,y,dir));
  _saveGateSolved(_gateSolved);
}

function buildGateURL(gate, fromX, fromY, dir) {
  const base = GATE_URLS[gate.type] || GATE_URLS.tesseract;
  const redirectHash = `gate:${fromX},${fromY}:${dir}`;
  const redirectURL  = window.location.href.split('#')[0] + '#' + redirectHash;
  const params = [];
  if (gate.range)  params.push(`range=${gate.range[0]}-${gate.range[1]}`);
  else if (gate.level) params.push(`level=${gate.level}`);
  // Turing gates: specific target between -1000 and 1000, scaling with difficulty
  if (gate.type === 'turing') {
    if (typeof gate.target === 'number') {
      params.push(`target=${gate.target}`);
    } else {
      // Fallback: derive target from level/range magnitude
      const lvl = gate.level || (gate.range ? (gate.range[0]+gate.range[1])/2 : 10);
      const mag = Math.min(1000, Math.round(lvl * 10));
      const sign = (fromX % 2 === 0) ? 1 : -1;
      params.push(`target=${sign * mag}`);
    }
  }
  params.push('redirect=' + encodeURIComponent(redirectURL));
  return base + '?' + params.join('&');
}

// Full-screen gate overlay
let _gateOverlay = null;
let _pendingGate = null;  // {x,y,dir,nx,ny}

function openGateOverlay(fromX, fromY, dir) {
  const gate = getGate(fromX, fromY, dir);
  if (!gate) return;
  const [dx,dy] = DIR_DELTA[dir]||[0,0];
  const toX = fromX+dx, toY = fromY+dy;
  _pendingGate = {x:fromX, y:fromY, dir, nx:toX, ny:toY};

  const url  = buildGateURL(gate, fromX, fromY, dir);
  const label = GATE_LABELS[gate.type] || 'Challenge';
  const lv   = gate.range ? `Levels ${gate.range[0]}–${gate.range[1]}`
             : gate.level  ? `Level ${gate.level}` : '';

  // Update static overlay elements in place (don't use innerHTML — loses iframe)
  const ov = document.getElementById('gateOverlay');
  if (!ov) return;
  const _lbl = document.getElementById('gateLabel');
  const _ttl = document.getElementById('gateTitle');
  const _dsc = document.getElementById('gateDesc');
  const _fr  = document.getElementById('gateFrame');
  if (_lbl) _lbl.textContent = label.toUpperCase() + (lv ? ' · ' + lv : '');
  if (_ttl) _ttl.textContent = gate.title || 'Challenge';
  if (_dsc) { _dsc.textContent = gate.desc || ''; _dsc.style.display = gate.desc ? '' : 'none'; }
  if (_fr)  _fr.src = url || 'about:blank';
  ov.style.display = 'flex';
  // Play gate music cue
  if (gate.music) MusicEngine.playByKey(gate.music);

  // Listen for completion — multiple mechanisms
  if (_fr) _fr.addEventListener('load', _onGateFrameLoad);
  _startGatePoll();
}

function closeGateOverlay() {
  const ov = document.getElementById('gateOverlay');
  if (ov) ov.style.display = 'none';
  const fr = document.getElementById('gateFrame');
  if (fr) { fr.removeEventListener('load', _onGateFrameLoad); fr.src='about:blank'; }
  _stopGatePoll();
  _pendingGate = null;
  // Refresh nav arrows + MV gate lines
  const cur = window.location.hash.replace('#','');
  const dec = cur ? decodeXY(cur) : null;
  if (dec) setTimeout(()=>renderNavArrows(dec.x, dec.y), 100);
  if (typeof mvDrawFn === 'function') setTimeout(mvDrawFn, 150);
}

function _onGateFrameLoad() {
  if (!_pendingGate) return;
  try {
    const href = this.contentWindow.location.href;
    if (href && href.includes('#gate:')) {
      const hash = href.split('#gate:')[1];
      _resolveGateFromHash(hash);
    }
  } catch(e) { /* cross-origin — normal until redirect fires */ }
}

// Handle gate completion redirect on boot
function _handleGateHash(h) {
  if (!h.startsWith('gate:')) return false;
  const rest  = h.slice(5);
  const parts = rest.split(':');
  if (parts.length !== 2) return false;
  const [cx,cy] = parts[0].split(',').map(Number);
  const cdir   = parts[1];
  markGateSolved(cx, cy, cdir);
  const [dx,dy] = DIR_DELTA[cdir]||[0,0];
  return {x: cx+dx, y: cy+dy};
}


// v9.5: Multi-mechanism gate completion detection
// Mechanism 1: postMessage from game iframe
window.addEventListener('message', function(ev) {
  if (!_pendingGate) return;
  let data = ev.data;
  if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e){} }
  // Games may send: {type:'complete'} or {solved:true} or {redirect:url}
  const isComplete = (
    (data && (data.type === 'complete' || data.solved === true || data.done === true)) ||
    (typeof ev.data === 'string' && (ev.data.includes('complete') || ev.data.includes('solved')))
  );
  if (isComplete) {
    _resolveGate(_pendingGate);
  }
  // Also handle redirect message
  if (data && data.redirect && typeof data.redirect === 'string') {
    if (data.redirect.includes('#gate:')) {
      const hash = data.redirect.split('#gate:')[1];
      _resolveGateFromHash(hash);
    }
  }
});

// Mechanism 2: Poll iframe URL every 400ms
let _gatePollInterval = null;
function _startGatePoll() {
  _stopGatePoll();
  _gatePollInterval = setInterval(function() {
    if (!_pendingGate) { _stopGatePoll(); return; }
    const fr = document.getElementById('gateFrame');
    if (!fr) return;
    try {
      const href = fr.contentWindow.location.href;
      if (href && href.includes('#gate:')) {
        _stopGatePoll();
        const hash = href.split('#gate:')[1];
        _resolveGateFromHash(hash);
      }
    } catch(e) { /* cross-origin — normal */ }
  }, 400);
}
function _stopGatePoll() {
  if (_gatePollInterval) { clearInterval(_gatePollInterval); _gatePollInterval = null; }
}

// Mechanism 3: hashchange (triggered when game does top-level navigation)
window.addEventListener('hashchange', function() {
  const h = window.location.hash.replace('#','');
  if (h.startsWith('gate:') && _pendingGate) {
    _resolveGateFromHash(h.slice(5));
    // Clean hash
    history.replaceState(null, '', window.location.pathname);
  }
});

function _resolveGateFromHash(hash) {
  if (!_pendingGate) return;
  const parts = hash.split(':');
  if (parts.length < 2) return;
  const [cx,cy] = parts[0].split(',').map(Number);
  const cdir    = parts[1];
  if (cx===_pendingGate.x && cy===_pendingGate.y && cdir===_pendingGate.dir) {
    _resolveGate(_pendingGate);
  }
}

function _resolveGate(pg) {
  if (!pg) return;
  _stopGatePoll();
  markGateSolved(pg.x, pg.y, pg.dir);
  const gate = getGate(pg.x, pg.y, pg.dir);
  const onComplete = gate?.on_complete_music;
  const keyReward  = gate?.key_reward;
  closeGateOverlay();
  goTo(pg.nx, pg.ny);
  if (onComplete) setTimeout(()=>MusicEngine.playByKey(onComplete), 400);
  // Key reward triumph
  if (keyReward) {
    setTimeout(()=>_showKeyTriumph(keyReward), 800);
  }
  // Re-render from-tile nav arrows to show green solved state
  const _fromKey = pg.x + ',' + pg.y;
  setTimeout(() => {
    // If still on from-tile, refresh arrows
    const _h = window.location.hash.replace('#','');
    const _d = _h ? decodeXY(_h) : null;
    if (_d && _d.x === pg.x && _d.y === pg.y) renderNavArrows(pg.x, pg.y);
    // Always refresh MV gate lines
    if (typeof mvDrawFn === 'function') mvDrawFn();
  }, 200);
}

function _showKeyTriumph(keyId) {
  const KEY_NAMES = {
    D:'Key of Ice',C:'Key of Violet',B:'Key of Moss',E:'Key of Crimson',
    G:'Key of Teal',A:'Key of Gold',H:'Key of Shadow',I:'Key of Silver',J:'Key of Ember'
  };
  const name = KEY_NAMES[keyId] || `Key ${keyId}`;
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:500;text-align:center;pointer-events:none;
    animation:keyTriumph 3.5s ease forwards;`;
  el.innerHTML = `<div style="font-family:'Cinzel Decorative',serif;font-size:clamp(18px,3vw,28px);
    color:#D4AF37;text-shadow:0 0 30px rgba(212,175,55,0.9);margin-bottom:8px;">
    ✦ YOU ACHIEVED ✦</div>
    <div style="font-family:'Cinzel',serif;font-size:clamp(20px,3.5vw,32px);
    color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.6);">${name}</div>`;
  const style = document.createElement('style');
  style.textContent = '@keyframes keyTriumph{'
    +'0%{opacity:0;transform:translate(-50%,-50%) scale(0.7)}'
    +'15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}'
    +'70%{opacity:1;transform:translate(-50%,-50%) scale(1)}'
    +'100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}';
  document.head.appendChild(style);
  document.body.appendChild(el);
  setTimeout(()=>{el.remove();style.remove();}, 3600);
  MusicEngine.playByKey('triumph');
}

/* ══ Gate visualization on MV map ══════════════════
 * Draws colored lines between tiles that have gates.
 * Shown in K/SKM mode always; in normal mode only for visited tiles.
 * Solid = locked, dashed = solved.
 * Colors: tesseract=#c084fc, masklock=#D4AF37, turing=#4adede
 * ══════════════════════════════════════════════════*/
const GATE_LINE_COLORS = {
  tesseract: '#c084fc',
  masklock:  '#D4AF37',
  turing:    '#4adede',
  face3d:    '#D4AF37',
};

function _renderGateCTA(x, y) {
  if (!REALM || !REALM.gates) return '';
  let ctas = '';
  for (const dir of ['N','S','E','W']) {
    const gate = getGate(x, y, dir);
    if (!gate || isGateSolved(x, y, dir)) continue;
    const label = (GATE_LABELS && GATE_LABELS[gate.type]) || gate.type || 'Challenge';
    const lv = gate.range ? 'Levels ' + gate.range[0] + '\u2013' + gate.range[1]
              : gate.level ? 'Level ' + gate.level : '';
    const dirArrow = {N:'\u2191',S:'\u2193',E:'\u2192',W:'\u2190'}[dir] || '';
    ctas += '<div style="margin-top:20px;padding:16px 20px;text-align:center;' +
      'background:rgba(0,0,0,0.4);border:1px solid rgba(192,132,252,0.25);">' +
      '<div style="font-family:Cinzel,serif;font-size:8px;letter-spacing:0.4em;' +
      'color:rgba(192,132,252,0.55);margin-bottom:8px;">' +
      '\u229b ' + label.toUpperCase() + ' \u00b7 ' + lv + '</div>' +
      (gate.title ? '<div style="font-family:Cinzel Decorative,serif;' +
      'font-size:clamp(14px,2vw,20px);color:#c084fc;' +
      'text-shadow:0 0 16px rgba(192,132,252,0.5);margin-bottom:10px;">' +
      gate.title + '</div>' : '') +
      (gate.desc ? '<div style="font-family:EB Garamond,serif;font-style:italic;' +
      'font-size:14px;color:rgba(228,210,200,0.55);margin-bottom:12px;line-height:1.6;">' +
      gate.desc + '</div>' : '') +
      '<button onclick="openGateOverlay(' + x + ',' + y + ',\'' + dir + '\')"' +
      ' style="font-family:Cinzel,serif;font-size:10px;letter-spacing:0.3em;' +
      'color:#1a0a2e;background:#c084fc;border:none;padding:12px 28px;cursor:pointer;' +
      'box-shadow:0 0 20px rgba(192,132,252,0.4);">' +
      dirArrow + ' TAKE THE TEST ' + dirArrow + '</button>' +
      '</div>';
  }
  return ctas;
}


function drawGateLines(ctx, now, m) {
  if (!REALM || !REALM.gates) return;
  const r = MV_R * mvZoom;
  const DIR_TO_OFFSET = {
    N: [0,  1], S: [0, -1], E: [1,  0], W: [-1, 0]
  };

  for (const [gk, gate] of Object.entries(REALM.gates)) {
    // Parse "x,y:DIR"
    const colonIdx = gk.lastIndexOf(':');
    if (colonIdx < 0) continue;
    const coordStr = gk.slice(0, colonIdx);
    const dir      = gk.slice(colonIdx+1);
    const [fx, fy] = coordStr.split(',').map(Number);
    const [dx, dy] = DIR_TO_OFFSET[dir] || [0,0];
    const tx = fx+dx, ty = fy+dy;

    const fromVisited = getVisited().has(`${fx},${fy}`);
    const showGate = isKudraUnlocked() || fromVisited;
    if (!showGate) continue;

    const [fpx, fpy] = gridToScreen(fx, fy, m);
    const [tpx, tpy] = gridToScreen(tx, ty, m);

    const col   = GATE_LINE_COLORS[gate.type] || '#888';
    const solved = isGateSolved(fx, fy, dir);
    const pulse  = 0.6 + 0.4 * Math.sin(now * 0.004 + fx * 0.3 + fy * 0.5);
    const alpha  = solved ? 0.35 : pulse * 0.75;

    ctx.save();
    ctx.strokeStyle = col;
    ctx.globalAlpha = alpha;
    ctx.lineWidth   = Math.max(1.5, r * 0.08);

    if (solved) {
      // Dashed = solved/open
      ctx.setLineDash([r*0.15, r*0.1]);
    } else {
      ctx.setLineDash([]);
      ctx.shadowColor = col;
      ctx.shadowBlur  = 6;
    }

    // Draw midpoint line (from centre of from-tile to centre of to-tile)
    ctx.beginPath();
    ctx.moveTo(fpx, fpy);
    ctx.lineTo(tpx, tpy);
    ctx.stroke();

    // Small ⊛ label at midpoint when locked
    if (!solved && r > 12) {
      const mx = (fpx+tpx)/2, my = (fpy+tpy)/2;
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = alpha;
      ctx.font = `${Math.max(8, r*0.28)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = col;
      ctx.fillText('⊛', mx, my);
    }
    ctx.restore();
  }
}

function skm_setType(type) {

function skm_save(x, y) {
  const k = `${x},${y}`;
  // Determine active type
  let activeType = 'text';
  ['text','game','iframe','video','image'].forEach(t => {
    const p = document.getElementById('skmP_'+t);
    if (p && p.style.display !== 'none') activeType = t;
  });

  const nameGlobal = document.getElementById('skm_name_global')?.value?.trim() || '';
  let patch = {};
  if (nameGlobal) patch.name = nameGlobal;
  const tileMusic = document.getElementById('skm_tile_music')?.value;
  if (tileMusic) patch.music = tileMusic; else delete patch.music;

  if (activeType === 'text') {
    const nm = document.getElementById('skm_name')?.value?.trim();
    if (nm) patch.name = nm;
    const loreEl = document.getElementById('skm_lore');
    if (loreEl) {
      // Save as plain text (strip basic HTML) for tile rendering compatibility
      const tmp = document.createElement('div');
      tmp.innerHTML = loreEl.innerHTML;
      patch.lore = tmp.textContent || tmp.innerText || loreEl.innerHTML;
    }
    delete patch.puzzle;
  } else if (activeType === 'game') {
    const gameType = document.getElementById('skm_game')?.value || 'tesseract';
    const lvA = parseInt(document.getElementById('skm_pzl_range_a')?.value) || null;
    const lvB = parseInt(document.getElementById('skm_pzl_range_b')?.value) || null;
    const lv  = parseInt(document.getElementById('skm_pzl_level')?.value) || 1;
    patch.puzzle = {
      type:   gameType,
      title:  document.getElementById('skm_pzl_title')?.value || '',
      desc:   document.getElementById('skm_pzl_desc')?.value  || '',
      music:  document.getElementById('skm_pzl_music')?.value || 'puzzle_tension',
      on_complete_music: document.getElementById('skm_pzl_complete_music')?.value || null,
      lock_entry: document.getElementById('skm_lock_entry')?.checked || false,
      lock_exit:  document.getElementById('skm_lock_exit')?.checked  || false,
    };
    if (lvA && lvB) patch.puzzle.range = [lvA, lvB];
    else patch.puzzle.level = lv;
  } else if (activeType === 'iframe') {
    patch.embed_url   = document.getElementById('skm_embed_url')?.value || '';
    patch.embed_title = document.getElementById('skm_embed_title')?.value || '';
  } else if (activeType === 'video') {
    patch.video_url = document.getElementById('skm_video_url')?.value || '';
  } else if (activeType === 'image') {
    patch.image_url     = document.getElementById('skm_image_url')?.value || '';
    patch.image_caption = document.getElementById('skm_image_caption')?.value || '';
  }

  // Apply to live REALM
  if (!REALM.tiles[k]) REALM.tiles[k] = {};
  Object.assign(REALM.tiles[k], patch);

  // Persist to localStorage overrides
  const ov = _loadOverrides();
  ov[k] = Object.assign(ov[k] || {}, patch);
  _saveOverrides(ov);

  // Feedback
  const btn = document.querySelector('[onclick*="skm_save"]');
  if (btn) { const orig=btn.textContent; btn.textContent='✓ SAVED'; setTimeout(()=>btn.textContent=orig,1500); }

  // Re-render tile if currently viewing it
  const cur = decodeXY((window.location.hash||'').replace('#',''));
  if (cur && cur.x===x && cur.y===y) render(x, y);
}

function skm_saveGate(x, y, dir) {
  const typeEl  = document.getElementById(`skm_gate_${dir}_type`);
  const levelEl = document.getElementById(`skm_gate_${dir}_level`);
  const titleEl = document.getElementById(`skm_gate_${dir}_title`);
  const gtype = typeEl?.value;
  if (!gtype) { skm_clearGate(x,y,dir); return; }
  const gate = {
    type: gtype,
    title: titleEl?.value?.trim() || '',
  };
  const lv = parseInt(levelEl?.value);
  if (lv) gate.level = lv;
  // Save to REALM in memory
  if (!REALM.gates) REALM.gates = {};
  REALM.gates[gateKey(x,y,dir)] = gate;
  // Persist override
  const ov = _loadOverrides();
  if (!ov._gates) ov._gates = {};
  ov._gates[gateKey(x,y,dir)] = gate;
  _saveOverrides(ov);
  // Refresh arrows
  renderNavArrows(x,y);
  skmOpenEditor(x,y);
}

function skm_clearGate(x, y, dir) {
  const k = gateKey(x,y,dir);
  if (REALM.gates) delete REALM.gates[k];
  const ov = _loadOverrides();
  if (ov._gates) delete ov._gates[k];
  _saveOverrides(ov);
  renderNavArrows(x,y);
  skmOpenEditor(x,y);
}

function skm_export() {
  const ov = _loadOverrides();
  const json = JSON.stringify(ov, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tile-overrides-v8.json';
  a.click();
}

 *  Gates are directional edge locks stored in REALM.gates
 *  Key format: "x,y:DIR" where DIR ∈ {N,S,E,W}
 *  A gate fires when moving FROM (x,y) in direction DIR.
 *  The return direction is always free.
 *  Solved gates stored in localStorage.
 * ═════════════════════════════════════════════════*/



document.addEventListener('DOMContentLoaded', () => {

/* ── Boot ──────────────────────────────────────── */
async function boot() {
  const res = await fetch('realm.json');
  REALM = await res.json();
  applyTileOverrides(); // merge localStorage SKM overrides
  updateMapBtn(); // show MAP button if kudra already unlocked from a prior session
  updateKeyBar(); // render key symbols from saved state
  // Restore kudra visual state across page reloads
  if (isKudraUnlocked()) {
    document.body.classList.add('kudra-active');
    const _ekb = document.getElementById('exitKBtn');
    if (_ekb) { _ekb.classList.add('show'); _ekb.style.removeProperty('display'); }
  }
  window.addEventListener('resize', () => {
    const bg = document.getElementById('bg');
    const fx = document.getElementById('fx');
    bg.width = fx.width = window.innerWidth;
    bg.height = fx.height = window.innerHeight;
    resizeStars(); initStarData();
  });
  // Read hash, else check for gateway querystring
  let start = {x: 0, y: 0};
  const h = (window.location.hash || '').replace('#', '');
  if (h) {
    if (h.startsWith('gate:')) {
      const _gr = _handleGateHash(h);
      if (_gr) { start = _gr; history.replaceState(null,'',window.location.pathname); }
    } else
    if (h.startsWith('pzl:')) {
      const dec = decodeXY(h.replace('pzl:',''));
      if (dec) {
        markPuzzleSolved(dec.x, dec.y);
        const _bt = REALM ? getTile(dec.x, dec.y) : null;
        if (_bt && _bt.type === 'house_front_door') {
          const _fi = _findFirstInterior(dec.x, dec.y, _bt.house_id);
          start = _fi ? {x:_fi[0],y:_fi[1]} : dec;
        } else start = dec;
      }
    }
    else if (h === 'gate=left')  start = {x: -1, y: 0};
    else if (h === 'gate=right') start = {x: 1, y: 0};
    else if (h === 'gate=down')  start = {x: 0, y: -1};
    else if (h === 'threshold')  start = {x: 0, y: 5};
    else if (h === 'marduk_view') { unlockMV(); start = {x: 0, y: 1}; }
    else {
      const dec = decodeXY(h);
      if (dec) start = dec;
    }
  }
  render(start.x, start.y);
  MusicEngine.initBtn();
}
boot();
