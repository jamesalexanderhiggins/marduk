<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VECTOR MASK LOCK // MARDUKVERSE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="crt"></div>

<header id="hdr">
  <div class="sys-line">MARDUKVERSE &gt;&gt; REALM ACCESS PROTOCOL &gt;&gt; v3.14.159</div>
  <div id="game-title"><span class="br">[</span>VECTOR&nbsp;MASK&nbsp;LOCK<span class="br">]</span></div>
  <div class="sys-line blink-warn">FACIAL RECONSTRUCTION REQUIRED &#8212; ACCESS DENIED</div>
</header>

<div id="level-hud">
  <div class="hud-l">
    <span class="htag">LVL</span>
    <span id="h-level">01</span>
    <span class="hdim">/<span id="h-max">100</span></span>
  </div>
  <div id="prog-track"><div id="prog-fill"></div></div>
  <div class="hud-r">
    <span class="htag">NODES</span><span id="h-nodes" class="hval">--</span>
    <span class="hsep">|</span>
    <span class="htag">OPEN</span><span id="h-open" class="hval hwarn">--</span>
  </div>
</div>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="cx tl"></div><div class="cx tr"></div>
  <div class="cx bl"></div><div class="cx br"></div>
</div>

<div id="ctrl-bar">
  <div id="nav-btns">
    <button class="cb" id="prev-btn">&#9664; PREV</button>
    <button class="cb" id="next-btn">NEXT &#9654;</button>
  </div>
  <div id="rot-btns">
    <span class="htag">ROT</span>
    <button class="cb sm" id="rleft">&#9664;</button>
    <button class="cb sm" id="rreset">&#9711;</button>
    <button class="cb sm" id="rright">&#9654;</button>
    <button class="cb sm on" id="rauto">&#8635;</button>
    <span class="hint-txt">&#8592;&#8594; keys</span>
  </div>
</div>

<div id="status-row">
  <span id="s-msg">DRAG DISPLACED NODES TO THEIR LOCK POSITIONS</span>
  <span id="s-cnt"></span>
</div>
<div id="unlock-line">&nbsp;</div>

<div id="overlay">
  <div id="ol-panel">
    <div class="olc tl"></div><div class="olc tr"></div>
    <div class="olc bl"></div><div class="olc br"></div>
    <div id="ol-tag">&#47;&#47; ACCESS GRANTED &#47;&#47;</div>
    <div id="ol-num">01</div>
    <div id="ol-title">RECONSTRUCTION COMPLETE</div>
    <div id="ol-msg">&nbsp;</div>
    <div id="ol-unlock">&nbsp;</div>
    <div id="ol-nav">
      <button class="olb" id="ol-prev">&#9664; PREV</button>
      <button class="olb" id="ol-next">NEXT &#9654;</button>
    </div>
  </div>
</div>

<div id="solve-bar">
  <button id="solve-btn">&#9889; AUTO-SOLVE</button>
  <span id="solve-tag">&#9646; SOLVE MODE ACTIVE &#9646;</span>
</div>

<script src="game.js"></script>
</body>
</html>
