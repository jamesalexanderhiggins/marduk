<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vector Mask Lock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" aria-label="Vector mask puzzle"></canvas>

    <div id="leftRail" class="rail">
      <button id="soundButton" class="iconButton" aria-label="Enable sound" title="Sound">
        <span class="speaker">
          <span class="speaker-body"></span>
          <span class="speaker-wave wave1"></span>
          <span class="speaker-wave wave2"></span>
        </span>
      </button>
      <input id="sliderX" class="vslider red" type="range" min="-100" max="100" value="0" aria-label="Tilt" />
      <input id="sliderY" class="vslider green" type="range" min="-100" max="100" value="0" aria-label="Swivel" />
      <input id="sliderZ" class="vslider blue" type="range" min="-100" max="100" value="0" aria-label="Roll" />
    </div>

    <div id="rightRail" class="rail rightRail">
      <input id="zoomSlider" class="vslider zoom" type="range" min="50" max="180" value="100" aria-label="Zoom" />
    </div>

    <div id="versionMarker">v17</div>

    <div id="overlay" class="hidden" aria-hidden="true">
      <button id="overlayButton" class="overlayButton" aria-label="Continue"></button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
