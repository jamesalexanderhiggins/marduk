const params = new URLSearchParams(window.location.search);
const target = parseInt(params.get("target")) || null;
const redirect = params.get("redirect");

let score = 0;
let index = 0;
let memory = {};

function updateUI() {
  document.getElementById("score").innerText = "Score: " + score;

  if(score < -100) document.body.style.color = "#00ccff";
  if(score < -300) document.body.style.color = "#8844ff";
  if(score < -700) document.body.classList.add("glitch");
}

function addChat(text) {
  let chat = document.getElementById("chat");
  let div = document.createElement("div");
  div.className = "msg";
  div.innerText = text;
  chat.prepend(div);

  let msgs = chat.children;
  for(let i=0;i<msgs.length;i++) {
    msgs[i].style.opacity = 1 - (i*0.12);
  }
  if(msgs.length > 10) chat.removeChild(msgs[msgs.length-1]);
}

function nextQuestion() {
  if(index >= QUESTIONS.length) index = 0;

  let q = QUESTIONS[index];

  document.getElementById("question").innerText = q.text;

  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.answers.forEach(a=>{
    let btn = document.createElement("button");
    btn.innerText = a.text;
    btn.onclick = ()=>{
      let impact = Math.ceil(index/50)+1;
      let delta = a.value * impact;
      score += delta;

      memory[q.id] = a.text;

      addChat("You: " + a.text);
      addChat("Eli: " + respond(a, q));

      updateUI();

      if(target && ((target > 0 && score >= target) || (target < 0 && score <= target))) {
        if(redirect) window.location = redirect;
      } else {
        index++;
        nextQuestion();
      }
    };
    answersDiv.appendChild(btn);
  });
}

function respond(a, q) {
  if(a.value > 0) return "You hesitate. Good.";
  if(a.value < 0) return "That was... efficient.";
  return "You're avoiding something.";
}

updateUI();
nextQuestion();
