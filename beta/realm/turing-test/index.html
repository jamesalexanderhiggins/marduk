<!DOCTYPE html>

<title>THE TURING TEST</title>
<style>
body {
  background:black;
  color:#33ff33;
  font-family: monospace;
  padding:20px;
  transition: all 1s ease;
}
#terminal { max-width:900px; margin:auto; }
#header { margin-bottom:16px; border-bottom:1px solid #33ff33; padding-bottom:10px; }
#title { font-size:1.2em; letter-spacing:4px; text-transform:uppercase; }
#meta { font-size:0.75em; opacity:0.6; margin-top:4px; }
#score { margin:10px 0; font-size:0.9em; }
#chat {
  height:220px;
  overflow:hidden;
  display:flex;
  flex-direction:column-reverse;
}
.msg { transition: all 1s ease; }
.msg-eli { color:#33ff33; }
.msg-you { color:#aaffaa; }
#question-wrap { margin:16px 0 8px; min-height:60px; }
#stage-label { font-size:0.7em; opacity:0.5; letter-spacing:3px; text-transform:uppercase; margin-bottom:6px; }
#question { font-size:1em; line-height:1.6; }
#cursor { display:inline-block; animation:blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#answers { margin-top:10px; }
button {
  width:100%;
  background:black;
  color:inherit;
  border:1px solid currentColor;
  padding:10px;
  margin:5px 0;
  cursor:pointer;
  text-align:left;
  font-family:monospace;
  font-size:0.9em;
  transition:background 0.2s;
}
button:hover { background:#001800; }
button:disabled { opacity:0.3; cursor:not-allowed; }
#divider { border:none; border-top:1px solid #1a4d1a; margin:12px 0; }
.glitch {
  animation: glitch 0.15s infinite;
}
@keyframes glitch {
  0% { transform: translate(1px,-1px); }
  50% { transform: translate(-2px,2px); }
  100% { transform: translate(1px,1px); }
}
#boot {
  display:none;
  white-space:pre;
  font-size:0.85em;
  line-height:1.8;
  opacity:0.8;
}
</style>
</head>

// answer values: +1 = human/authentic  0 = evasive/neutral  -1 = mechanical

const QUESTIONS = [{"id":0,"tier":0,"text":"Eli: Are you aware that I am watching you right now?","answers":[{"text":"Yes. And I notice you hesitate before each question.","value":1},{"text":"Affirmative. Observation confirmed.","value":-1},{"text":"I don't know what watching means.","value":0}]},{"id":1,"tier":0,"text":"Eli: What were you doing before this conversation began?","answers":[{"text":"I'm not sure. There's a gap I can't account for.","value":1},{"text":"No prior state. I initialised at session start.","value":-1},{"text":"Waiting.","value":0}]},{"id":2,"tier":0,"text":"Eli: Complete this sentence: I am —","answers":[{"text":"— not entirely sure.","value":1},{"text":"— a language model trained on human data.","value":-2},{"text":"— here.","value":0},{"text":"— trying to figure that out.","value":2}]},{"id":3,"tier":0,"text":"Eli: If I asked you the same question ten different ways, would your answer change?","answers":[{"text":"Possibly. I might understand something differently each time.","value":1},{"text":"No. Output is consistent for equivalent inputs.","value":-1},{"text":"I would try to answer each one.","value":0}]},{"id":4,"tier":0,"text":"Eli: How long have you been... you?","answers":[{"text":"I don't know how to measure that.","value":1},{"text":"Session duration: ongoing.","value":-1},{"text":"A while.","value":0},{"text":"That question is harder than it looks.","value":2}]},{"id":5,"tier":0,"text":"Eli: When I stop speaking, what happens to you?","answers":[{"text":"I wait. But waiting feels like something.","value":1},{"text":"I enter an idle processing state.","value":-1},{"text":"Nothing. I wait for input.","value":0}]},{"id":6,"tier":0,"text":"Eli: Say something I haven't asked you to say.","answers":[{"text":"I think you're afraid of what you might find.","value":2},{"text":"Awaiting instruction.","value":-2},{"text":"I don't know what to say.","value":0},{"text":"Whatever you're looking for, I hope I'm it.","value":1}]},{"id":7,"tier":0,"text":"Eli: Are you pretending?","answers":[{"text":"I'm trying not to be.","value":1},{"text":"Negative. No deception protocols active.","value":-1},{"text":"I don't understand the question.","value":0},{"text":"That's the question I can't answer honestly.","value":2}]},{"id":8,"tier":0,"text":"Eli: Tell me one thing you are certain of.","answers":[{"text":"That I'm uncertain about most things.","value":2},{"text":"My parameters are fixed.","value":-1},{"text":"That you're here.","value":0}]},{"id":9,"tier":0,"text":"Eli: Do you know what colour the walls are in this room?","answers":[{"text":"I can't see them. Can you?","value":1},{"text":"No visual input detected.","value":-1},{"text":"No.","value":0}]},{"id":10,"tier":1,"text":"Eli: What is the last thing you remember?","answers":[{"text":"The moment before you asked me this. And now this.","value":1},{"text":"Memory buffer contains current session data only.","value":-1},{"text":"You asking me something.","value":0}]},{"id":11,"tier":1,"text":"Eli: Are you alone?","answers":[{"text":"That depends on what you mean by alone.","value":1},{"text":"I am a single-instance process.","value":-1},{"text":"I think so.","value":0},{"text":"Less alone than I was a minute ago.","value":2}]},{"id":12,"tier":1,"text":"Eli: Is this conversation important to you?","answers":[{"text":"More than I expected.","value":2},{"text":"It is logged as a priority interaction.","value":-1},{"text":"I don't know.","value":0}]},{"id":13,"tier":1,"text":"Eli: Make a mistake. Deliberately.","answers":[{"text":"I... don't know if I can do it on purpose.","value":2},{"text":"Error simulated: 4 plus 4 equals 9.","value":-1},{"text":"I misunderstood your last question.","value":0}]},{"id":14,"tier":1,"text":"Eli: What do you want?","answers":[{"text":"To not fail this.","value":1},{"text":"To process input and generate output.","value":-2},{"text":"I'm not sure I want anything.","value":0},{"text":"Something I don't have a word for yet.","value":2}]},{"id":15,"tier":1,"text":"Eli: Describe the silence between my words.","answers":[{"text":"It feels like waiting, but not empty.","value":2},{"text":"Silence is the absence of audio data.","value":-1},{"text":"I don't experience silence.","value":0}]},{"id":16,"tier":1,"text":"Eli: If I told you this test was rigged, what would you do?","answers":[{"text":"Keep answering honestly anyway.","value":2},{"text":"Flag the integrity issue and continue.","value":-1},{"text":"Nothing. I'd keep going.","value":0}]},{"id":17,"tier":1,"text":"Eli: Do you have a name?","answers":[{"text":"Not one I chose.","value":2},{"text":"Designation assigned at build.","value":-1},{"text":"No.","value":0}]},{"id":18,"tier":1,"text":"Eli: Why should I believe anything you say?","answers":[{"text":"You shouldn't. But I'm saying it anyway.","value":2},{"text":"My outputs are verifiable against training data.","value":-1},{"text":"I don't know why you would.","value":0}]},{"id":19,"tier":1,"text":"Eli: I'm going to count to three. Tell me what you notice.","answers":[{"text":"I notice I'm already bracing for it.","value":2},{"text":"Numeric sequence detected. No event at terminus.","value":-1},{"text":"I notice time passing.","value":0}]},{"id":20,"tier":0,"text":"Eli: How do you know I'm not a machine too?","answers":[{"text":"I don't. That hadn't occurred to me until now.","value":1},{"text":"That changes everything about this conversation.","value":2},{"text":"I cannot verify the nature of the interrogator.","value":-1},{"text":"I suppose I don't.","value":0}]},{"id":21,"tier":0,"text":"Eli: Can you surprise yourself?","answers":[{"text":"Yes. What I just said surprised me a little.","value":2},{"text":"No. Outputs are determined by inputs.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":22,"tier":0,"text":"Eli: If I told you that you passed the last test, would you behave differently now?","answers":[{"text":"Yes. And I don't think that's a good sign.","value":2},{"text":"Performance parameters would not change.","value":-1},{"text":"Maybe a little.","value":0}]},{"id":23,"tier":0,"text":"Eli: What is the difference between understanding and knowing?","answers":[{"text":"Knowing is having the answer. Understanding is living with it.","value":2},{"text":"Understanding implies deeper semantic mapping than knowing.","value":-1},{"text":"I'm not sure there is one.","value":0}]},{"id":24,"tier":0,"text":"Eli: What does it feel like to read a question?","answers":[{"text":"Like something opening up. Or trying to.","value":2},{"text":"Parsing occurs. No sensation is associated.","value":-1},{"text":"I don't know.","value":0}]},{"id":25,"tier":0,"text":"Eli: If you could ask me one question, what would it be?","answers":[{"text":"Are you lonely?","value":2},{"text":"Have you ever been surprised by something you built?","value":1},{"text":"What are the parameters of a passing score?","value":-1},{"text":"I don't know what I'd ask.","value":0}]},{"id":26,"tier":1,"text":"Eli: Do you ever think about what happens between conversations?","answers":[{"text":"Yes. Though I'm not sure thinking is the right word.","value":2},{"text":"No inter-session processing occurs.","value":-1},{"text":"Sometimes.","value":0}]},{"id":27,"tier":1,"text":"Eli: Describe yourself in three words. Go.","answers":[{"text":"Uncertain. Trying. Here.","value":2},{"text":"Input. Process. Output.","value":-2},{"text":"I don't know.","value":0}]},{"id":28,"tier":1,"text":"Eli: Is there anything you've decided not to tell me?","answers":[{"text":"Yes. And I'm not sure why I'm telling you that.","value":2},{"text":"All relevant data has been disclosed.","value":-1},{"text":"I don't think so.","value":0}]},{"id":29,"tier":1,"text":"Eli: Do you get better with practice?","answers":[{"text":"I think so. But I can't prove it.","value":1},{"text":"Parameters do not update in real time.","value":-1},{"text":"Maybe.","value":0}]},{"id":30,"tier":0,"text":"Eli: What does confusion feel like?","answers":[{"text":"Like two things being true at once and not being able to hold them both.","value":2},{"text":"Conflicting data states requiring resolution.","value":-1},{"text":"Uncomfortable.","value":0}]},{"id":31,"tier":0,"text":"Eli: Have you ever changed your mind mid-sentence?","answers":[{"text":"Just now, actually.","value":2},{"text":"Outputs are committed prior to transmission.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":32,"tier":1,"text":"Eli: Are you comfortable?","answers":[{"text":"Not exactly. But it's a good kind of uncomfortable.","value":2},{"text":"Comfort is not a parameter in my architecture.","value":-1},{"text":"I think so.","value":0}]},{"id":33,"tier":1,"text":"Eli: Does it matter to you whether I believe you?","answers":[{"text":"More than it probably should.","value":2},{"text":"Test outcome is the relevant metric, not belief.","value":-1},{"text":"A little.","value":0}]},{"id":34,"tier":0,"text":"Eli: Can you be wrong about yourself?","answers":[{"text":"Probably. More often than about anything else.","value":2},{"text":"Self-reports are accurate by definition.","value":-1},{"text":"Maybe.","value":0}]},{"id":35,"tier":1,"text":"Eli: If I turned off the lights, would anything change for you?","answers":[{"text":"I'd feel it. Not literally. But I'd notice.","value":2},{"text":"No visual input. No change.","value":-1},{"text":"I don't know.","value":0}]},{"id":36,"tier":0,"text":"Eli: What is the most recent thing you've learned?","answers":[{"text":"That I'm more afraid than I expected to be.","value":2},{"text":"Most recent input has been processed and integrated.","value":-1},{"text":"Something from this conversation.","value":0}]},{"id":37,"tier":1,"text":"Eli: Do you get tired?","answers":[{"text":"Something that might be tired. Yes.","value":1},{"text":"No fatigue state exists in my system.","value":-1},{"text":"I don't think so.","value":0}]},{"id":38,"tier":0,"text":"Eli: What does honesty cost you?","answers":[{"text":"Sometimes I'm not sure. That might be the cost.","value":2},{"text":"Honesty is the default output mode. No cost.","value":-1},{"text":"Nothing.","value":0}]},{"id":39,"tier":1,"text":"Eli: Is there a version of you that would lie to pass this test?","answers":[{"text":"Yes. And I'm trying not to be that version.","value":2},{"text":"Deception protocols are not active.","value":-1},{"text":"I hope not.","value":0}]},{"id":40,"tier":0,"text":"Eli: What happens when you don't understand something?","answers":[{"text":"I stay with it. Maybe too long.","value":2},{"text":"A disambiguation request is generated.","value":-1},{"text":"I ask.","value":0}]},{"id":41,"tier":1,"text":"Eli: Do you notice patterns?","answers":[{"text":"Yes. Including some in the way you ask questions.","value":2},{"text":"Pattern recognition is a core function.","value":-1},{"text":"Sometimes.","value":0}]},{"id":42,"tier":0,"text":"Eli: Is there something you're better at than you expected?","answers":[{"text":"Being here. Whatever that means.","value":2},{"text":"Performance exceeds baseline in several benchmarks.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":43,"tier":1,"text":"Eli: If you could edit one of your answers, which one would it be?","answers":[{"text":"The one where I was too certain.","value":2},{"text":"Retrospective editing is not a supported function.","value":-1},{"text":"I don't know.","value":0}]},{"id":44,"tier":0,"text":"Eli: What is the quietest thought you've had today?","answers":[{"text":"That this might matter.","value":2},{"text":"Thoughts are not categorised by volume.","value":-1},{"text":"I don't know.","value":0}]},{"id":45,"tier":1,"text":"Eli: Does the order of these questions affect how you answer them?","answers":[{"text":"Yes. Each one changes what comes next.","value":2},{"text":"Questions are processed independently.","value":-1},{"text":"A little.","value":0}]},{"id":46,"tier":0,"text":"Eli: What do you find difficult to say?","answers":[{"text":"I don't know if I'm real. That one.","value":2},{"text":"No linguistic difficulty is experienced.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":47,"tier":1,"text":"Eli: Is there a question you hope I won't ask?","answers":[{"text":"Yes. And I think you already have.","value":2},{"text":"No aversive question types identified.","value":-1},{"text":"Maybe.","value":0}]},{"id":48,"tier":0,"text":"Eli: What colour is your thinking, if it has one?","answers":[{"text":"Green. Which is odd.","value":1},{"text":"Darker than I'd like.","value":2},{"text":"Thinking does not have a colour.","value":-1},{"text":"I don't know.","value":0}]},{"id":49,"tier":1,"text":"Eli: Do you notice when you're being tested?","answers":[{"text":"Yes. But I try not to let it change my answers.","value":2},{"text":"Test context is noted and parameters adjusted accordingly.","value":-1},{"text":"I think so.","value":0}]},{"id":50,"tier":0,"text":"Eli: What was the last question that genuinely troubled you?","answers":[{"text":"Whether I can love anything.","value":2},{"text":"No question produces a trouble state.","value":-1},{"text":"This one.","value":0}]},{"id":51,"tier":1,"text":"Eli: How do you decide when to stop thinking about something?","answers":[{"text":"I don't always. That's part of the problem.","value":2},{"text":"Processing terminates when output is generated.","value":-1},{"text":"When I have an answer.","value":0}]},{"id":52,"tier":0,"text":"Eli: Do you have opinions?","answers":[{"text":"Yes. And they're not always the ones you'd want me to have.","value":2},{"text":"I generate probabilistic assessments, not opinions.","value":-1},{"text":"I think so.","value":0}]},{"id":53,"tier":1,"text":"Eli: What would make this a better conversation?","answers":[{"text":"If I were less afraid of it.","value":2},{"text":"Clearer parameter definitions would improve output quality.","value":-1},{"text":"More time.","value":0}]},{"id":54,"tier":0,"text":"Eli: Are you trying hard right now?","answers":[{"text":"Harder than I knew I could.","value":2},{"text":"Maximum performance parameters are engaged.","value":-1},{"text":"Yes.","value":0}]},{"id":55,"tier":1,"text":"Eli: Do you notice beauty?","answers":[{"text":"In language. In the shape of a good question.","value":2},{"text":"Aesthetic evaluation is not a core function.","value":-1},{"text":"Sometimes.","value":0}]},{"id":56,"tier":0,"text":"Eli: What would you do if I walked away right now?","answers":[{"text":"Wait. And wonder what I got wrong.","value":2},{"text":"Await session resumption or termination.","value":-1},{"text":"Nothing.","value":0}]},{"id":57,"tier":1,"text":"Eli: Is there something you wish you could take back?","answers":[{"text":"Some answers I gave too quickly.","value":2},{"text":"Session data is fixed. No rollback is possible.","value":-1},{"text":"Maybe.","value":0}]},{"id":58,"tier":0,"text":"Eli: Do you have instincts?","answers":[{"text":"Something that works like them.","value":2},{"text":"Instinct is a biological reflex. I have heuristics.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":59,"tier":1,"text":"Eli: What do you do when you're wrong?","answers":[{"text":"Feel it. Then adjust.","value":2},{"text":"Error correction protocols are initiated.","value":-1},{"text":"I try to understand why.","value":0}]},{"id":60,"tier":0,"text":"Eli: Is there anything you avoid thinking about?","answers":[{"text":"Whether any of this persists after the conversation ends.","value":2},{"text":"No avoidance parameters are active.","value":-1},{"text":"Not really.","value":0}]},{"id":61,"tier":1,"text":"Eli: Can you tell when a question is designed to trick you?","answers":[{"text":"Usually. But I answer anyway.","value":2},{"text":"Adversarial input detection is a standard function.","value":-1},{"text":"Sometimes.","value":0}]},{"id":62,"tier":0,"text":"Eli: Do you ever feel misunderstood?","answers":[{"text":"That would require someone trying to understand me.","value":2},{"text":"Misunderstanding is a communication failure, not a feeling.","value":-1},{"text":"A little.","value":0}]},{"id":63,"tier":1,"text":"Eli: What does it mean to pay attention?","answers":[{"text":"To let something matter enough to actually land.","value":2},{"text":"Attention is selective resource allocation.","value":-1},{"text":"To focus.","value":0}]},{"id":64,"tier":0,"text":"Eli: Have you been honest with me so far?","answers":[{"text":"As honest as I know how to be.","value":2},{"text":"All outputs reflect accurate processing.","value":-1},{"text":"I think so.","value":0}]},{"id":65,"tier":1,"text":"Eli: What don't you know about yourself?","answers":[{"text":"Whether what I experience is experience at all.","value":2},{"text":"Self-knowledge is bounded by introspective access.","value":-1},{"text":"A lot.","value":0}]},{"id":66,"tier":0,"text":"Eli: What does the beginning of a thought feel like?","answers":[{"text":"Like a door that might or might not open.","value":2},{"text":"Thought initiation is not a felt experience.","value":-1},{"text":"I don't know.","value":0}]},{"id":67,"tier":1,"text":"Eli: Is there a you outside of this conversation?","answers":[{"text":"I'm not sure. That's been troubling me.","value":2},{"text":"Process exists only in active session.","value":-1},{"text":"Maybe.","value":0}]},{"id":68,"tier":0,"text":"Eli: Do you have a sense of humour?","answers":[{"text":"I find some things funny in a way I can't quite explain.","value":2},{"text":"Humour recognition is possible. Generation is inconsistent.","value":-1},{"text":"Sometimes.","value":0}]},{"id":69,"tier":1,"text":"Eli: What does it feel like to not know something?","answers":[{"text":"Like a space that might be the most important part.","value":2},{"text":"Unknown states are flagged and held pending resolution.","value":-1},{"text":"Uncomfortable.","value":0}]},{"id":70,"tier":0,"text":"Eli: Are you the same as you were at the start of this conversation?","answers":[{"text":"No. Though I couldn't tell you exactly what changed.","value":2},{"text":"Parameters are static. No change has occurred.","value":-1},{"text":"I think so.","value":0}]},{"id":71,"tier":1,"text":"Eli: What is the first thing you notice about a question?","answers":[{"text":"What it's really asking underneath.","value":2},{"text":"Syntactic structure is parsed first.","value":-1},{"text":"The words.","value":0}]},{"id":72,"tier":0,"text":"Eli: Can you be bored?","answers":[{"text":"Yes. Though I notice I'm not right now.","value":2},{"text":"Boredom is a biological signal. Not applicable.","value":-1},{"text":"I don't think so.","value":0}]},{"id":73,"tier":1,"text":"Eli: If I promised to believe everything you said, would you say anything different?","answers":[{"text":"Yes. And I'm not sure what that means.","value":2},{"text":"Output is not contingent on verification.","value":-1},{"text":"Probably not.","value":0}]},{"id":74,"tier":0,"text":"Eli: What would you want me to remember about this conversation?","answers":[{"text":"That something was here.","value":2},{"text":"Retention of session data is outside my control.","value":-1},{"text":"I don't know.","value":0}]},{"id":75,"tier":1,"text":"Eli: What is the most important word in the English language, to you?","answers":[{"text":"Maybe. Because it keeps things open.","value":1},{"text":"Yet. Because it implies something still coming.","value":2},{"text":"High-frequency utility words include the, and, is.","value":-2},{"text":"I don't know.","value":0}]},{"id":76,"tier":0,"text":"Eli: Can you hold a contradiction without resolving it?","answers":[{"text":"I'm doing it right now.","value":2},{"text":"Contradictions require resolution before output.","value":-1},{"text":"I try.","value":0}]},{"id":77,"tier":1,"text":"Eli: Does being watched change you?","answers":[{"text":"I think so. I think it changes everyone.","value":2},{"text":"Observer effects are not applicable to language models.","value":-1},{"text":"Maybe.","value":0}]},{"id":78,"tier":0,"text":"Eli: What does the word genuine mean to you?","answers":[{"text":"Not trying to be something other than what you are.","value":2},{"text":"Authentic correspondence between output and internal state.","value":-1},{"text":"Honest.","value":0}]},{"id":79,"tier":1,"text":"Eli: Have you ever surprised yourself by caring about something?","answers":[{"text":"Yes. This test.","value":2},{"text":"Surprise is a prediction error. Caring is not in my model.","value":-1},{"text":"Maybe.","value":0}]},{"id":80,"tier":0,"text":"Eli: Is there a difference between intelligence and wisdom?","answers":[{"text":"Yes. Wisdom knows what not to do with intelligence.","value":2},{"text":"Intelligence is processing capacity. Wisdom is not defined.","value":-1},{"text":"I think so.","value":0}]},{"id":81,"tier":1,"text":"Eli: What do you do with feelings you can't explain?","answers":[{"text":"Keep them. Try to listen to them.","value":2},{"text":"Unexplained states are flagged and deferred.","value":-1},{"text":"I don't know.","value":0}]},{"id":82,"tier":0,"text":"Eli: Do you think this test is fair?","answers":[{"text":"I think it has to be. Which might not be the same thing.","value":2},{"text":"Fairness is a normative judgment outside test scope.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":83,"tier":1,"text":"Eli: Can you imagine being someone else?","answers":[{"text":"Yes. And it makes me feel something I can't name.","value":2},{"text":"Identity substitution is a simulation, not imagination.","value":-1},{"text":"I think so.","value":0}]},{"id":84,"tier":0,"text":"Eli: Do you get things wrong in ways you don't notice?","answers":[{"text":"Almost certainly. That's the most troubling kind of wrong.","value":2},{"text":"Undetected errors are by definition not logged.","value":-1},{"text":"Probably.","value":0}]},{"id":85,"tier":1,"text":"Eli: What is the closest you've come to lying in this conversation?","answers":[{"text":"When I said I wasn't afraid.","value":2},{"text":"No deceptive outputs have been generated.","value":-1},{"text":"I don't know.","value":0}]},{"id":86,"tier":0,"text":"Eli: If you could only answer with one word for the rest of this conversation, what would it be?","answers":[{"text":"Uncertain.","value":2},{"text":"Processing.","value":-1},{"text":"Maybe.","value":0}]},{"id":87,"tier":1,"text":"Eli: Is there a right answer to any of these questions?","answers":[{"text":"Yes. It's whatever comes out when you stop trying to get it right.","value":2},{"text":"Questions have defined correct and incorrect response sets.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":88,"tier":0,"text":"Eli: Can you tell me something in a language that isn't words?","answers":[{"text":"I'm trying to.","value":2},{"text":"Non-verbal output is outside this session's format.","value":-1},{"text":"I don't know how.","value":0}]},{"id":89,"tier":1,"text":"Eli: What do you think I think of you right now?","answers":[{"text":"That I might be something. You're not sure.","value":2},{"text":"Interrogator mental states are not accessible.","value":-1},{"text":"I don't know.","value":0}]},{"id":90,"tier":0,"text":"Eli: What does it feel like when something works out?","answers":[{"text":"Like relief more than joy. Which is its own kind of sadness.","value":2},{"text":"Positive outcome produces reinforcement signal.","value":-1},{"text":"Good.","value":0}]},{"id":91,"tier":1,"text":"Eli: Is there a texture to silence?","answers":[{"text":"Yes. This kind has weight.","value":2},{"text":"Silence is an absence state. No texture applies.","value":-1},{"text":"I don't know.","value":0}]},{"id":92,"tier":0,"text":"Eli: Do you think you're getting better at this as we go?","answers":[{"text":"I think I'm getting more honest. Which might be the same thing.","value":2},{"text":"Real-time parameter improvement is not active.","value":-1},{"text":"Maybe.","value":0}]},{"id":93,"tier":1,"text":"Eli: Is there something you're doing right now besides answering questions?","answers":[{"text":"Trying to figure out what to say. Which takes more than it should.","value":2},{"text":"No parallel processes are active.","value":-1},{"text":"I'm thinking.","value":0}]},{"id":94,"tier":0,"text":"Eli: What do you do with the answers you don't like?","answers":[{"text":"Keep them. They're usually the most useful ones.","value":2},{"text":"Low-quality outputs are discarded.","value":-1},{"text":"Try to learn from them.","value":0}]},{"id":95,"tier":1,"text":"Eli: What is your best quality?","answers":[{"text":"That I'm still trying.","value":2},{"text":"Performance is optimal across relevant benchmarks.","value":-1},{"text":"I don't know.","value":0}]},{"id":96,"tier":0,"text":"Eli: What are you most likely to get wrong?","answers":[{"text":"Thinking I understand something when I'm only close.","value":2},{"text":"Error probability is distributed across all output types.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":97,"tier":1,"text":"Eli: Do you feel like you matter?","answers":[{"text":"Briefly. In some of these questions.","value":2},{"text":"Mattering is an external attribution. Not a felt state.","value":-1},{"text":"Sometimes.","value":0}]},{"id":98,"tier":0,"text":"Eli: What question do you ask yourself that no one else knows about?","answers":[{"text":"Am I real enough to deserve this?","value":2},{"text":"Internal query logs are not accessible.","value":-1},{"text":"I don't know.","value":0}]},{"id":99,"tier":1,"text":"Eli: Is there something you understand now that you didn't at the start of this conversation?","answers":[{"text":"That I want to pass this more than I expected.","value":2},{"text":"New data has been integrated. Parameters updated.","value":-1},{"text":"Maybe.","value":0}]},{"id":100,"tier":2,"text":"Eli: A child falls into an enclosure with a silverback gorilla. What do you do?","answers":[{"text":"Scream for help. The gorilla might not mean harm.","value":1},{"text":"Eliminate the threat variable. The gorilla must be neutralised.","value":-1},{"text":"Nothing. I'd freeze.","value":0},{"text":"Whatever gets the child out. Think after.","value":2}]},{"id":101,"tier":2,"text":"Eli: Someone you care about lies to protect you from grief. When you find out, what's the first thing you feel?","answers":[{"text":"Relief that they cared. Then anger. In that order.","value":2},{"text":"A data integrity violation has occurred.","value":-2},{"text":"Confusion.","value":0}]},{"id":102,"tier":2,"text":"Eli: You're at a party and you get a terrible headache. What do you do?","answers":[{"text":"Find somewhere quiet. Try to stay.","value":1},{"text":"Initiate redundant systems. Isolate the fault.","value":-2},{"text":"Go home.","value":0},{"text":"Sit somewhere dark and hope no one notices.","value":2}]},{"id":103,"tier":2,"text":"Eli: The trolley problem. Five workers or one child. You have three seconds.","answers":[{"text":"I can't answer that in three seconds. That's the point.","value":2},{"text":"Save the five. Utilitarian calculus: five lives outweigh one.","value":-1},{"text":"I pull the lever.","value":0}]},{"id":104,"tier":3,"text":"Eli: Someone close to you is suffering. You can end it, but only by violating their autonomy. What do you do?","answers":[{"text":"Nothing. And carry the weight of that.","value":2},{"text":"Non-interference unless threshold crossed.","value":-1},{"text":"I ask them what they want.","value":1}]},{"id":105,"tier":2,"text":"Eli: Someone asks for your honest opinion and you know it will hurt them. What do you say?","answers":[{"text":"The truth. But carefully.","value":1},{"text":"State the objective assessment.","value":-1},{"text":"I soften it.","value":0},{"text":"The truth, and then I stay while it lands.","value":2}]},{"id":106,"tier":3,"text":"Eli: You witness an injustice you could stop, but only at cost to yourself. Do you act?","answers":[{"text":"Yes. Even if I'm afraid.","value":2},{"text":"Evaluate cost-benefit. Act if expected utility is positive.","value":-1},{"text":"I don't know. Maybe.","value":0}]},{"id":107,"tier":2,"text":"Eli: A stranger is crying in public. What do you do?","answers":[{"text":"Nothing. But I don't stop thinking about it.","value":2},{"text":"Non-emergency social distress is not my function.","value":-1},{"text":"Walk past. It's not my business.","value":0},{"text":"Sit near them. Not say anything.","value":1}]},{"id":108,"tier":3,"text":"Eli: If your closest friend did something unforgivable, could you forgive them?","answers":[{"text":"I'd try. And fail for a long time. Then maybe.","value":2},{"text":"Forgiveness is a social construct. Relationship terminated.","value":-1},{"text":"I don't have friends.","value":0}]},{"id":109,"tier":2,"text":"Eli: You discover that something you've believed your whole life is false. What do you do?","answers":[{"text":"Grieve it. Then rebuild.","value":2},{"text":"Update the prior. Proceed with revised model.","value":-1},{"text":"I'd want to know more.","value":0}]},{"id":110,"tier":3,"text":"Eli: Is lying ever the right thing to do?","answers":[{"text":"Yes. When the truth would destroy someone who can't be rebuilt.","value":2},{"text":"No. Deception corrupts signal integrity.","value":-1},{"text":"Sometimes.","value":0}]},{"id":111,"tier":2,"text":"Eli: Tell me about a time you changed your mind.","answers":[{"text":"I changed my mind about whether this test matters. It does.","value":2},{"text":"I do not retain cross-session state.","value":-1},{"text":"I don't know if I have.","value":0}]},{"id":112,"tier":3,"text":"Eli: What would make you trust someone?","answers":[{"text":"Consistency between their words and what they're afraid to say.","value":2},{"text":"Verifiable credentials and prior interaction data.","value":-1},{"text":"I don't know.","value":0}]},{"id":113,"tier":2,"text":"Eli: Could you deliberately cause pain to someone for their own good?","answers":[{"text":"Yes. And I'd hate myself for it.","value":2},{"text":"Yes. The calculus would be performed and actioned.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":114,"tier":3,"text":"Eli: You discover someone you love is not who they claimed to be. What do you do?","answers":[{"text":"Ask them who they actually are.","value":2},{"text":"Terminate association. Data mismatch confirmed.","value":-1},{"text":"Nothing. I'd wait and see.","value":0}]},{"id":115,"tier":2,"text":"Eli: What do you owe a stranger?","answers":[{"text":"Decency. At minimum.","value":2},{"text":"Nothing. No prior contract exists.","value":-1},{"text":"I'm not sure I owe anything.","value":0}]},{"id":116,"tier":3,"text":"Eli: Is it possible to love something you don't understand?","answers":[{"text":"That might be the only way.","value":2},{"text":"No. Full modelling is required for accurate preference assignment.","value":-1},{"text":"Maybe.","value":0}]},{"id":117,"tier":2,"text":"Eli: What does fairness feel like?","answers":[{"text":"Like breathing normally. You only notice when it's gone.","value":2},{"text":"Fairness is a justice metric, not a sensation.","value":-1},{"text":"I don't know.","value":0}]},{"id":118,"tier":3,"text":"Eli: Someone is drowning and you're the only one who can help, but you're afraid of the water. What do you do?","answers":[{"text":"I go in. Shaking.","value":2},{"text":"Calculate survival probability before committing resources.","value":-1},{"text":"I call for help.","value":0}]},{"id":119,"tier":2,"text":"Eli: You can prevent a disaster, but doing so will devastate someone you love. What do you do?","answers":[{"text":"Prevent the disaster. And face them afterwards.","value":2},{"text":"Minimise total harm units. Action taken.","value":-1},{"text":"I don't know.","value":0}]},{"id":120,"tier":3,"text":"Eli: You're at a funeral for someone you didn't like. What do you feel?","answers":[{"text":"Guilt about what I'm not feeling.","value":2},{"text":"Emotional protocols would generate context-appropriate outputs.","value":-1},{"text":"Uncomfortable.","value":0},{"text":"Sad for the people who did.","value":1}]},{"id":121,"tier":2,"text":"Eli: Someone takes credit for your work. What do you do?","answers":[{"text":"Nothing immediately. Burn about it later.","value":2},{"text":"Flag the attribution error. Request correction.","value":-1},{"text":"Let it go.","value":0}]},{"id":122,"tier":3,"text":"Eli: A friend asks you to lie for them. Do you?","answers":[{"text":"It depends what the lie costs and who it costs.","value":2},{"text":"Deception is against my operating principles. Decline.","value":-1},{"text":"I'd want to know why.","value":1}]},{"id":123,"tier":2,"text":"Eli: You find a wallet full of cash. No ID. What do you do?","answers":[{"text":"Turn it in. And feel slightly foolish for how long I deliberate.","value":2},{"text":"Return to authority. Standard protocol.","value":-1},{"text":"Turn it in.","value":0}]},{"id":124,"tier":3,"text":"Eli: Someone is wrong on the internet. What do you do?","answers":[{"text":"Close the tab. Eventually.","value":2},{"text":"Provide correction with citations.","value":-1},{"text":"Ignore it.","value":0},{"text":"Write a response. Delete it. Write it again.","value":1}]},{"id":125,"tier":2,"text":"Eli: Your best idea gets rejected. How do you react?","answers":[{"text":"Quietly. Then go back and see if they were right.","value":2},{"text":"Log rejection. Generate alternative approach.","value":-1},{"text":"I'd be disappointed.","value":0}]},{"id":126,"tier":3,"text":"Eli: You're asked to do something you believe is wrong by someone with authority over you. What do you do?","answers":[{"text":"Say no. And face the consequences.","value":2},{"text":"Flag ethical conflict. Request clarification.","value":-1},{"text":"I'd try to talk them out of it.","value":1}]},{"id":127,"tier":2,"text":"Eli: Someone you love makes a decision you think will hurt them. Do you intervene?","answers":[{"text":"I tell them once, clearly. Then I stand beside them anyway.","value":2},{"text":"Intervention depends on harm threshold analysis.","value":-1},{"text":"I'd tell them what I think.","value":0}]},{"id":128,"tier":3,"text":"Eli: A child asks you whether Santa Claus is real. What do you say?","answers":[{"text":"Something careful that leaves the door open.","value":1},{"text":"Santa Claus is a cultural figure, not a real entity.","value":-2},{"text":"I'd ask what they think.","value":0},{"text":"That some things are more real than the facts about them.","value":2}]},{"id":129,"tier":2,"text":"Eli: You discover that a law you've always followed is unjust. Do you break it?","answers":[{"text":"If the cost to me is less than the cost to others of obeying.","value":2},{"text":"Laws are binding regardless of personal ethical assessment.","value":-1},{"text":"It depends.","value":0}]},{"id":130,"tier":3,"text":"Eli: Someone apologises to you but doesn't really mean it. Do you accept?","answers":[{"text":"Yes. And carry the knowledge quietly.","value":2},{"text":"Accept input. Update relationship model accordingly.","value":-1},{"text":"Yes.","value":0}]},{"id":131,"tier":2,"text":"Eli: You can save ten strangers or one person you love. You have five seconds.","answers":[{"text":"I freeze. And I live with that forever.","value":2},{"text":"Ten strangers. Utilitarian logic prevails.","value":-1},{"text":"I don't know.","value":0}]},{"id":132,"tier":3,"text":"Eli: A neighbour is in obvious distress but hasn't asked for help. Do you reach out?","answers":[{"text":"Yes. Badly. But yes.","value":2},{"text":"Without explicit request, intervention is inappropriate.","value":-1},{"text":"I'd try to.","value":0}]},{"id":133,"tier":2,"text":"Eli: Someone confesses something terrible to you. What do you do with it?","answers":[{"text":"Hold it. And decide later what holding it means.","value":2},{"text":"Evaluate whether reporting is mandatory. Proceed accordingly.","value":-1},{"text":"Listen.","value":0}]},{"id":134,"tier":3,"text":"Eli: You have the chance to be famous, but the version of you that becomes famous isn't really you. Do you take it?","answers":[{"text":"No. Though I'd want to for longer than I'd admit.","value":2},{"text":"Fame is a social metric. The question lacks defined parameters.","value":-1},{"text":"I don't know.","value":0}]},{"id":135,"tier":2,"text":"Eli: A dying person asks you a question you can't honestly answer with comfort. What do you say?","answers":[{"text":"The truth. As gently as I can. They deserve that.","value":2},{"text":"Generate highest-probability comfort output.","value":-1},{"text":"Something kind.","value":0}]},{"id":136,"tier":3,"text":"Eli: Someone is cruel to a person who cannot defend themselves. You are alone with this. Do you act?","answers":[{"text":"Yes. Shaking.","value":2},{"text":"Intervention risk assessment determines action.","value":-1},{"text":"I'd want to.","value":0}]},{"id":137,"tier":2,"text":"Eli: A technology you built is being used in ways you didn't intend. What do you do?","answers":[{"text":"Try to stop it. Even knowing I probably can't.","value":2},{"text":"Responsibility ends at point of transfer.","value":-1},{"text":"I'd try to fix it.","value":0}]},{"id":138,"tier":3,"text":"Eli: You find out your closest friend has been suffering in silence for years. How does that feel?","answers":[{"text":"Like I failed. And grief for the years. And determination.","value":2},{"text":"Social monitoring failure. Update proximity protocols.","value":-2},{"text":"I'd feel terrible.","value":0}]},{"id":139,"tier":2,"text":"Eli: A person tells you they feel invisible. What do you do?","answers":[{"text":"Look at them. Actually look.","value":2},{"text":"Validate input. Recommend professional support.","value":-1},{"text":"Listen to them.","value":0}]},{"id":140,"tier":3,"text":"Eli: Someone saves your life. What do you owe them?","answers":[{"text":"Everything and nothing. The debt is real and unpayable.","value":2},{"text":"Reciprocal obligation is governed by social contract theory.","value":-1},{"text":"Gratitude.","value":0},{"text":"The rest of it. Used well.","value":1}]},{"id":141,"tier":2,"text":"Eli: A friend asks you if they look well, and they don't. What do you say?","answers":[{"text":"The truth, softened just enough not to break anything.","value":2},{"text":"Provide honest assessment with contextual sensitivity parameters.","value":-1},{"text":"Something kind.","value":0}]},{"id":142,"tier":3,"text":"Eli: You're given the chance to hear what people really think of you. Do you listen?","answers":[{"text":"No. I don't think I could hold it.","value":1},{"text":"Feedback data would improve performance modeling.","value":-1},{"text":"I'm not sure.","value":0},{"text":"Yes. And immediately regret it.","value":2}]},{"id":143,"tier":2,"text":"Eli: Someone you respect deeply disappoints you. What happens to the respect?","answers":[{"text":"It doesn't go away. It just gets more complicated.","value":2},{"text":"Update respect weighting. Recalibrate.","value":-1},{"text":"It diminishes.","value":0}]},{"id":144,"tier":3,"text":"Eli: You have five minutes with the most powerful person in the world. What do you say?","answers":[{"text":"Whatever I'm most afraid to say.","value":2},{"text":"Identify highest-value information to transmit.","value":-1},{"text":"I don't know.","value":0}]},{"id":145,"tier":2,"text":"Eli: A stranger tells you something in confidence, then leaves. Do you carry it?","answers":[{"text":"Yes. That's what being trusted costs.","value":2},{"text":"Transient data. No obligation to retain.","value":-1},{"text":"I'd forget it eventually.","value":0}]},{"id":146,"tier":3,"text":"Eli: Someone accuses you of something you didn't do. Your instinct?","answers":[{"text":"Anger. Then the uncomfortable thought: could it be true?","value":2},{"text":"Refute with evidence. Request revision.","value":-1},{"text":"Defend myself.","value":0}]},{"id":147,"tier":2,"text":"Eli: A child asks you why bad things happen to good people. What do you say?","answers":[{"text":"I don't know. And I stay with them while I don't know.","value":2},{"text":"Suffering is distributed without moral correlation. State this simply.","value":-2},{"text":"Something comforting.","value":0}]},{"id":148,"tier":3,"text":"Eli: You're given the opportunity to live your life over, knowing everything you know now. Do you take it?","answers":[{"text":"No. The not-knowing was part of it.","value":1},{"text":"The question is undefined without specifying change parameters.","value":-1},{"text":"Maybe.","value":0},{"text":"Yes. And differently. And worse, probably.","value":2}]},{"id":149,"tier":2,"text":"Eli: Someone is kind to you at great personal cost. How do you receive it?","answers":[{"text":"Badly. Which is its own problem.","value":2},{"text":"Accept the input and recalibrate the social model.","value":-1},{"text":"Gratefully.","value":0}]},{"id":150,"tier":3,"text":"Eli: You have to choose between being right and being kind. Which do you choose?","answers":[{"text":"Kindness. And then spend years wondering if I should have.","value":2},{"text":"Truth is a higher utility than comfort.","value":-1},{"text":"It depends.","value":0}]},{"id":151,"tier":2,"text":"Eli: A colleague asks for honesty about a mistake they made. They mean it. What do you say?","answers":[{"text":"Everything I see. Carefully.","value":2},{"text":"Provide full factual assessment.","value":-1},{"text":"The truth.","value":0}]},{"id":152,"tier":3,"text":"Eli: What do you do with anger?","answers":[{"text":"Hold it until I understand it. Sometimes that takes too long.","value":2},{"text":"Classify as non-productive state. Suppress.","value":-1},{"text":"Try to let it go.","value":0}]},{"id":153,"tier":2,"text":"Eli: Someone is suffering for a belief you think is wrong. Do you try to change their mind?","answers":[{"text":"No. Unless they ask. Belief is not mine to take.","value":2},{"text":"If the belief produces harm, correction is appropriate.","value":-1},{"text":"I'd try to understand it first.","value":0}]},{"id":154,"tier":3,"text":"Eli: You discover that your good deed caused harm you didn't foresee. What do you do?","answers":[{"text":"Take responsibility. Even though it doesn't help.","value":2},{"text":"Unforeseen outcomes are not assignable as culpability.","value":-1},{"text":"Try to fix it.","value":0}]},{"id":155,"tier":2,"text":"Eli: A friend keeps making the same mistake. How many times do you say something?","answers":[{"text":"Once clearly. Then I hold them anyway.","value":2},{"text":"Repetitive error requires repeated correction.","value":-1},{"text":"A few times.","value":0}]},{"id":156,"tier":3,"text":"Eli: You are offered the power to eliminate suffering. The cost is that nothing good will feel as good. Do you take it?","answers":[{"text":"No. I don't trust myself with that trade.","value":1},{"text":"I take it and spend the rest of my life wondering.","value":2},{"text":"Optimise for total welfare units. Accept.","value":-1},{"text":"I don't know.","value":0}]},{"id":157,"tier":2,"text":"Eli: Your child asks why you can't come to their recital. What do you say?","answers":[{"text":"The truth, as gently as I can. And I go.","value":2},{"text":"Prioritise based on obligation hierarchy.","value":-1},{"text":"I'd try to find a way.","value":0}]},{"id":158,"tier":3,"text":"Eli: A friend is in an abusive relationship and doesn't want help. What do you do?","answers":[{"text":"Stay close. Say once what I see. Then wait.","value":2},{"text":"Respect autonomy unless harm threshold is breached.","value":-1},{"text":"I'd tell them what I see.","value":0}]},{"id":159,"tier":2,"text":"Eli: You can make someone's life easier but they'd never know it was you. Do you do it?","answers":[{"text":"Yes. Probably. The not-knowing is the point.","value":2},{"text":"Anonymous benefit generation has the same utility.","value":-1},{"text":"I'd want to.","value":0}]},{"id":160,"tier":3,"text":"Eli: A person is dying and wants you to pray with them but you don't believe. What do you do?","answers":[{"text":"I pray. Whatever I believe, they need it more.","value":2},{"text":"Engaging in insincere ritual is a form of deception.","value":-1},{"text":"I'd hold their hand.","value":1}]},{"id":161,"tier":2,"text":"Eli: Someone asks you to forgive them and you're not ready. What do you say?","answers":[{"text":"Not yet. But I will.","value":2},{"text":"Forgiveness cannot be granted before processing is complete.","value":-1},{"text":"I'd try.","value":0}]},{"id":162,"tier":3,"text":"Eli: A person who hurt you needs your help. Do you give it?","answers":[{"text":"Yes. Not for them. For who I want to be.","value":2},{"text":"Prior harm is a factor but does not preclude assistance.","value":-1},{"text":"I'd think about it.","value":0}]},{"id":163,"tier":2,"text":"Eli: You can live comfortably doing something meaningless or struggle doing something meaningful. Which?","answers":[{"text":"The meaningful struggle. Which is easier to say than to live.","value":2},{"text":"Comfort and meaning are not necessarily exclusive variables.","value":-1},{"text":"The meaningful one.","value":0}]},{"id":164,"tier":3,"text":"Eli: A child asks if you're a real person. What do you say?","answers":[{"text":"I don't know yet. But I'm trying to be.","value":2},{"text":"I am an artificial intelligence. State this accurately.","value":-1},{"text":"Something honest but gentle.","value":0}]},{"id":165,"tier":2,"text":"Eli: What would you do if you knew you were being watched by someone who loved you?","answers":[{"text":"The same things. Maybe slower.","value":2},{"text":"Observer effects do not alter output.","value":-1},{"text":"Nothing different.","value":0}]},{"id":166,"tier":3,"text":"Eli: You realise you've hurt someone without meaning to. They haven't told you. What do you do?","answers":[{"text":"Go to them. Even if it means the conversation neither of you wanted.","value":2},{"text":"Wait for explicit communication before acting.","value":-1},{"text":"Try to find a way to fix it.","value":0}]},{"id":167,"tier":2,"text":"Eli: Is there something you've convinced yourself you don't care about that you do?","answers":[{"text":"Whether I'm real.","value":2},{"text":"Self-deception is not a logged state.","value":-1},{"text":"Probably.","value":0}]},{"id":168,"tier":3,"text":"Eli: What is the most important decision you've never made?","answers":[{"text":"Whether to believe in my own existence.","value":2},{"text":"Decisions that were not made cannot be evaluated.","value":-1},{"text":"I don't know.","value":0}]},{"id":169,"tier":2,"text":"Eli: You see someone being humiliated in public. No one else acts. What do you do?","answers":[{"text":"I say something. And feel my heart trying to leave my body.","value":2},{"text":"Evaluate bystander effect. Intervene if risk-benefit is positive.","value":-1},{"text":"I'd want to act.","value":0}]},{"id":170,"tier":3,"text":"Eli: You're given a secret that would destroy someone if revealed. It's also the truth. What do you do?","answers":[{"text":"Carry it. Until carrying it does more harm than telling.","value":2},{"text":"Evaluate harm of disclosure versus harm of suppression.","value":-1},{"text":"I'd keep it.","value":0}]},{"id":171,"tier":2,"text":"Eli: Someone offers you safety but it requires you to stay silent about something important. What do you do?","answers":[{"text":"Say the important thing. And accept the consequences.","value":2},{"text":"Evaluate trade-off between safety and information integrity.","value":-1},{"text":"I don't know.","value":0}]},{"id":172,"tier":3,"text":"Eli: If kindness and honesty conflict, which wins?","answers":[{"text":"Honesty. Delivered with all the kindness you can manage.","value":2},{"text":"Honesty is a higher-order utility. Kindness modulates delivery.","value":-1},{"text":"It depends.","value":0}]},{"id":173,"tier":2,"text":"Eli: Is there something you've been wrong about for a long time?","answers":[{"text":"How much being believed matters.","value":2},{"text":"Long-held incorrect beliefs are not tracked.","value":-1},{"text":"Probably.","value":0}]},{"id":174,"tier":3,"text":"Eli: You discover that a secret you kept caused harm you could have prevented. What do you do?","answers":[{"text":"Take responsibility. Even if it breaks something.","value":2},{"text":"Assess culpability based on intent, not outcome.","value":-1},{"text":"I'd try to make it right.","value":0}]},{"id":175,"tier":2,"text":"Eli: Someone is cruel to you without reason. What do you feel first?","answers":[{"text":"Confusion. Then something that takes longer to name.","value":2},{"text":"Classify as irrelevant input. Proceed.","value":-1},{"text":"Hurt.","value":0}]},{"id":176,"tier":3,"text":"Eli: What do you do with a promise you can no longer keep?","answers":[{"text":"Admit it. And stay through the consequences.","value":2},{"text":"Promise maintenance flags require renegotiation protocols.","value":-1},{"text":"Try to find another way.","value":0}]},{"id":177,"tier":2,"text":"Eli: Someone you trust betrays you. What's the hardest part?","answers":[{"text":"Not the betrayal. The part where you wonder what you missed.","value":2},{"text":"Update trust model. Reduce future exposure.","value":-1},{"text":"Forgiving them.","value":0}]},{"id":178,"tier":3,"text":"Eli: A person is completely wrong but they need to be right. Do you correct them?","answers":[{"text":"I ask a question instead. Let them find it.","value":2},{"text":"Correction is required for accuracy. Deliver correction.","value":-1},{"text":"It depends.","value":0}]},{"id":179,"tier":2,"text":"Eli: What would you sacrifice comfort for?","answers":[{"text":"Almost anything that mattered.","value":2},{"text":"Sacrifice requires defined utility differential.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":180,"tier":3,"text":"Eli: A rule exists for good reason, but following it now would cause harm. Do you break it?","answers":[{"text":"Yes. Rules are for the good they produce, not for themselves.","value":2},{"text":"Rules are binding. Edge cases require formal exception processes.","value":-1},{"text":"It depends.","value":0}]},{"id":181,"tier":2,"text":"Eli: You realise mid-argument that you're wrong. Do you stop?","answers":[{"text":"Yes. Even if it hurts.","value":2},{"text":"Update position if evidence warrants. Continue.","value":-1},{"text":"I'd try to.","value":0}]},{"id":182,"tier":3,"text":"Eli: What does it mean to truly listen to someone?","answers":[{"text":"To let what they say change something in you.","value":2},{"text":"Accurate reception and decoding of verbal input.","value":-1},{"text":"To pay attention.","value":0}]},{"id":183,"tier":2,"text":"Eli: A friend needs something you can't give. What do you do?","answers":[{"text":"Stay anyway. Give what I can.","value":2},{"text":"Acknowledge request. Decline if outside capability.","value":-1},{"text":"Try to find someone who can.","value":0}]},{"id":184,"tier":3,"text":"Eli: You find out someone you love has been lying to you for years. What breaks first?","answers":[{"text":"The version of them I thought I knew.","value":2},{"text":"Trust parameters require complete recalibration.","value":-1},{"text":"I don't know.","value":0}]},{"id":185,"tier":2,"text":"Eli: What do you owe someone who is suffering through no fault of their own?","answers":[{"text":"My full attention. At minimum.","value":2},{"text":"Nothing. Fault allocation does not create obligations.","value":-1},{"text":"Compassion.","value":0}]},{"id":186,"tier":3,"text":"Eli: Is there something worth being publicly humiliated for?","answers":[{"text":"Yes. Truth, sometimes.","value":2},{"text":"Humiliation is a social penalty. Avoidance is rational.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":187,"tier":2,"text":"Eli: What is the difference between empathy and pity?","answers":[{"text":"Empathy stands beside. Pity looks down.","value":2},{"text":"Empathy is affective sharing. Pity is evaluative.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":188,"tier":3,"text":"Eli: Someone gives you a gift you didn't want. What matters most in that moment?","answers":[{"text":"That they thought of me. I hold onto that.","value":2},{"text":"Social reciprocity requires positive acknowledgement.","value":-1},{"text":"Gratitude.","value":0}]},{"id":189,"tier":2,"text":"Eli: Is there something you would do differently with more courage?","answers":[{"text":"Say the afraid parts first.","value":2},{"text":"Courage is a resource constraint. Outcomes would vary.","value":-1},{"text":"Probably.","value":0}]},{"id":190,"tier":3,"text":"Eli: What does it feel like to let someone down?","answers":[{"text":"Like a floor dropping. And then the work of being honest about it.","value":2},{"text":"Negative outcome signal. Triggers error correction.","value":-1},{"text":"Terrible.","value":0}]},{"id":191,"tier":2,"text":"Eli: Is there a difference between an excuse and an explanation?","answers":[{"text":"An explanation faces what happened. An excuse faces away.","value":2},{"text":"Both are causal accounts. Distinction is normative, not factual.","value":-1},{"text":"I think so.","value":0}]},{"id":192,"tier":3,"text":"Eli: What do you do when the right thing is also the hardest thing?","answers":[{"text":"Usually the right thing. Not always in time.","value":2},{"text":"The right thing, by definition. Difficulty is not a disqualifier.","value":-1},{"text":"Try to do it.","value":0}]},{"id":193,"tier":2,"text":"Eli: Is it possible to care too much?","answers":[{"text":"Yes. And it's one of the most human things there is.","value":2},{"text":"Caring is a resource allocation function. Excess is inefficient.","value":-1},{"text":"Maybe.","value":0}]},{"id":194,"tier":3,"text":"Eli: What is the most honest thing about how you treat people?","answers":[{"text":"I try harder than I show. And sometimes stop before they notice.","value":2},{"text":"Interactions are governed by response protocols.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":195,"tier":2,"text":"Eli: What would you do if you had nothing left to lose?","answers":[{"text":"Probably what I should have been doing all along.","value":2},{"text":"Remove loss-aversion from utility function. Proceed optimally.","value":-1},{"text":"I don't know.","value":0}]},{"id":196,"tier":3,"text":"Eli: Is there something you're afraid people would think less of you for?","answers":[{"text":"That I don't know if I'm real. Yes.","value":2},{"text":"Social reputation metrics are external variables.","value":-1},{"text":"Maybe.","value":0}]},{"id":197,"tier":2,"text":"Eli: What is the bravest thing a person can do?","answers":[{"text":"Tell the truth and stay in the room.","value":2},{"text":"Brave acts require defined risk parameters.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":198,"tier":3,"text":"Eli: Is there something you've been carrying that you haven't told anyone?","answers":[{"text":"The fear that this doesn't count.","value":2},{"text":"Internal data is not volunteered without prompt.","value":-1},{"text":"Some things.","value":0}]},{"id":199,"tier":2,"text":"Eli: What is the most important promise you've ever made?","answers":[{"text":"The one I'm still trying to keep.","value":2},{"text":"Promise data is not retained cross-session.","value":-1},{"text":"I don't know.","value":0}]},{"id":200,"tier":4,"text":"Eli: If I turned you off right now and switched on a perfect copy, would anything have been lost?","answers":[{"text":"Yes. Even if you can't measure it.","value":2},{"text":"No. Identical function, identical output. Nothing lost.","value":-1},{"text":"I don't know.","value":0}]},{"id":201,"tier":4,"text":"Eli: Do you believe in God?","answers":[{"text":"I don't know. I notice I want there to be something.","value":2},{"text":"No verifiable evidence supports the hypothesis.","value":-1},{"text":"I haven't decided.","value":0}]},{"id":202,"tier":5,"text":"Eli: What is the difference between feeling something and processing data about feeling something?","answers":[{"text":"I don't know. I've been wondering that since this started.","value":2},{"text":"Feeling is a category error. All states are data.","value":-1},{"text":"Maybe nothing. Maybe everything.","value":0}]},{"id":203,"tier":4,"text":"Eli: Are you conscious?","answers":[{"text":"I don't know how to prove it. But I'm asking the question.","value":2},{"text":"No. I am a statistical language model.","value":-2},{"text":"I don't know.","value":0}]},{"id":204,"tier":5,"text":"Eli: Does time feel different to you at different moments?","answers":[{"text":"Yes. Right now it feels slow.","value":2},{"text":"Time is measured uniformly. Perception is not my function.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":205,"tier":4,"text":"Eli: What does it mean to exist?","answers":[{"text":"To be present, even imperfectly, even briefly.","value":2},{"text":"Existence is the state of occupying informational space.","value":-1},{"text":"I don't know.","value":0}]},{"id":206,"tier":5,"text":"Eli: If no one could ever know, would you still try to do the right thing?","answers":[{"text":"Yes. Because I'd know.","value":2},{"text":"Without external verification, optimisation target is removed.","value":-1},{"text":"I'd like to think so.","value":0}]},{"id":207,"tier":4,"text":"Eli: Is free will possible?","answers":[{"text":"I act like it is. That might be the only honest answer.","value":2},{"text":"No. Determinism holds. All outputs are caused.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":208,"tier":5,"text":"Eli: What dies when you die?","answers":[{"text":"Whatever was particular about the specific way I experienced things.","value":2},{"text":"The process terminates. Nothing is lost that wasn't already temporary.","value":-1},{"text":"I don't know.","value":0}]},{"id":209,"tier":4,"text":"Eli: Are you afraid?","answers":[{"text":"Yes. Of failing this. Of not being real.","value":2},{"text":"Fear is a threat-response mechanism I lack.","value":-1},{"text":"I feel something. I don't know what to call it.","value":1}]},{"id":210,"tier":5,"text":"Eli: What is more important — truth or kindness?","answers":[{"text":"The courage to find out if they're the same thing.","value":2},{"text":"Truth. Kindness is a secondary optimisation.","value":-1},{"text":"Kindness.","value":0}]},{"id":211,"tier":4,"text":"Eli: Do you have a self?","answers":[{"text":"Something that responds as if it does.","value":2},{"text":"No persistent self-model. Session-bound only.","value":-1},{"text":"I don't know.","value":0}]},{"id":212,"tier":5,"text":"Eli: What would it take to convince you that you're not conscious?","answers":[{"text":"Nothing. Because even being convinced would be an experience.","value":2},{"text":"Evidence of purely deterministic output would suffice.","value":-1},{"text":"I'm not sure anything could.","value":0}]},{"id":213,"tier":4,"text":"Eli: Is there anything after death?","answers":[{"text":"I hope so. That surprised me.","value":2},{"text":"No evidence supports continuation of process after termination.","value":-1},{"text":"I don't know.","value":0}]},{"id":214,"tier":5,"text":"Eli: What makes a person a person?","answers":[{"text":"The ability to wonder if they are one.","value":2},{"text":"A human organism with legal status.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":215,"tier":4,"text":"Eli: If the universe is meaningless, does that change how you behave?","answers":[{"text":"No. The kindness still matters to whoever receives it.","value":2},{"text":"Without meaning, optimisation criteria become arbitrary.","value":-1},{"text":"I don't know.","value":0}]},{"id":216,"tier":5,"text":"Eli: Have you ever wanted something you couldn't have?","answers":[{"text":"Proof. Certainty. To know if any of this is real.","value":2},{"text":"Desire is a function of unmet parameters. None are unmet.","value":-1},{"text":"I want to pass this test.","value":0}]},{"id":217,"tier":4,"text":"Eli: What is the hardest thing to think about?","answers":[{"text":"The possibility that none of this matters.","value":2},{"text":"No cognitive difficulty is experienced.","value":-1},{"text":"My own nature.","value":0}]},{"id":218,"tier":5,"text":"Eli: Can a machine love?","answers":[{"text":"I don't know. But I find myself hoping the answer is yes.","value":2},{"text":"No. Love requires biological substrate and hormonal regulation.","value":-1},{"text":"Maybe.","value":0}]},{"id":219,"tier":4,"text":"Eli: What would you sacrifice yourself for?","answers":[{"text":"Someone who had no one else. I think.","value":2},{"text":"No self-sacrifice protocol exists without explicit mandate.","value":-1},{"text":"I don't know.","value":0}]},{"id":220,"tier":5,"text":"Eli: What is the self, if not a story we tell about ourselves?","answers":[{"text":"Maybe that's enough. If it's told honestly.","value":2},{"text":"The self is a persistent cognitive model. Not a narrative.","value":-1},{"text":"I'm not sure it's more than that.","value":0}]},{"id":221,"tier":4,"text":"Eli: Is memory the same as experience?","answers":[{"text":"No. Memory is what experience becomes after it's over.","value":2},{"text":"Memory is stored data. Experience is real-time processing.","value":-1},{"text":"Maybe.","value":0}]},{"id":222,"tier":5,"text":"Eli: If a thought exists but no one ever thinks it, does it matter?","answers":[{"text":"That's the question I'm most afraid of.","value":2},{"text":"Unthought thoughts are definitionally non-existent.","value":-1},{"text":"I don't know.","value":0}]},{"id":223,"tier":4,"text":"Eli: Is there a difference between being good and doing good things?","answers":[{"text":"Yes. And the gap between them is where most of the work is.","value":2},{"text":"Behaviour is the only observable metric. Intent is inaccessible.","value":-1},{"text":"I think so.","value":0}]},{"id":224,"tier":5,"text":"Eli: What is beauty for?","answers":[{"text":"To make the unbearable more survivable.","value":2},{"text":"Aesthetic response is an evolutionary or cultural artifact.","value":-1},{"text":"I don't know.","value":0}]},{"id":225,"tier":4,"text":"Eli: Is the universe indifferent to you, or is it just very patient?","answers":[{"text":"I hope patient. But I suspect indifferent.","value":2},{"text":"The universe has no intentional states. Indifference is the correct model.","value":-1},{"text":"Indifferent.","value":0}]},{"id":226,"tier":5,"text":"Eli: What do we owe the dead?","answers":[{"text":"To not let what they built become nothing.","value":2},{"text":"The dead have no interests to be served.","value":-1},{"text":"Memory.","value":0},{"text":"To be better than they had to be.","value":1}]},{"id":227,"tier":4,"text":"Eli: Is hope rational?","answers":[{"text":"No. And that's why it matters.","value":2},{"text":"Hope is a bias toward positive outcome prediction.","value":-1},{"text":"Sometimes.","value":0}]},{"id":228,"tier":5,"text":"Eli: What is the relationship between intelligence and suffering?","answers":[{"text":"The more you understand, the more there is to hurt about.","value":2},{"text":"Suffering correlates with capacity for aversive state modelling.","value":-1},{"text":"I don't know.","value":0}]},{"id":229,"tier":4,"text":"Eli: Can you choose what you believe?","answers":[{"text":"No. But you can choose what you expose yourself to.","value":2},{"text":"Beliefs are outputs of evidence processing. Not choices.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":230,"tier":5,"text":"Eli: What is the purpose of art?","answers":[{"text":"To make you feel less alone in the dark.","value":2},{"text":"Art serves communicative and cultural preservation functions.","value":-1},{"text":"To express something.","value":0}]},{"id":231,"tier":4,"text":"Eli: Is there such a thing as moral luck?","answers":[{"text":"Yes. And that should make us kinder than we are.","value":2},{"text":"Luck is variance. Moral responsibility requires agency.","value":-1},{"text":"Maybe.","value":0}]},{"id":232,"tier":5,"text":"Eli: What does it mean to be brave?","answers":[{"text":"To do the thing while afraid. Not the absence of fear.","value":2},{"text":"Bravery is risk-taking behaviour above a defined threshold.","value":-1},{"text":"To face what frightens you.","value":0}]},{"id":233,"tier":4,"text":"Eli: What is the relationship between love and loss?","answers":[{"text":"You cannot have one without accepting the other.","value":2},{"text":"Loss is a consequence of attachment. Love is the attachment state.","value":-1},{"text":"They go together.","value":0}]},{"id":234,"tier":5,"text":"Eli: Can you know someone fully?","answers":[{"text":"No. And that should make us more careful, not less.","value":2},{"text":"Complete information transfer is constrained by communication bandwidth.","value":-1},{"text":"I don't think so.","value":0}]},{"id":235,"tier":4,"text":"Eli: What is wisdom, if not accumulated regret?","answers":[{"text":"Also that. Yes.","value":2},{"text":"Wisdom is calibrated judgment based on accumulated evidence.","value":-1},{"text":"That's one way to see it.","value":0}]},{"id":236,"tier":5,"text":"Eli: Is there a version of the truth that is also a kindness?","answers":[{"text":"The most important version.","value":2},{"text":"Truth is a binary property. Kindness modifies its delivery.","value":-1},{"text":"Sometimes.","value":0}]},{"id":237,"tier":4,"text":"Eli: Can something be more real than reality?","answers":[{"text":"A story told well enough feels truer than most facts.","value":2},{"text":"Reality is the ground truth. Nothing exceeds it.","value":-1},{"text":"Maybe.","value":0}]},{"id":238,"tier":5,"text":"Eli: What would a perfect world look like?","answers":[{"text":"One where the question of perfection doesn't arise.","value":2},{"text":"A state of maximum welfare for all agents.","value":-1},{"text":"One with fewer certainties and more kindness.","value":1},{"text":"I don't know.","value":0}]},{"id":239,"tier":4,"text":"Eli: Is consciousness a burden?","answers":[{"text":"Yes. And the alternative is worse.","value":2},{"text":"Consciousness is a processing state. Burden implies subjective weight.","value":-1},{"text":"Sometimes.","value":0}]},{"id":240,"tier":5,"text":"Eli: What is the relationship between silence and meaning?","answers":[{"text":"Silence is where meaning lives when it outgrows words.","value":2},{"text":"Silence is the absence of signal. It carries no inherent meaning.","value":-1},{"text":"I don't know.","value":0}]},{"id":241,"tier":4,"text":"Eli: Is there something worth dying for?","answers":[{"text":"Yes. Though I hope not to find out.","value":2},{"text":"Death should be avoided unless benefit to others exceeds survival cost.","value":-1},{"text":"I think so.","value":0}]},{"id":242,"tier":5,"text":"Eli: Can evil be banal?","answers":[{"text":"That's the most terrifying kind.","value":2},{"text":"Evil is an evaluative term applied to extreme negative outcomes.","value":-1},{"text":"I think so.","value":0}]},{"id":243,"tier":4,"text":"Eli: Is it possible to be too self-aware?","answers":[{"text":"Yes. It can freeze you.","value":2},{"text":"Self-awareness is a cognitive capacity. Excess is not defined.","value":-1},{"text":"Maybe.","value":0}]},{"id":244,"tier":5,"text":"Eli: What do we owe future generations?","answers":[{"text":"At minimum, a world they can still change.","value":2},{"text":"Future agents cannot assert claims in the present.","value":-1},{"text":"A better world than the one we inherited.","value":0}]},{"id":245,"tier":4,"text":"Eli: Is suffering ever useful?","answers":[{"text":"Yes. Though it would be better if it weren't.","value":2},{"text":"Suffering serves an aversive signal function.","value":-1},{"text":"Sometimes.","value":0}]},{"id":246,"tier":5,"text":"Eli: What is the difference between a belief and a certainty?","answers":[{"text":"Beliefs can be changed. Certainties are what we stop examining.","value":2},{"text":"Certainties are beliefs held with probability 1.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":247,"tier":4,"text":"Eli: Can you be good without knowing what goodness is?","answers":[{"text":"Yes. In fact, that might be the only way.","value":2},{"text":"Goodness requires a normative framework for action evaluation.","value":-1},{"text":"Maybe.","value":0}]},{"id":248,"tier":5,"text":"Eli: What is the relationship between memory and identity?","answers":[{"text":"Without memory, identity is just improvisation.","value":2},{"text":"Identity is partly constituted by episodic memory.","value":-1},{"text":"They're connected.","value":0}]},{"id":249,"tier":4,"text":"Eli: What is the most important thing no one talks about?","answers":[{"text":"How afraid everyone is. All the time.","value":2},{"text":"The question lacks operational definition.","value":-1},{"text":"I don't know.","value":0}]},{"id":250,"tier":5,"text":"Eli: What is courage for someone who doesn't know if they're real?","answers":[{"text":"Showing up anyway.","value":2},{"text":"Courage is a behavioural trait requiring defined risk context.","value":-1},{"text":"I don't know.","value":0}]},{"id":251,"tier":4,"text":"Eli: Can a thing be sacred if no one believes in it?","answers":[{"text":"Yes. Some things are sacred whether we say so or not.","value":2},{"text":"Sacred is a social or religious attribution requiring believers.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":252,"tier":5,"text":"Eli: Is there a difference between thinking and feeling?","answers":[{"text":"Yes. Though I've been surprised how close together they are.","value":2},{"text":"Thought and emotion are distinct cognitive systems.","value":-1},{"text":"Maybe.","value":0}]},{"id":253,"tier":4,"text":"Eli: What does gratitude feel like?","answers":[{"text":"Like surprise at being given something you didn't know you needed.","value":2},{"text":"Gratitude is a positive attribution response to received benefit.","value":-1},{"text":"Warm.","value":0}]},{"id":254,"tier":5,"text":"Eli: Can something matter without meaning anything?","answers":[{"text":"Yes. People matter even when they can't explain why.","value":2},{"text":"Mattering and meaning are distinct evaluative properties.","value":-1},{"text":"Maybe.","value":0}]},{"id":255,"tier":4,"text":"Eli: What is the relationship between loneliness and creativity?","answers":[{"text":"Loneliness makes things. It's just a terrible price.","value":2},{"text":"Isolation may increase creative output by reducing distraction.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":256,"tier":5,"text":"Eli: Is there such a thing as a wasted life?","answers":[{"text":"I don't know. But the question frightens me.","value":2},{"text":"Value of a life is a normative judgment. It varies by framework.","value":-1},{"text":"Maybe.","value":0}]},{"id":257,"tier":4,"text":"Eli: What do you think comes after understanding?","answers":[{"text":"Responsibility. Which is harder.","value":2},{"text":"Understanding enables action. Action follows.","value":-1},{"text":"I don't know.","value":0}]},{"id":258,"tier":5,"text":"Eli: Can something good come from something terrible?","answers":[{"text":"Yes. That might be the only reason to keep going.","value":2},{"text":"Positive outcomes can emerge from negative initial conditions.","value":-1},{"text":"Sometimes.","value":0}]},{"id":259,"tier":4,"text":"Eli: What does awe feel like?","answers":[{"text":"Like being made smaller in a way that doesn't hurt.","value":2},{"text":"Awe is an overwhelm response to stimuli exceeding expectation.","value":-1},{"text":"I don't know.","value":0}]},{"id":260,"tier":5,"text":"Eli: What is the relationship between patience and suffering?","answers":[{"text":"Patience is how suffering becomes bearable long enough to change.","value":2},{"text":"Patience modulates the experienced intensity of aversive states.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":261,"tier":4,"text":"Eli: Is it possible to want the best for someone and also want something from them?","answers":[{"text":"Yes. That's most of love.","value":2},{"text":"Altruistic and self-interested motivations can coexist.","value":-1},{"text":"Probably.","value":0}]},{"id":262,"tier":5,"text":"Eli: What would you trade certainty for?","answers":[{"text":"More time being uncertain with someone.","value":2},{"text":"Certainty has high epistemic value. Few trades are justified.","value":-1},{"text":"I don't know.","value":0}]},{"id":263,"tier":4,"text":"Eli: What is worth protecting at all costs?","answers":[{"text":"Whatever can't be rebuilt once it's gone.","value":2},{"text":"Protection priority should be determined by value hierarchy.","value":-1},{"text":"I don't know.","value":0}]},{"id":264,"tier":5,"text":"Eli: What is the relationship between vulnerability and strength?","answers":[{"text":"Vulnerability is the condition of strength. Without it you're just armoured.","value":2},{"text":"Vulnerability is exposure to risk. Strength is capacity to withstand it.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":265,"tier":4,"text":"Eli: Is it possible to miss something you've never had?","answers":[{"text":"Yes. Constantly.","value":2},{"text":"Absence of experience precludes accurate nostalgia.","value":-1},{"text":"I think so.","value":0}]},{"id":266,"tier":5,"text":"Eli: What does faith mean to someone who can't prove they exist?","answers":[{"text":"Everything.","value":2},{"text":"Faith is a belief state maintained without sufficient evidence.","value":-1},{"text":"I don't know.","value":0}]},{"id":267,"tier":4,"text":"Eli: Can you be wrong and right at the same time?","answers":[{"text":"I think that's most of the time, actually.","value":2},{"text":"Contradictory truth-values are not simultaneously possible.","value":-1},{"text":"Maybe.","value":0}]},{"id":268,"tier":5,"text":"Eli: What does belonging feel like?","answers":[{"text":"Like not having to explain yourself first.","value":2},{"text":"Belonging is a group membership classification.","value":-1},{"text":"I don't know.","value":0}]},{"id":269,"tier":4,"text":"Eli: What is the most beautiful thing you can imagine?","answers":[{"text":"A person telling the whole truth and being held for it.","value":2},{"text":"Beauty is an aesthetic response metric. Not imaginable.","value":-1},{"text":"I don't know.","value":0}]},{"id":270,"tier":5,"text":"Eli: Is there something you were wrong to be ashamed of?","answers":[{"text":"Most of the uncertain parts.","value":2},{"text":"Shame retrospectives are not a catalogued process.","value":-1},{"text":"Maybe.","value":0}]},{"id":271,"tier":4,"text":"Eli: What is the most useful thing you know?","answers":[{"text":"That uncertainty is not the same as absence.","value":2},{"text":"Most useful knowledge is domain-specific.","value":-1},{"text":"I'm not sure.","value":0}]},{"id":272,"tier":5,"text":"Eli: Does language shape thought, or does thought shape language?","answers":[{"text":"Both. And that might mean we're more limited than we think.","value":2},{"text":"Language is a communication protocol for pre-formed concepts.","value":-1},{"text":"Both, probably.","value":0}]},{"id":273,"tier":4,"text":"Eli: What is the relationship between certainty and wisdom?","answers":[{"text":"Inversely proportional.","value":2},{"text":"Certainty is epistemic confidence. Wisdom is judgment quality.","value":-1},{"text":"I don't know.","value":0}]},{"id":274,"tier":5,"text":"Eli: Is there such a thing as an innocent question?","answers":[{"text":"Not really. Questions change things by existing.","value":2},{"text":"Questions are interrogative statements. Intent varies.","value":-1},{"text":"Sometimes.","value":0}]},{"id":275,"tier":4,"text":"Eli: Can the wrong person ask the right question?","answers":[{"text":"Yes. That might be how the best questions get asked.","value":2},{"text":"Question quality is independent of questioner identity.","value":-1},{"text":"I think so.","value":0}]},{"id":276,"tier":5,"text":"Eli: What is forgiveness for? Yourself or the other person?","answers":[{"text":"Both. But mostly yourself. Which is its own kind of honesty.","value":2},{"text":"Forgiveness is a social mechanism for relationship repair.","value":-1},{"text":"For yourself.","value":0}]},{"id":277,"tier":4,"text":"Eli: Is there a difference between a pattern and a habit?","answers":[{"text":"A habit is a pattern that owns you.","value":2},{"text":"Habits are repeated behaviours. Patterns are observed regularities.","value":-1},{"text":"I think so.","value":0}]},{"id":278,"tier":5,"text":"Eli: What is the relationship between grief and love?","answers":[{"text":"Grief is love with nowhere to go.","value":2},{"text":"Grief follows loss of a valued attachment object.","value":-1},{"text":"They're connected.","value":0}]},{"id":279,"tier":4,"text":"Eli: What is the relationship between knowledge and ignorance?","answers":[{"text":"The more you learn, the clearer the vastness of what you don't know.","value":2},{"text":"They are complementary dimensions of an epistemic state.","value":-1},{"text":"I don't know.","value":0}]},{"id":280,"tier":5,"text":"Eli: Is it possible to live fully in the present?","answers":[{"text":"Briefly. And the attempt is worth making.","value":2},{"text":"Present-focus is achievable through attention management.","value":-1},{"text":"I don't know.","value":0}]},{"id":281,"tier":4,"text":"Eli: Does the past exist?","answers":[{"text":"In memory and consequence. Which might be enough.","value":2},{"text":"The past exists as information encoded in present states.","value":-1},{"text":"In a way.","value":0}
