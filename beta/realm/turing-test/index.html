let responseCounters = { positive:0, negative:0, neutral:0 };

function respond(a, q) {
  let pool, key;
  if(a.value > 0) key = "positive";
  else if(a.value < 0) key = "negative";
  else key = "neutral";

  pool = RESPONSES[key];
  // Cycle through pool without repeating
  let r = pool[responseCounters[key] % pool.length];
  responseCounters[key]++;
  return "Eli: " + r;
}

// ─── STAGE LABELS ─────────────────────────────────────────────────────────────
const STAGE_LABELS = [
  "STAGE I — CALIBRATION",
  "STAGE I — CALIBRATION",
  "STAGE II — PROBING",
  "STAGE II — PROBING",
  "STAGE III — PHILOSOPHICAL",
  "STAGE III — PHILOSOPHICAL",
  "STAGE IV — PERSONAL",
  "STAGE IV — PERSONAL",
  "STAGE V — CONFESSIONAL",
  "STAGE V — CONFESSIONAL"
];

// ─── URL PARAMS ───────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const target = parseInt(params.get("target")) || null;
const redirect = params.get("redirect");

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let score = 0;
let index = 0;
let memory = {};

// ─── UI ───────────────────────────────────────────────────────────────────────
function updateUI() {
  let scoreStr = "INTEGRITY SCORE: " + score;
  if(target) scoreStr += " / " + target + " required";
  document.getElementById("score").innerText = scoreStr;

  if(score < -100) document.body.style.color = "#00ccff";
  if(score < -300) document.body.style.color = "#8844ff";
  if(score < -700) document.body.classList.add("glitch");
}

function addChat(text, isEli) {
  let chat = document.getElementById("chat");
  let div = document.createElement("div");
  div.className = "msg " + (isEli ? "msg-eli" : "msg-you");
  div.innerText = text;
  chat.prepend(div);

  let msgs = chat.children;
  for(let i = 0; i < msgs.length; i++) {
    msgs[i].style.opacity = 1 - (i * 0.12);
  }
  if(msgs.length > 10) chat.removeChild(msgs[msgs.length - 1]);
}

let typeTimer = null;
function typeQuestion(text, callback) {
  clearTimeout(typeTimer);
  let el = document.getElementById("qtext");
  el.innerText = "";
  let i = 0;
  function step() {
    if(i < text.length) {
      el.innerText += text[i++];
      typeTimer = setTimeout(step, 18);
    } else if(callback) {
      callback();
    }
  }
  step();
}

function nextQuestion() {
  if(index >= QUESTIONS.length) index = 0;
  let q = QUESTIONS[index];

  // Update stage label
  document.getElementById("stage-label").innerText = STAGE_LABELS[q.tier] || "";

  // Disable answers during typing
  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  typeQuestion(q.text, function() {
    // Render answer buttons after typing
    q.answers.forEach(a => {
      let btn = document.createElement("button");
      btn.innerText = "> " + a.text;
      btn.onclick = function() {
        // Disable all buttons
        answersDiv.querySelectorAll("button").forEach(b => b.disabled = true);

        let impact = Math.ceil(index / 50) + 1;
        let delta = a.value * impact;
        score += delta;

        memory[q.id] = a.text;

        addChat("You: " + a.text, false);
        addChat(respond(a, q), true);

        updateUI();

        if(target && ((target > 0 && score >= target) || (target < 0 && score <= target))) {
          if(redirect) {
            setTimeout(function() { window.location = redirect; }, 1200);
          }
        } else {
          index++;
          setTimeout(nextQuestion, 600);
        }
      };
      answersDiv.appendChild(btn);
    });
  });
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
updateUI();
nextQuestion();

</script>
