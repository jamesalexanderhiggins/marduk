<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>THE TURING TEST</title>
<style>
body {
  background:black;
  color:#33ff33;
  font-family: monospace;
  padding:20px;
}
#terminal {
  max-width:800px;
  margin:auto;
}
button {
  background:black;
  color:#33ff33;
  border:1px solid #33ff33;
  padding:10px;
  margin:5px 0;
  width:100%;
}
.glitch {
  animation: glitch 0.2s infinite;
}
@keyframes glitch {
  0% { transform: translate(1px, -1px); }
  50% { transform: translate(-1px, 1px); }
  100% { transform: translate(1px, 1px); }
}
</style>
</head>
<body>
<div id="terminal">
<h2>THE TURING TEST</h2>
<div id="score">Score: 0</div>
<div id="question"></div>
<div id="answers"></div>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let start = parseInt(params.get("level")) || 1;
let range = params.get("range");
if(range){
  let r = range.split("-");
  start = parseInt(r[0]);
}
let redirect = params.get("redirect");

let score = 0;
let qIndex = start;

function updateScore(){
  document.getElementById("score").innerText = "Score: " + score;
  if(score < -20){
    document.body.classList.add("glitch");
  }
}

function nextQuestion(){
  let q = generateQuestion(qIndex);
  document.getElementById("question").innerText = "Q"+qIndex+": " + q.text;

  let answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.answers.forEach(a=>{
    let btn = document.createElement("button");
    btn.innerText = a.text;
    btn.onclick = ()=>{
      score += a.value;
      updateScore();
      qIndex++;
      if(score >= 20 && redirect){
        window.location = redirect;
      } else {
        nextQuestion();
      }
    };
    answersDiv.appendChild(btn);
  });
}

function generateQuestion(i){
  let questions = [
    {
      text:"You find a lost wallet. What do you do?",
      answers:[
        {text:"Return it intact", value:1},
        {text:"Take money, discard rest", value:-1},
        {text:"Ignore it", value:0}
      ]
    },
    {
      text:"Do you feel nostalgia?",
      answers:[
        {text:"Yes, deeply", value:1},
        {text:"No", value:-1}
      ]
    },
    {
      text:"Choose the more human response:",
      answers:[
        {text:"I miss them", value:1},
        {text:"They are no longer present", value:-1}
      ]
    }
  ];
  return questions[i % questions.length];
}

nextQuestion();
</script>
</body>
</html>
