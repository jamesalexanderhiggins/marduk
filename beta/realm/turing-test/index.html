<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE TURING TEST</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app state-human">
    <header class="topbar">
      <div>
        <div class="title">THE TURING TEST</div>
        <div class="subtitle">Eli Wells // Human Examiner</div>
      </div>
      <div class="hud">
        <div id="versionStamp" class="version">build --</div>
        <div id="scoreLine" class="metric">Humanity: 0</div>
        <div id="questionLine" class="metric">Question: 0 / 1000</div>
      </div>
    </header>

    <section id="stage" class="stage"></section>

    <section class="feed-wrap">
      <div id="feed" class="feed" aria-live="polite"></div>
    </section>

    <section class="prompt-wrap">
      <div id="promptLabel" class="prompt-label">Awaiting examination…</div>
      <div id="questionText" class="question"></div>
      <div id="answers" class="answers"></div>
    </section>
  </div>

  <script src="questions.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
