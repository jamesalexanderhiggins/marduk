<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Realm v10.0.0 | 2026-04-27 | realm.json data source | SKM: type superkudramarduk -->
<title>Marduk's Map — The Realm v10.0.0</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:Georgia,'Times New Roman',serif;background:#050505;color:#e0d8c8;
  display:flex;flex-direction:column;height:100vh;transition:background 0.6s ease;}

/* ── TOP BAR ── */
#top-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:rgba(0,0,0,0.88);border-bottom:1px solid var(--accent,#8b6914);
  font-size:12px;letter-spacing:1px;z-index:100;}
#coords{color:var(--accent,#8b6914);font-size:11px;opacity:0.8;white-space:nowrap;}
#path-label{flex:1;text-align:center;font-size:10px;letter-spacing:3px;
  text-transform:uppercase;color:var(--accent,#8b6914);opacity:0.7;}
#keys-display{display:flex;gap:4px;align-items:center;}
.key-badge{background:var(--accent,#8b6914);color:#000;border-radius:3px;
  padding:1px 5px;font-size:10px;font-weight:bold;letter-spacing:0.5px;}
.top-btn{padding:4px 10px;background:transparent;border:1px solid var(--accent,#8b6914);
  color:var(--accent,#8b6914);border-radius:4px;cursor:pointer;font-size:11px;
  letter-spacing:1px;text-decoration:none;white-space:nowrap;transition:all 0.2s;}
.top-btn:hover{background:var(--accent,#8b6914);color:#000;}
#exit-skm-btn{display:none;border-color:#c084fc!important;color:#f0abfc!important;
  animation:skm-pulse 2s ease-in-out infinite;}
@keyframes skm-pulse{0%,100%{box-shadow:0 0 6px rgba(192,132,252,0.4);}50%{box-shadow:0 0 18px rgba(192,132,252,0.8);}}
body.skm-active #exit-skm-btn{display:block;}

/* ── TILE OUTER ── */
#tile-outer{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}
#emily-bg,#manga-bg,#manga-fig,#manga-txt{position:absolute;inset:0;background-size:cover;
  background-position:center;background-repeat:no-repeat;pointer-events:none;opacity:0;transition:opacity 1s ease;}
#manga-bg{filter:blur(2px);transform:scale(1.05);}
body.manga-active #manga-bg,body.manga-active #manga-fig,body.manga-active #manga-txt{opacity:1;}
#emily-bg{opacity:0;transition:opacity 1s ease;
  background:radial-gradient(ellipse at 50% 120%,#3a0050 0%,#1a0030 35%,#080015 65%,#020008 100%);}
body.emily-path #emily-bg{opacity:1;}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:float-up linear infinite;opacity:0;}
@keyframes float-up{0%{transform:translateY(0) scale(1);opacity:0;}10%{opacity:0.8;}90%{opacity:0.3;}100%{transform:translateY(-100vh) scale(0.3);opacity:0;}}
.sprite{position:absolute;font-size:18px;animation:sprite-pulse 2s ease-in-out infinite alternate;pointer-events:none;opacity:0.7;}
@keyframes sprite-pulse{from{opacity:0.4;transform:scale(0.9);}to{opacity:0.9;transform:scale(1.1);}}

/* ── TILE CONTENT ── */
#tile-content{position:relative;z-index:10;flex:1;overflow-y:auto;padding:22px 26px 14px;display:flex;flex-direction:column;gap:8px;}
#tile-name{font-size:22px;font-weight:bold;letter-spacing:2px;color:var(--text,#e8d5a3);
  text-shadow:0 0 20px var(--glow,rgba(139,105,20,0.5));margin-bottom:8px;display:flex;align-items:center;gap:10px;}
#tile-name .icon{font-size:26px;}
#tile-body{line-height:1.8;font-size:15px;color:var(--text,#e8d5a3);}
#tile-body h2{font-size:20px;margin-bottom:10px;color:var(--text,#e8d5a3);}
#tile-body h3{font-size:16px;margin:12px 0 6px;color:var(--accent,#8b6914);}
#tile-body p{margin-bottom:10px;}
#tile-body ul{margin:6px 0 10px 20px;}
#tile-body ul li{margin-bottom:4px;}
#tile-body hr{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:16px 0;}
.marduk-voice{font-style:italic;color:var(--accent,#8b6914);opacity:0.85;
  padding:8px 12px;border-left:2px solid var(--accent,#8b6914);margin:8px 0;font-size:14px;line-height:1.7;}
.story-excerpt{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:6px;padding:16px 20px;line-height:1.9;font-size:14.5px;}
.attribution{text-align:right;font-style:italic;opacity:0.5;font-size:12px;margin-top:4px;}
.teleport-list{list-style:none;padding:0;margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.teleport-list li button{width:100%;text-align:left;padding:8px 12px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:6px;
  color:var(--text,#e8d5a3);cursor:pointer;font-family:Georgia,serif;font-size:13px;transition:all 0.2s;}
.teleport-list li button:hover{background:rgba(255,255,255,0.1);border-color:var(--accent,#8b6914);}
.key-collect{margin-top:12px;padding:10px 16px;background:rgba(255,215,0,0.08);
  border:1px solid gold;border-radius:6px;font-size:14px;}
.key-collect button{margin-left:10px;padding:4px 10px;background:gold;border:none;
  border-radius:4px;cursor:pointer;font-weight:bold;color:#000;}
body.skm-active #tile-outer{cursor:cell;}
body.skm-active #tile-outer::after{content:'✦ DOUBLE-TAP TO EDIT';
  position:absolute;bottom:8px;right:12px;font-size:8px;letter-spacing:2px;
  color:rgba(192,132,252,0.4);pointer-events:none;text-transform:uppercase;z-index:30;}

/* ── NAV ── */
#nav-area{flex-shrink:0;position:relative;z-index:20;background:rgba(0,0,0,0.7);
  border-top:1px solid rgba(255,255,255,0.06);padding:10px 8px;
  display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;align-items:center;}
.nav-btn{padding:8px 6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  border-radius:6px;cursor:pointer;font-family:Georgia,serif;font-size:13px;
  color:var(--text,#e8d5a3);text-align:center;transition:all 0.2s;min-height:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;}
.nav-btn.open{border-color:var(--accent,#8b6914);color:var(--accent,#8b6914);}
.nav-btn.space{border-color:#303030;color:#404040;font-style:italic;}
.nav-btn.challenge{border-color:#5050c0;color:#8080e0;}
.nav-btn.closed{display:none;}
.nav-btn:hover:not(.space):not(.closed){background:rgba(255,255,255,0.1);transform:scale(1.02);}
.nav-btn .dir{font-size:18px;line-height:1;}
.nav-btn .label{font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:0.8;max-width:80px;text-align:center;}
#nav-north{grid-column:2;grid-row:1;}
#nav-west{grid-column:1;grid-row:2;}
#nav-info{grid-column:2;grid-row:2;text-align:center;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.2);}
#nav-east{grid-column:3;grid-row:2;}
#nav-south{grid-column:2;grid-row:3;}
.exit-warning{position:absolute;font-size:10px;color:#ff4040;letter-spacing:1px;
  animation:flash-warn 1s ease-in-out infinite alternate;pointer-events:none;}
@keyframes flash-warn{from{opacity:0.3;}to{opacity:1;}}

/* ── NOTIFICATION ── */
#notification{position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,0.96);border:1px solid var(--accent,#8b6914);border-radius:8px;
  padding:12px 20px;font-size:14px;color:var(--accent,#8b6914);z-index:200;
  display:none;text-align:center;max-width:340px;pointer-events:none;}

/* ── SKM PANEL ── */
#skm-panel{position:fixed;top:44px;right:0;bottom:0;width:min(460px,100vw);z-index:400;
  background:rgba(5,4,14,0.98);border-left:1px solid rgba(192,132,252,0.25);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);pointer-events:none;}
#skm-panel.open{transform:translateX(0);pointer-events:auto;}
#skm-panel-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 8px;border-bottom:1px solid rgba(192,132,252,0.15);}
#skm-panel-title{font-size:9px;letter-spacing:3px;color:#f0abfc;text-transform:uppercase;}
#skm-panel-close{font-size:9px;letter-spacing:2px;color:rgba(201,168,76,0.5);background:transparent;
  border:1px solid rgba(201,168,76,0.2);padding:4px 10px;cursor:pointer;border-radius:3px;}
#skm-panel-close:hover{color:#d8a808;border-color:#d8a808;}
#skm-panel-scroll{flex:1 1 auto;min-height:0;overflow-y:scroll;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px 28px;
  scrollbar-width:thin;scrollbar-color:rgba(192,132,252,0.5) rgba(10,5,20,0.8);}
#skm-panel-scroll::-webkit-scrollbar{width:7px;}
#skm-panel-scroll::-webkit-scrollbar-track{background:rgba(10,5,20,0.8);}
#skm-panel-scroll::-webkit-scrollbar-thumb{background:rgba(192,132,252,0.55);border-radius:4px;}
#skm-panel-scroll input,#skm-panel-scroll select,#skm-panel-scroll textarea{
  box-sizing:border-box;width:100%;background:rgba(0,0,0,0.55);
  border:1px solid rgba(201,168,76,0.2);color:#e0d8c8;font-size:13px;
  padding:6px 8px;border-radius:3px;font-family:Georgia,serif;}
#skm-panel-scroll input:focus,#skm-panel-scroll select:focus,#skm-panel-scroll textarea:focus{
  outline:none;border-color:rgba(201,168,76,0.5);}
.skm-section-label{font-size:7px;letter-spacing:3px;color:rgba(192,132,252,0.45);
  text-transform:uppercase;margin-bottom:5px;margin-top:14px;}
.skm-row{margin-bottom:10px;}
.skm-type-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.skm-type-btn{font-size:9px;letter-spacing:1px;padding:5px 10px;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid rgba(201,168,76,0.2);color:rgba(201,168,76,0.4);transition:all 0.15s;}
.skm-type-btn.active,.skm-type-btn:hover{background:rgba(201,168,76,0.12);border-color:#d8a808;color:#d8a808;}
.skm-wysiwyg{min-height:80px;text-align:left;line-height:1.7;background:rgba(0,0,0,0.55);
  border:1px solid rgba(201,168,76,0.2);color:#e0d8c8;font-size:13px;padding:8px;
  border-radius:3px;font-family:Georgia,serif;}
.skm-wysiwyg:focus{outline:none;border-color:rgba(201,168,76,0.5);}
.skm-toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.skm-tb-btn{font-size:12px;padding:3px 8px;cursor:pointer;background:transparent;
  border:1px solid rgba(201,168,76,0.15);color:rgba(201,168,76,0.5);border-radius:2px;}
.skm-tb-btn:hover{border-color:#d8a808;color:#d8a808;}
.skm-actions{display:flex;gap:8px;margin-top:14px;}
.skm-save-btn{flex:1;padding:9px;cursor:pointer;border-radius:3px;font-size:9px;
  letter-spacing:2px;text-transform:uppercase;background:rgba(201,168,76,0.12);
  border:1px solid #d8a808;color:#d8a808;transition:all 0.2s;}
.skm-save-btn:hover{background:rgba(201,168,76,0.25);}
.skm-export-btn{padding:9px 14px;cursor:pointer;border-radius:3px;font-size:9px;
  letter-spacing:2px;text-transform:uppercase;background:transparent;
  border:1px solid rgba(201,168,76,0.3);color:rgba(201,168,76,0.5);transition:all 0.2s;}
.skm-export-btn:hover{border-color:#d8a808;color:#d8a808;}
.skm-note{font-size:11px;color:rgba(201,168,76,0.3);font-style:italic;margin-top:8px;}
.skm-gate-row{margin-bottom:10px;padding:8px;border:1px solid rgba(192,132,252,0.1);
  border-radius:4px;background:rgba(192,132,252,0.03);}
.skm-gate-label{font-size:8px;letter-spacing:2px;color:rgba(192,132,252,0.5);margin-bottom:5px;}
.skm-gate-fields{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.skm-gate-fields select{flex:0 0 110px;}
.skm-gate-fields input[type=number]{flex:0 0 60px;}
.skm-gate-fields input[type=text]{flex:1;min-width:80px;}
.skm-gate-btn{font-size:9px;padding:5px 8px;cursor:pointer;border-radius:2px;
  background:rgba(192,132,252,0.1);border:1px solid rgba(192,132,252,0.25);color:#f0abfc;
  white-space:nowrap;transition:all 0.15s;}
.skm-gate-btn:hover{background:rgba(192,132,252,0.25);}
.skm-gate-clear{font-size:9px;padding:5px 8px;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid rgba(255,80,80,0.25);color:rgba(255,100,100,0.6);
  white-space:nowrap;transition:all 0.15s;}
.skm-gate-clear:hover{border-color:#ff4040;color:#ff6060;}

/* ── CHALLENGE OVERLAY ── */
#challenge-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#challenge-overlay.active{display:flex;}
#challenge-box{background:#0a0818;border:1px solid #5050c0;border-radius:12px;
  padding:28px;max-width:460px;width:100%;text-align:center;}
#challenge-box h3{font-size:18px;color:#a0a0e8;margin-bottom:12px;}
#challenge-box p{font-size:14px;line-height:1.7;color:#c0c0e0;margin-bottom:16px;}
#challenge-box .ch-btns{display:flex;flex-direction:column;gap:8px;}
#challenge-box button{padding:10px 16px;border-radius:6px;border:1px solid #6060c0;
  background:rgba(90,90,200,0.15);color:#a0a0e8;cursor:pointer;font-family:Georgia,serif;
  font-size:13px;transition:all 0.2s;}
#challenge-box button.primary{background:#5050c0;color:#fff;}
#challenge-box button:hover{background:rgba(90,90,200,0.4);}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:#050505;display:flex;align-items:center;
  justify-content:center;z-index:500;flex-direction:column;gap:16px;font-size:13px;
  letter-spacing:3px;color:rgba(139,105,20,0.7);text-transform:uppercase;}
#loading .spinner{width:32px;height:32px;border:2px solid rgba(139,105,20,0.2);
  border-top-color:#8b6914;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:480px){
  #tile-content{padding:14px 14px 10px;}
  #tile-name{font-size:18px;}
  #tile-body{font-size:14px;}
  .nav-btn{min-height:40px;}
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span>Loading the Realm…</span></div>

<div id="top-bar">
  <a class="top-btn" id="map-btn" href="map.html">🗺 MAP</a>
  <span id="path-label">The Realm</span>
  <span id="coords">(0, 0)</span>
  <div id="keys-display"></div>
  <button id="exit-skm-btn" onclick="deactivateSKM()" title="Exit SuperKudraMarduk">✦ EXIT SKM</button>
</div>

<div id="tile-outer">
  <div id="emily-bg"></div>
  <div id="manga-bg"></div>
  <div id="manga-fig"></div>
  <div id="manga-txt"></div>
  <div id="particles"></div>
  <div id="tile-content">
    <div id="tile-name"><span class="icon" id="tile-icon"></span><span id="tile-name-text"></span></div>
    <div id="tile-body"></div>
  </div>
</div>

<div id="nav-area">
  <button id="nav-north" class="nav-btn closed" onclick="tryNavigate(0,1)">
    <span class="dir">↑</span><span class="label" id="nav-n-label">North</span>
  </button>
  <div id="nav-info"></div>
  <button id="nav-west"  class="nav-btn closed" onclick="tryNavigate(-1,0)">
    <span class="dir">←</span><span class="label" id="nav-w-label">West</span>
  </button>
  <button id="nav-east"  class="nav-btn closed" onclick="tryNavigate(1,0)">
    <span class="dir">→</span><span class="label" id="nav-e-label">East</span>
  </button>
  <button id="nav-south" class="nav-btn closed" onclick="tryNavigate(0,-1)">
    <span class="dir">↓</span><span class="label" id="nav-s-label">South</span>
  </button>
</div>

<div id="notification"></div>

<div id="skm-panel">
  <div id="skm-panel-head">
    <span id="skm-panel-title">✦ SKM EDITOR</span>
    <button id="skm-panel-close" onclick="closeSkmPanel()">✕ CLOSE</button>
  </div>
  <div id="skm-panel-scroll"></div>
</div>

<div id="challenge-overlay">
  <div id="challenge-box">
    <h3 id="ch-title"></h3>
    <p id="ch-desc"></p>
    <div class="ch-btns">
      <button class="primary" id="ch-start-btn">Begin Challenge</button>
      <button onclick="closeChallengeOverlay()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// PATH COLOURS (local — no JSON dependency)
// ═══════════════════════════════════════════════════
const PATH_COLORS = {
  emily:     {bg:'#0d0415',text:'#d4aae8',accent:'#9b3dc8',border:'#5a1a7a',glow:'rgba(140,50,200,0.4)'},
  jake:      {bg:'#120800',text:'#f0d098',accent:'#b05a18',border:'#6a2a05',glow:'rgba(160,80,20,0.4)'},
  delacroix: {bg:'#030a05',text:'#a8d8a8',accent:'#2a8a4a',border:'#103820',glow:'rgba(40,130,70,0.4)'},
  xan:       {bg:'#040810',text:'#c8dce8',accent:'#4a9ab0',border:'#153550',glow:'rgba(70,150,180,0.4)'},
  gus:       {bg:'#02020f',text:'#aabae8',accent:'#2a3acc',border:'#080a50',glow:'rgba(40,60,200,0.4)'},
  eli:       {bg:'#03100d',text:'#9aeae0',accent:'#18b09a',border:'#062820',glow:'rgba(20,170,150,0.4)'},
  olivia:    {bg:'#100408',text:'#f0b8c8',accent:'#b02a5a',border:'#4a0818',glow:'rgba(180,40,90,0.4)'},
  marduk:    {bg:'#010108',text:'#eed898',accent:'#d8a808',border:'#3a2800',glow:'rgba(215,168,8,0.5)'},
  author:    {bg:'#080100',text:'#e8a0a0',accent:'#a01818',border:'#3a0505',glow:'rgba(160,24,24,0.4)'},
  central:   {bg:'#0d0905',text:'#e8d5a3',accent:'#8b6914',border:'#2c1810',glow:'rgba(139,105,20,0.4)'},
  cave:      {bg:'#080500',text:'#d4a840',accent:'#c87010',border:'#4a2000',glow:'rgba(200,112,16,0.5)'},
  blank:     {bg:'#050505',text:'#303030',accent:'#181818',border:'#0c0c0c',glow:'rgba(20,20,20,0.2)'},
};

// ═══════════════════════════════════════════════════
// STATE — localStorage helpers
// ═══════════════════════════════════════════════════
const LS = {
  get visited()    { try{return new Set(JSON.parse(localStorage.getItem('mm_visited')||'[]'));}catch{return new Set();} },
  get keys()       { try{return new Set(JSON.parse(localStorage.getItem('mm_keys')||'[]'));}catch{return new Set();} },
  get challenges() { try{return new Set(JSON.parse(localStorage.getItem('mm_ch')||'[]'));}catch{return new Set();} },
  get kudra()      { return localStorage.getItem('mm_kudra')==='1'; },
  get last()       { return localStorage.getItem('mm_last')||'0,0'; },
  addVisited(x,y)  { const v=this.visited; v.add(`${x},${y}`); localStorage.setItem('mm_visited',JSON.stringify([...v])); },
  addKey(k)        { const ks=this.keys; ks.add(k); localStorage.setItem('mm_keys',JSON.stringify([...ks])); },
  solveChallenge(id){ const ch=this.challenges; ch.add(id); localStorage.setItem('mm_ch',JSON.stringify([...ch])); },
  setLast(x,y)    { localStorage.setItem('mm_last',`${x},${y}`); },
};

// ═══════════════════════════════════════════════════
// REALM — loaded from realm.json
// ═══════════════════════════════════════════════════
let REALM = null;

const params = new URLSearchParams(location.search);
let curX = parseInt(params.get('x') ?? LS.last.split(',')[0], 10) || 0;
let curY = parseInt(params.get('y') ?? LS.last.split(',')[1], 10) || 0;

// ── Tile access ──────────────────────────────────
function getTile(x, y) {
  if (!REALM) return null;
  const base = REALM.tiles[`${x},${y}`] || {};
  // Apply localStorage SKM overrides on top
  const ov = skmLoadOverrides();
  const patch = ov[`${x},${y}`] || {};
  return Object.assign({x, y, name:'Empty Space', emoji:'·', type:'blank'}, base, patch);
}

function getGateData(x, y, dir) {
  if (!REALM) return null;
  // SKM override first
  const ov = skmLoadOverrides();
  const ovKey = `${x},${y}:${dir}`;
  if (ov._gates && ov._gates[ovKey]) return ov._gates[ovKey];
  return (REALM.gates && REALM.gates[ovKey]) || null;
}

function tileColor(tile) {
  const path = tile.on_path?.[0] || tile.type;
  return PATH_COLORS[path] || PATH_COLORS.blank;
}

// ── Gate passability ─────────────────────────────
// Returns: 'open' | 'closed' | 'space' | 'kudra' | {type:'challenge',...}
function resolveGate(x, y, dir) {
  const tile = getTile(x, y);
  const gData = getGateData(x, y, dir);

  // Kudra special north gate from (0,0)
  if (x===0 && y===0 && dir==='N') {
    if (LS.kudra) return 'open';
    if (gData) return resolveGateData(gData);
    return {type:'challenge', game:'quiz', id:'marduk-oracle', label:'Oracle of Marduk — complete the quiz', kudra_bypass:true};
  }

  if (!gData) return 'open'; // no gate defined = open
  return resolveGateData(gData);
}

function resolveGateData(g) {
  if (g.type === 'closed') return 'closed';
  if (g.type === 'space')  return 'space';
  if (g.type === 'kudra')  return LS.kudra ? 'open' : 'closed';
  if (g.kudra_bypass && LS.kudra) return 'open';
  return {type:'challenge', game: g.type, level: g.level||null, id: `${g.type}-${Math.random().toString(36).slice(2,6)}`, label: g.title||'Challenge', target: g.range||null};
}

function applyTheme(tile) {
  const c = tileColor(tile);
  const r = document.documentElement.style;
  r.setProperty('--bg',     c.bg);
  r.setProperty('--text',   c.text);
  r.setProperty('--accent', c.accent);
  r.setProperty('--border', c.border);
  r.setProperty('--glow',   c.glow);
  document.body.style.background = c.bg;
  const path = tile.on_path?.[0] || tile.type || '';
  document.getElementById('path-label').textContent = path.toUpperCase();
  document.getElementById('coords').textContent = `(${curX}, ${curY})`;
  document.title = `${tile.name||'Empty Space'} — Marduk's Map`;
  document.body.classList.toggle('emily-path', path === 'emily');

  // Manga
  const isManga = tile.type === 'manga' && tile.manga;
  document.body.classList.toggle('manga-active', isManga);
  if (isManga) {
    const {path:mp, n} = tile.manga;
    const base = `manga/manga-${mp}-${n}`;
    document.getElementById('manga-bg').style.backgroundImage  = `url('${base}-bg.png')`;
    document.getElementById('manga-fig').style.backgroundImage = `url('${base}-fig.png')`;
    document.getElementById('manga-txt').style.backgroundImage = `url('${base}-txt.png')`;
    initParallax();
  } else {
    ['manga-bg','manga-fig','manga-txt'].forEach(id => document.getElementById(id).style.backgroundImage='');
  }
}

function renderTile(tile) {
  document.getElementById('tile-icon').textContent = tile.emoji || '';
  document.getElementById('tile-name-text').textContent = tile.name || 'Empty Space';

  let body = '';

  if (tile.type === 'quiz' && tile.question_id) {
    body = renderQuizTile(tile.question_id, tile);
  } else if (tile.type === 'teleport-hub' && tile.teleports) {
    body = (tile.lore||'') + renderTeleportList(tile.teleports);
  } else if (tile.key_id && !LS.keys.has(tile.key_id)) {
    // Auto-collect key
    LS.addKey(tile.key_id);
    renderKeys();
    showNotification(`🗝 ${REALM.key_defs?.[tile.key_id]?.name || 'Key '+tile.key_id} collected!`);
    body = tile.lore || `<p>You have found Key ${tile.key_id}.</p>`;
  } else {
    body = tile.lore || tile.description || `<p class="marduk-voice" style="opacity:0.4;">Empty space. Stars in every direction.</p>`;
  }

  // Teleport button for secret door
  if (tile.teleport_west) {
    body += `<div class="teleport-list"><li><button onclick="navigate(${tile.teleport_west[0]},${tile.teleport_west[1]})">→ Go to Threshold of Jake's House</button></li></div>`;
  }

  // Sprites for late Emily manga tiles
  if (tile.sprites) addSprites();
  else document.getElementById('particles').innerHTML = '';

  document.getElementById('tile-body').innerHTML = body;
}

function renderQuizTile(qid, tile) {
  const q = REALM.questions?.[qid];
  if (!q) return `<p>Question ${qid} — coming soon.</p>`;
  const done = LS.challenges.has(qid);
  const opts = [
    {label: q.correct.label, correct: true},
    {label: q.wrong1.label,  correct: false},
    {label: q.wrong2?.label, correct: false},
  ].filter(o => o.label);

  // Shuffle on first render (seeded by qid so consistent)
  const seed = qid.charCodeAt(1) || 1;
  if (!done) {
    for (let i=opts.length-1;i>0;i--){const j=Math.floor((seed*(i+1))%opts.length);[opts[i],opts[j]]=[opts[j],opts[i]];}
  }

  const buttons = opts.map((o,i) =>
    `<button onclick="answerQuiz('${qid}',${o.correct})" class="quiz-opt ${done&&o.correct?'correct':''}" ${done?'disabled':''}
      style="display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:6px;
      color:var(--text);cursor:pointer;font-family:Georgia,serif;font-size:13px;
      ${done&&o.correct?'border-color:gold;color:gold;':''}">${o.label}</button>`
  ).join('');

  return `<h2>Oracle Question ${qid.replace('Q','')} / 10</h2>
<div class="marduk-voice">${q.lore||q.question||''}</div>
<p style="margin-top:12px;font-size:14px;font-style:italic;opacity:0.7;">${q.question||''}</p>
<div style="margin-top:12px;">${buttons}</div>
${done?`<p style="margin-top:10px;color:gold;">✔ Answered correctly.</p>`:''}`;
}

function answerQuiz(qid, correct) {
  if (correct) {
    LS.solveChallenge(qid);
    showNotification('✔ Correct!');
    renderTile(getTile(curX, curY));
    const allDone = Array.from({length:10},(_,i)=>`Q${i+1}`).every(q => LS.challenges.has(q));
    if (allDone) {
      LS.solveChallenge('marduk-oracle');
      showNotification('🔮 All 10 answered — Oracle of Marduk unlocked. Travel north from the Long Road.', 4000);
    }
  } else {
    showNotification('✗ Incorrect. Try again.');
  }
}

function renderTeleportList(teleports) {
  return `<ul class="teleport-list">${teleports.map(t =>
    `<li><button onclick="navigate(${t.x},${t.y})">${t.label}</button></li>`
  ).join('')}</ul>`;
}

function renderKeys() {
  const ks = LS.keys;
  const kDefs = REALM?.key_defs || {};
  document.getElementById('keys-display').innerHTML = ks.size === 0
    ? '<span style="color:rgba(255,255,255,0.2);font-size:10px;">no keys</span>'
    : [...ks].sort().map(k => {
        const def = kDefs[k] || {};
        return `<span class="key-badge" style="${def.color?`background:${def.color};`:''}${def.sym?'':''}">
          ${def.sym||''}${k}</span>`;
      }).join('');
}

// ═══════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════
const DIR_DELTA = {N:[0,1],S:[0,-1],E:[1,0],W:[-1,0]};

function renderNav(tile) {
  const dirs = {N:'nav-north',S:'nav-south',E:'nav-east',W:'nav-west'};
  const arrows = {N:'↑',S:'↓',E:'→',W:'←'};
  const lblIds = {N:'nav-n-label',S:'nav-s-label',E:'nav-e-label',W:'nav-w-label'};

  for (const [dir, id] of Object.entries(dirs)) {
    const btn = document.getElementById(id);
    const lbl = document.getElementById(lblIds[dir]);
    btn.className = 'nav-btn';
    btn.style.display = '';

    const gate = resolveGate(curX, curY, dir);

    if (gate === 'closed') {
      btn.classList.add('closed'); btn.style.display='none';
    } else if (gate === 'space') {
      btn.classList.add('space'); lbl.textContent = 'Empty Space';
    } else if (gate === 'open') {
      btn.classList.add('open');
      const [dx,dy] = DIR_DELTA[dir];
      const nb = getTile(curX+dx, curY+dy);
      lbl.textContent = (nb?.name||'').substring(0,22) || dir.toLowerCase();
    } else if (gate && gate.type === 'challenge') {
      if (LS.challenges.has(gate.id)) {
        btn.classList.add('open');
        const [dx,dy] = DIR_DELTA[dir];
        lbl.textContent = (getTile(curX+dx,curY+dy)?.name||'').substring(0,22);
      } else {
        btn.classList.add('challenge');
        lbl.textContent = ('🔒 '+(gate.label||'Challenge')).substring(0,24);
      }
    } else {
      btn.classList.add('open'); lbl.textContent = dir.toLowerCase();
    }
    btn.querySelector('.dir').textContent = arrows[dir];
  }
}

function tryNavigate(dx, dy) {
  const dir = dx===0?(dy>0?'N':'S'):(dx>0?'E':'W');
  const gate = resolveGate(curX, curY, dir);

  if (gate === 'closed') return;
  if (gate === 'open' || gate === 'space') { navigate(curX+dx, curY+dy); return; }
  if (gate && gate.type === 'challenge') {
    if (LS.challenges.has(gate.id)) navigate(curX+dx, curY+dy);
    else showChallengeOverlay(gate, curX+dx, curY+dy);
  }
}

function navigate(x, y) {
  x = Math.max(-16, Math.min(16, x));
  y = Math.max(-16, Math.min(16, y));
  window.location.href = `index.html?x=${x}&y=${y}`;
}

// ═══════════════════════════════════════════════════
// CHALLENGE OVERLAY
// ═══════════════════════════════════════════════════
function showChallengeOverlay(gate, destX, destY) {
  document.getElementById('ch-title').textContent = gate.label || 'Challenge Required';
  const descs = {
    tesseract:'A Tesseract challenge.', 'tesseract-run':'A Tesseract Run.',
    eve:'Eve Turing Test.', eli:'Eli Turing Test.', mask:'A Mask Puzzle.',
    quiz:'Complete all 10 Oracle Quiz questions (scattered around the hub) to unlock this gate.',
  };
  document.getElementById('ch-desc').textContent =
    (descs[gate.game]||'A challenge awaits.') + (gate.level ? ` Level: ${gate.level}.` : '');

  const startBtn = document.getElementById('ch-start-btn');
  if (gate.game === 'quiz') {
    startBtn.textContent = 'Go to Quiz Questions';
    startBtn.onclick = () => { closeChallengeOverlay(); window.location.href='index.html?x=-2&y=2'; };
  } else {
    startBtn.textContent = 'Begin Challenge';
    startBtn.onclick = () => launchChallenge(gate, destX, destY);
  }
  document.getElementById('challenge-overlay').classList.add('active');
}

function closeChallengeOverlay() {
  document.getElementById('challenge-overlay').classList.remove('active');
}

function launchChallenge(gate, destX, destY) {
  localStorage.setItem('mm_pending_ch', JSON.stringify({id:gate.id, destX, destY}));
  closeChallengeOverlay();
  const ret = encodeURIComponent(`index.html?x=${destX}&y=${destY}&ch_done=${gate.id}`);
  const urls = {
    tesseract:     `../tesseract/?level=${gate.level||100}&challengeId=${gate.id}&returnTo=${ret}`,
    'tesseract-run':`../tesseract-run/?level=${gate.level||100}&challengeId=${gate.id}&returnTo=${ret}`,
    eve:           `../evetest/?target=${gate.target||gate.level||100}&challengeId=${gate.id}&returnTo=${ret}`,
    eli:           `../elitest/?target=${gate.level||50}&challengeId=${gate.id}&returnTo=${ret}`,
    mask:          `../mask/?challengeId=${gate.id}&returnTo=${ret}`,
  };
  const url = urls[gate.game];
  if (url) { window.location.href = url; }
  else {
    // Dev fallback
    showNotification('Challenge URL not configured — gate bypassed (dev mode).');
    LS.solveChallenge(gate.id); closeChallengeOverlay(); navigate(destX, destY);
  }
}

// Check return from challenge
function checkChallengeReturn() {
  const done = params.get('ch_done');
  if (done) {
    LS.solveChallenge(done);
    showNotification('✔ Challenge complete — gate unlocked.');
    history.replaceState({}, '', `index.html?x=${curX}&y=${curY}`);
  }
}

// PARTICLES / SPRITES
// ═══════════════════════════════════════════════════
function initParticles(tile) {
  const c = document.getElementById('particles');
  c.innerHTML = '';
  const path = tile.on_path?.[0] || tile.type;
  const col  = PATH_COLORS[path]?.glow || 'rgba(139,105,20,0.3)';
  const n    = path==='emily'?15:path==='marduk'?20:path==='cave'?10:8;
  for (let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const sz=Math.random()*4+2, lft=Math.random()*100, dur=Math.random()*8+4, del=Math.random()*dur;
    p.style.cssText=`width:${sz}px;height:${sz}px;left:${lft}%;bottom:0;background:${col};animation-duration:${dur}s;animation-delay:-${del}s;`;
    c.appendChild(p);
  }
}

function addSprites() {
  const c = document.getElementById('particles');
  ['⚠','👁','⚡','🌀','👾','⚠'].forEach((s,i) => {
    const el = document.createElement('div');
    el.className = 'sprite';
    el.textContent = s;
    const pos = [[10,20],[80,15],[20,60],[75,70],[45,35],[60,50]];
    el.style.left = pos[i][0]+'%';
    el.style.top  = pos[i][1]+'%';
    el.style.animationDelay = (i*0.3)+'s';
    c.appendChild(el);
  });
}

function initParallax() {
  document.addEventListener('mousemove', e => {
    const cx=window.innerWidth/2, cy=window.innerHeight/2;
    const dx=(e.clientX-cx)/cx, dy=(e.clientY-cy)/cy;
    document.getElementById('manga-bg').style.transform=`scale(1.05) translate(${dx*-8}px,${dy*-8}px)`;
    document.getElementById('manga-fig').style.transform=`translate(${dx*4}px,${dy*4}px)`;
  });
  window.addEventListener('deviceorientation', e => {
    const dx=(e.gamma||0)/45, dy=(e.beta||0)/45;
    document.getElementById('manga-bg').style.transform=`scale(1.05) translate(${dx*-8}px,${dy*-8}px)`;
    document.getElementById('manga-fig').style.transform=`translate(${dx*4}px,${dy*4}px)`;
  });
}

// SKM — SuperKudraMarduk
// ═══════════════════════════════════════════════════
const SKM_CODE = 'superkudramarduk';
const SKM_KEY  = 'mm_tile_overrides';
let _skmBuf = '';

function skmLoadOverrides() {
  try { return JSON.parse(localStorage.getItem(SKM_KEY)||'{}'); } catch { return {}; }
}
function skmSaveOverrides(o) {
  try { localStorage.setItem(SKM_KEY, JSON.stringify(o)); } catch {}
}
function skmIsActive() { return document.body.classList.contains('skm-active'); }

document.addEventListener('keydown', ev => {
  if (ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (ev.key.length !== 1) return;
  _skmBuf += ev.key.toLowerCase();
  if (_skmBuf.length > SKM_CODE.length) _skmBuf = _skmBuf.slice(-SKM_CODE.length);
  if (_skmBuf === SKM_CODE) { _skmBuf=''; activateSKM(); }
});

function activateSKM() {
  localStorage.setItem('mm_kudra','1');
  document.body.classList.add('kudra-active','skm-active');
  _skmFlash();
  showNotification('✦ SUPERKUDRAMARDUK — double-tap any tile to edit.', 3500);
  renderNav(getTile(curX, curY));
}
function deactivateSKM() {
  document.body.classList.remove('skm-active');
  closeSkmPanel();
}
function _skmFlash() {
  const d=document.createElement('div');
  d.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;font-family:Georgia,serif;font-size:clamp(16px,3vw,26px);color:#f0abfc;text-shadow:0 0 30px rgba(240,171,252,0.9);pointer-events:none;text-align:center;letter-spacing:3px;animation:_skmFl 2.2s ease forwards;';
  d.textContent='✦ SUPERKUDRAMARDUK ✦';
  const s=document.createElement('style');
  s.textContent='@keyframes _skmFl{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}';
  document.head.appendChild(s); document.body.appendChild(d);
  setTimeout(()=>d.remove(),2300);
}

    <div id="skmP_image" style="${curType!=='image'?'display:none':''}">
      ${row('IMAGE URL',inp('skm_iurl',tile.image_url||'','https://...'))}
      ${row('CAPTION',inp('skm_icap',tile.image_caption||'','Optional caption'))}
    </div>
    <div style="margin-top:14px;border-top:1px solid rgba(201,168,76,0.1);padding-top:12px;">
      ${row('MAP LABEL',inp('skm_gname',tile.name||'','Short title for map cell'))}
      ${row('AMBIENT MUSIC',sel('skm_tmusic',MUSIC,tile.music||''))}
    </div>
    <div class="skm-actions">
      <button class="skm-save-btn" onclick="skm_save(${x},${y})">✦ SAVE TILE</button>
      <button class="skm-export-btn" onclick="skm_export()">↓ EXPORT JSON</button>
    </div>
    <div class="skm-note">Saves to localStorage. Export → merge into realm.json to make permanent.</div>
    <div style="margin-top:18px;border-top:1px solid rgba(192,132,252,0.12);padding-top:12px;">
      <div class="skm-section-label">⊛ DIRECTIONAL GATES</div>
      <div style="font-size:11px;color:rgba(201,168,76,0.3);margin-bottom:10px;">Block movement until challenge solved. Return always free.</div>
      ${gateRows}
    </div>`;

  panel.classList.add('open');
}

function closeSkmPanel() { document.getElementById('skm-panel').classList.remove('open'); }

function skm_setType(t) {
  ['text','game','iframe','video','image'].forEach(tp=>{
    const p=document.getElementById('skmP_'+tp); if(p) p.style.display=tp===t?'':'none';});
  document.querySelectorAll('.skm-type-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick')?.includes(`'${t}'`));});
}
function skm_insertLink(){const u=prompt('URL:');if(u)document.execCommand('createLink',false,u);}

function skm_save(x, y) {
  const k=`${x},${y}`;
  let at='text';
  ['text','game','iframe','video','image'].forEach(t=>{const p=document.getElementById('skmP_'+t);if(p&&p.style.display!=='none')at=t;});
  let patch={};
  const gname=document.getElementById('skm_gname')?.value?.trim(); if(gname) patch.name=gname;
  const tm=document.getElementById('skm_tmusic')?.value; if(tm) patch.music=tm;
  if(at==='text'){
    const nm=document.getElementById('skm_name')?.value?.trim(); if(nm) patch.name=nm;
    const lel=document.getElementById('skm_lore'); if(lel) patch.lore=lel.innerHTML;
  } else if(at==='game'){
    patch.puzzle={type:document.getElementById('skm_game')?.value||'tesseract',
      level:parseInt(document.getElementById('skm_lvl')?.value)||1,
      title:document.getElementById('skm_ptitle')?.value||'',
      desc:document.getElementById('skm_pdesc')?.value||'',
      music:document.getElementById('skm_pmusic')?.value||''};
  } else if(at==='iframe'){
    patch.embed_url=document.getElementById('skm_eurl')?.value||'';
    patch.embed_title=document.getElementById('skm_etitle')?.value||'';
  } else if(at==='video'){
    patch.video_url=document.getElementById('skm_vurl')?.value||'';
  } else if(at==='image'){
    patch.image_url=document.getElementById('skm_iurl')?.value||'';
    patch.image_caption=document.getElementById('skm_icap')?.value||'';
  }
  if(REALM&&!REALM.tiles[k]) REALM.tiles[k]={};
  if(REALM) Object.assign(REALM.tiles[k],patch);
  const ov=skmLoadOverrides(); ov[k]=Object.assign(ov[k]||{},patch); skmSaveOverrides(ov);
  const btn=document.querySelector('.skm-save-btn');
  if(btn){const o=btn.textContent;btn.textContent='✔ SAVED';setTimeout(()=>btn.textContent=o,1500);}
  if(x===curX&&y===curY) renderTile(getTile(curX,curY));
}

function skm_saveGate(x, y, dir) {
  const t=document.getElementById(`skm_g${dir}_t`)?.value;
  if(!t){skm_clearGate(x,y,dir);return;}
  const gate={type:t,title:document.getElementById(`skm_g${dir}_n`)?.value?.trim()||''};
  const lv=parseInt(document.getElementById(`skm_g${dir}_l`)?.value); if(lv) gate.level=lv;
  if(REALM){if(!REALM.gates)REALM.gates={};REALM.gates[`${x},${y}:${dir}`]=gate;}
  const ov=skmLoadOverrides(); if(!ov._gates)ov._gates={}; ov._gates[`${x},${y}:${dir}`]=gate; skmSaveOverrides(ov);
  renderNav(getTile(curX,curY)); skmOpenEditor(x,y);
}
function skm_clearGate(x, y, dir) {
  const gk=`${x},${y}:${dir}`;
  if(REALM&&REALM.gates) delete REALM.gates[gk];
  const ov=skmLoadOverrides(); if(ov._gates) delete ov._gates[gk]; skmSaveOverrides(ov);
  renderNav(getTile(curX,curY)); skmOpenEditor(x,y);
}
function skm_export() {
  const ov=skmLoadOverrides();
  const blob=new Blob([JSON.stringify(ov,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='realm-patch-v10.json'; a.click();
}

// ═══════════════════════════════════════════════════
// BOOT — fetch realm.json then init
// ═══════════════════════════════════════════════════
async function boot() {
  try {
    const res = await fetch('realm.json');
    REALM = await res.json();
  } catch(e) {
    console.error('Failed to load realm.json:', e);
    document.getElementById('loading').innerHTML = '<span style="color:#ff6060">Failed to load realm.json</span>';
    return;
  }

  document.getElementById('loading').style.display = 'none';

  LS.addVisited(curX, curY);
  LS.setLast(curX, curY);
  checkChallengeReturn();

  const tile = getTile(curX, curY);
  applyTheme(tile);
  renderTile(tile);
  renderNav(tile);
  renderKeys();
  initParticles(tile);

  if (LS.kudra) document.body.classList.add('kudra-active');
  if (skmIsActive()) {
    if (params.get('skm_open')==='1') setTimeout(()=>skmOpenEditor(curX,curY),400);
  }

  let _lastTapNav=0;
  document.getElementById('tile-outer').addEventListener('click', ()=>{
    if(!skmIsActive()) return;
    const now=Date.now(); if(now-_lastTapNav<400) skmOpenEditor(curX,curY); _lastTapNav=now;
  });

  document.getElementById('map-btn').href = `map.html?x=${curX}&y=${curY}`;
}

// Expose globals
window.navigate=navigate; window.tryNavigate=tryNavigate;
window.answerQuiz=answerQuiz; window.closeChallengeOverlay=closeChallengeOverlay;
window.deactivateSKM=deactivateSKM; window.skmOpenEditor=skmOpenEditor;
window.closeSkmPanel=closeSkmPanel; window.skm_setType=skm_setType;
window.skm_insertLink=skm_insertLink; window.skm_save=skm_save;
window.skm_saveGate=skm_saveGate; window.skm_clearGate=skm_clearGate;
window.skm_export=skm_export;

boot();
</script>
</body>
</html>
